<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECLIPSE — Live</title>
<style>
:root{
  --bg:#0b0e14; --panel:#131822; --panel2:#1a2130; --line:#232c3d;
  --tx:#e6ebf5; --dim:#8a97ad; --dim2:#5f6b80;
  --acc:#f5a524; --acc2:#ffcf70;
  --ok:#3ecf8e; --warn:#f5a524; --bad:#ef5f5f; --info:#5b9dff;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;
  padding:0 0 80px;
}
a{color:var(--info);text-decoration:none}
a:hover{text-decoration:underline}
code{font:13px/1.4 "Cascadia Code",Consolas,monospace;background:#0000004d;padding:1px 5px;border-radius:4px}

/* ---------- topbar ---------- */
header{
  position:sticky;top:0;z-index:50;background:#0b0e14f2;backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:14px 26px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.logo{font-size:19px;font-weight:700;letter-spacing:.14em}
.logo span{color:var(--acc)}
.pulse{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.dot.live{background:var(--ok);box-shadow:0 0 0 0 #3ecf8e99;animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 9px #3ecf8e00}100%{box-shadow:0 0 0 0 #3ecf8e00}}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{
  background:transparent;border:1px solid transparent;color:var(--dim);
  padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-family:inherit;
}
nav button:hover{color:var(--tx);background:var(--panel)}
nav button.on{color:#0b0e14;background:var(--acc);font-weight:600}

main{max-width:1280px;margin:0 auto;padding:26px}
.view{display:none}.view.on{display:block}

h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 14px}
h3{font-size:17px;margin:0 0 8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat .n{font-size:30px;font-weight:700;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--dim);margin-top:5px}
.stat .s{font-size:12px;color:var(--dim2);margin-top:3px}

.bar{height:7px;background:#00000059;border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .5s}

.tag{display:inline-block;font-size:11.5px;padding:2.5px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.tag.ok{color:var(--ok);border-color:#3ecf8e44;background:#3ecf8e14}
.tag.bad{color:var(--bad);border-color:#ef5f5f44;background:#ef5f5f14}
.tag.warn{color:var(--warn);border-color:#f5a52444;background:#f5a52414}
.tag.info{color:var(--info);border-color:#5b9dff44;background:#5b9dff14}

.item{border-left:3px solid var(--line);padding:11px 0 11px 14px;margin-bottom:10px}
.item.nu{border-color:var(--bad)}
.item.gauw{border-color:var(--warn)}
.item.later{border-color:var(--dim2)}
.item h4{font-size:15px;margin-bottom:5px}
.item p{font-size:13.5px;color:var(--dim);margin-bottom:6px}
.item ul{margin:6px 0 0 17px;font-size:13px;color:var(--dim)}
.item li{margin:3px 0}

.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .t{font-size:13.5px}
.row .m{font-size:12px;color:var(--dim2);white-space:nowrap}

.agent{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .2s}
.agent:hover{border-color:var(--acc)}
.agent.live{border-color:#3ecf8e55}
.agent.ongebruikt{opacity:.5}
.agent .hd{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.agent .id{font:12px monospace;color:var(--dim2)}
.agent .last{font-size:13px;color:var(--dim);max-height:60px;overflow:hidden;margin-top:7px}
.agent .tools{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}

.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
.shot{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.shot img{width:100%;height:132px;object-fit:cover;display:block;cursor:pointer}
.shot .c{padding:7px 9px;font-size:11.5px;color:var(--dim2);display:flex;justify-content:space-between}

.doclist{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:7px}
.doc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;
     background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13.5px}
.doc:hover{border-color:var(--acc);color:var(--acc2)}
.doc .meta{font-size:11px;color:var(--dim2);white-space:nowrap}

/* ---------- overlay ---------- */
.ov{position:fixed;inset:0;background:#000000d9;z-index:100;display:none;padding:34px}
.ov.on{display:block}
.ov-in{max-width:900px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
       border-radius:var(--r);max-height:100%;display:flex;flex-direction:column}
.ov-hd{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px}
.ov-bd{padding:22px 26px;overflow:auto}
.ov-bd img{max-width:100%}
.x{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:7px;
   padding:6px 13px;cursor:pointer;font-family:inherit;font-size:13px}
.x:hover{border-color:var(--acc)}

/* markdown */
.md h1{font-size:24px;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.md h2{font-size:19px;margin:22px 0 10px;color:var(--acc2);text-transform:none;letter-spacing:0}
.md h3{font-size:16px;margin:17px 0 8px;color:var(--tx)}
.md p{margin:9px 0}
.md ul,.md ol{margin:9px 0 9px 22px}
.md li{margin:4px 0}
.md table{border-collapse:collapse;width:100%;margin:13px 0;font-size:13px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--panel2)}
.md blockquote{border-left:3px solid var(--acc);padding:3px 0 3px 15px;margin:12px 0;color:var(--dim)}
.md pre{background:#00000059;padding:13px;border-radius:8px;overflow-x:auto;margin:11px 0}
.md hr{border:0;border-top:1px solid var(--line);margin:20px 0}

.msg{padding:11px 0;border-bottom:1px solid var(--line)}
.msg .who{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);margin-bottom:5px}
.msg.assistant .who{color:var(--acc)}
.msg .tx{font-size:13.5px;white-space:pre-wrap;word-break:break-word}

/* beslissingen met knoppen */
.stat.klik{cursor:pointer;transition:border-color .15s}
.stat.klik:hover{border-color:var(--acc)}
.vraag{border-left:3px solid var(--dim2)}
.vraag.p-nu{border-left-color:var(--bad)}
.vraag.p-gauw{border-left-color:var(--warn)}
.uitklap{
  background:transparent;border:1px solid var(--line);color:var(--acc2);
  border-radius:8px;padding:8px 14px;margin:13px 0 0;cursor:pointer;font:13px inherit;
}
.uitklap:hover{border-color:var(--acc)}
.meerinfo{
  margin:12px 0 0;padding:14px 16px;background:#00000038;
  border:1px solid var(--line);border-radius:9px;font-size:13.5px;
}
.meerinfo p:first-child{margin-top:0}
.audio{margin:14px 0 0;font-size:13px;color:var(--dim)}
.audio b{color:var(--tx)}
.clip{display:flex;align-items:center;gap:12px;margin:8px 0 0;flex-wrap:wrap}
.clip span{min-width:170px;font-size:12.5px;color:var(--dim2)}
.clip audio{height:34px;flex:1;min-width:220px}
.vraag h3{font-size:16px;line-height:1.35}
.vraag .waarom{font-size:13.5px;color:var(--dim);margin:10px 0 0}
.vraag .stappen{margin:12px 0 0;font-size:13px;color:var(--dim)}
.vraag .stappen b{color:var(--tx)}
.vraag .stappen ol{margin:6px 0 0 20px}
.vraag .stappen li{margin:4px 0}
.knoppen{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 0}
.kb{
  background:var(--acc);color:#0b0e14;border:0;border-radius:9px;
  padding:11px 20px;font:600 14px/1 inherit;cursor:pointer;transition:transform .1s,filter .15s;
}
.kb:hover{filter:brightness(1.12)}
.kb:active{transform:scale(.97)}
.kb.bezig{opacity:.5;cursor:wait}
.kb.gelukt{background:var(--ok)}
.gevolgen{margin:13px 0 0;font-size:12.5px;color:var(--dim2);display:grid;gap:5px}
.gevolgen b{color:var(--dim)}
.advies{margin:12px 0 0;font-size:13px;color:var(--acc2)}
.vt{
  width:100%;margin:12px 0 0;background:var(--panel2);border:1px solid var(--line);
  color:var(--tx);border-radius:8px;padding:10px 12px;font:13.5px inherit;
}
.vt:focus{outline:0;border-color:var(--acc)}

/* owner-blokkades */
.ow{padding:11px 0;border-bottom:1px solid var(--line)}
.ow:last-child{border:0;padding-bottom:0}
.ow-h{display:flex;gap:10px;align-items:baseline}
.ow-h strong{font-size:14px;font-weight:600;line-height:1.4}
.ow-m{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 0 46px;font-size:12px;color:var(--dim)}
.ow-m b{color:var(--dim2);font-weight:600}
.ow-m .src{color:var(--dim2);opacity:.6;margin-left:auto;font-size:11px}

.empty{color:var(--dim2);font-size:13.5px;padding:14px 0;font-style:italic}
.note{font-size:12.5px;color:var(--dim2);margin-top:9px}
</style>
</head>
<body>

<header>
  <div class="logo">ECLIPSE<span>.</span></div>
  <div class="pulse"><span class="dot" id="dot"></span><span id="pulse">verbinden…</span></div>
  <nav>
    <button class="on" data-v="nu">Nu</button>
    <button data-v="voortgang">Voortgang</button>
    <button data-v="agents">Agents</button>
    <button data-v="taken">Taken</button>
    <button data-v="schrijf">Schrijflaag</button>
    <button data-v="beeld">Beeld</button>
    <button data-v="docs">Documenten</button>
    <button data-v="historie">Historie</button>
  </nav>
</header>

<main>
  <section class="view on" id="v-nu"></section>
  <section class="view" id="v-voortgang"></section>
  <section class="view" id="v-agents"></section>
  <section class="view" id="v-taken"></section>
  <section class="view" id="v-schrijf"></section>
  <section class="view" id="v-beeld"></section>
  <section class="view" id="v-docs"></section>
  <section class="view" id="v-historie"></section>
</main>

<div class="ov" id="ov">
  <div class="ov-in">
    <div class="ov-hd"><h3 id="ov-t">—</h3><button class="x" onclick="closeOv()">sluiten ✕</button></div>
    <div class="ov-bd" id="ov-b"></div>
  </div>
</div>

<script src="progress_data.js"></script>
<script>
let S={}, D=(window.PROGRESS_DATA||{}), lastOk=0, cur="nu";

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- mini markdown ---------- */
function md(src){
  const lines=String(src).split(/\r?\n/); let out=[],i=0,inCode=false,code=[];
  const inline=t=>esc(t)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  while(i<lines.length){
    const l=lines[i];
    if(/^```/.test(l)){
      if(inCode){out.push("<pre>"+esc(code.join("\n"))+"</pre>");code=[];inCode=false}
      else inCode=true;
      i++;continue;
    }
    if(inCode){code.push(l);i++;continue}
    if(/^\|/.test(l)&&/^\|/.test(lines[i+1]||"")&&/^[\s|:-]+$/.test(lines[i+1])){
      const cells=r=>r.split("|").slice(1,-1).map(c=>c.trim());
      let t="<table><thead><tr>"+cells(l).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
      i+=2;
      while(i<lines.length&&/^\|/.test(lines[i])){t+="<tr>"+cells(lines[i]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";i++}
      out.push(t+"</tbody></table>");continue;
    }
    let m;
    if(m=l.match(/^(#{1,4})\s+(.*)/)){out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^(---|===)\s*$/.test(l)){out.push("<hr>");i++;continue}
    if(m=l.match(/^>\s?(.*)/)){let b=[m[1]];i++;while(i<lines.length&&/^>/.test(lines[i])){b.push(lines[i].replace(/^>\s?/,""));i++}out.push("<blockquote>"+inline(b.join(" "))+"</blockquote>");continue}
    if(/^\s*[-*]\s+/.test(l)){let b=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){b.push("<li>"+inline(lines[i].replace(/^\s*[-*]\s+/,""))+"</li>");i++}out.push("<ul>"+b.join("")+"</ul>");continue}
    if(/^\s*\d+\.\s+/.test(l)){let b=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){b.push("<li>"+inline(lines[i].replace(/^\s*\d+\.\s+/,""))+"</li>");i++}out.push("<ol>"+b.join("")+"</ol>");continue}
    if(l.trim()===""){i++;continue}
    out.push("<p>"+inline(l)+"</p>");i++;
  }
  return out.join("\n");
}

/* ---------- views ---------- */
function vNu(){
  const g=S.git||{}, t=S.tests||{}, v=S.voice||{}, sc=S.script||{}, dk=S.disk||{};
  const acties=D.ownerActies||[];
  const bar=t.total?(t.failed===0?"ok":"bad"):"";
  return `
  <div class="grid g4" style="margin-bottom:18px">
    <div class="stat"><div class="n" style="color:var(--acc)">${(D.hero&&D.hero.pct)||0}%</div><div class="l">Hele game</div><div class="s">${esc((D.hero&&D.hero.label)||"")}</div></div>
    <div class="stat"><div class="n" style="color:var(--${bar||"dim"})">${t.ok||0}/${t.total||0}</div><div class="l">Tests groen</div><div class="s">${esc(t.age||"—")}</div></div>
    <div class="stat"><div class="n">${(g.commits||[]).length?esc(g.commits[0].date):"—"}</div><div class="l">Laatste commit</div><div class="s">${g.dirty?g.dirty+" bestanden open":"werkboom schoon"}</div></div>
    <div class="stat klik" onclick="naarBeslissingen()"><div class="n" style="color:${acties.length?"var(--bad)":"var(--ok)"}">${acties.length}</div><div class="l">Wacht op jou</div><div class="s">${acties.length?"klik om te zien →":"niets te doen"}</div></div>
  </div>

  ${(()=>{
    const vr=(S.vragen||[]);
    const open=vr.filter(q=>!q.antwoord), klaar=vr.filter(q=>q.antwoord);
    if(!vr.length)return "";
    return `
    <h2>Beslissingen — druk op een knop${open.length?` · ${open.length} open`:""}</h2>
    ${open.map(q=>`
      <div class="card vraag p-${esc(q.prio||"gauw")}" id="q-${esc(q.id)}">
        <div class="ow-h">
          <span class="tag ${q.prio==="nu"?"bad":q.prio==="later"?"":"warn"}">${esc(q.id)}</span>
          <span class="tag ${q.prio==="nu"?"bad":q.prio==="later"?"":"warn"}">${esc(q.prio||"gauw")}</span>
          <h3 style="margin:0">${esc(q.vraag)}</h3></div>
        ${q.waarom?`<p class="waarom">${esc(q.waarom)}</p>`:""}
        ${(q.stappen&&q.stappen.length)?`
          <div class="stappen"><b>Wat je doet:</b><ol>${q.stappen.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`:""}
        ${q.meer_info?`
          <button class="uitklap" onclick="klapUit('mi-${esc(q.id)}',this)">Hoe doe ik dit precies? ▾</button>
          <div class="md meerinfo" id="mi-${esc(q.id)}" style="display:none">${md(q.meer_info)}</div>`:""}
        ${(q.audio&&q.audio.length)?`
          <div class="audio"><b>Luister hier:</b>
            ${q.audio.map(a=>`<div class="clip"><span>${esc(a.naam)}</span>
              <audio controls preload="none" src="${a.url}"></audio></div>`).join("")}
          </div>`:(q.audio_map?`<div class="note">Zodra de fragmenten gegenereerd zijn, verschijnen ze hier als afspeelknopjes. Nu is er nog niets.</div>`:"")}
        <div class="knoppen">
          ${(q.opties||[]).map(o=>`
            <button class="kb" onclick="antwoord('${esc(q.id)}','${esc(o.waarde)}',this)"
                    title="${esc(o.gevolg||"")}">${esc(o.label)}</button>`).join("")}
        </div>
        ${(q.opties||[]).some(o=>o.gevolg)?`<div class="gevolgen">
          ${(q.opties||[]).filter(o=>o.gevolg).map(o=>`<div><b>${esc(o.label)}</b> — ${esc(o.gevolg)}</div>`).join("")}
        </div>`:""}
        ${q.advies?`<div class="advies"><b>Mijn advies:</b> ${esc(q.advies)}</div>`:""}
        ${q.vrijtekst?`<input class="vt" id="vt-${esc(q.id)}" placeholder="Iets toe te voegen? (optioneel)">`:""}
      </div>`).join("")}
    ${klaar.length?`<div class="card"><h3>Beantwoord <span class="tag ok">${klaar.length}</span></h3>
      ${klaar.map(q=>`<div class="row"><span class="t"><span class="tag ok">${esc(q.id)}</span> ${esc(q.vraag)}</span>
        <span class="m"><strong style="color:var(--ok)">${esc(q.antwoord.waarde)}</strong> · ${esc(q.antwoord.tijd)}</span></div>`).join("")}
      <div class="note">Deze antwoorden staan in <code>phase0/OWNER_ANSWERS.md</code> — de agents lezen dat elke sessie.</div>
    </div>`:""}`;
  })()}

  ${(()=>{
    const ow=(S.owner||[]).filter(r=>!r.klaar);
    const bucket=r=>{const w=((r.wanneer||r.duur||"")+" "+(r.id||"")).toLowerCase();
      if(/\bnu\b|staande|bovenaan/.test(w))return 0;
      if(/gauw|zodra|rond|augustus|\bbij\b/.test(w))return 1;
      return 2;};
    const groepen=[
      {n:0,t:"Nu — dit houdt werk tegen",k:"bad"},
      {n:1,t:"Gauw",k:"warn"},
      {n:2,t:"Later / staand",k:""}
    ];
    if(!ow.length)return '<h2>Wacht op jou</h2><div class="card"><div class="empty">Niets openstaand.</div></div>';
    return `<h2>Wacht op jou — ${ow.length} open</h2>` + groepen.map(g=>{
      const rows=ow.filter(r=>bucket(r)===g.n);
      if(!rows.length)return "";
      return `<div class="card">
        <h3>${esc(g.t)} <span class="tag ${g.k}">${rows.length}</span></h3>
        ${rows.map(r=>`
          <div class="ow">
            <div class="ow-h">
              <span class="tag ${g.k}">${esc(r.id)}</span>
              <strong>${esc(r.actie||"")}</strong>
            </div>
            <div class="ow-m">
              ${r.blokkeert&&r.blokkeert!=="—"?`<span><b>blokkeert:</b> ${esc(r.blokkeert)}</span>`:""}
              ${r.wanneer||r.duur?`<span><b>wanneer:</b> ${esc(r.wanneer||r.duur)}</span>`:""}
              <span class="src">${esc(r.bron||"")}</span>
            </div>
          </div>`).join("")}
      </div>`;}).join("");
  })()}

  ${acties.length?`<h2>Uitgewerkt — met stappen</h2>
  <div class="card">${acties.map(a=>`
    <div class="item ${esc(a.prio||"later")}">
      <h4>${esc(a.titel||"")} <span class="tag ${a.prio==="nu"?"bad":a.prio==="gauw"?"warn":""}">${esc(a.prio||"")}</span></h4>
      ${a.waarom?`<p>${esc(a.waarom).slice(0,700)}</p>`:""}
      ${a.stappen?`<ul>${a.stappen.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}
    </div>`).join("")}</div>`:""}

  ${(()=>{const ab=(D.abTests||[]).filter(t=>t.status!=="beslist");
    if(!ab.length)return "";
    return `<h2>Keuzes die op jou wachten</h2><div class="card">${ab.map(t=>`
      <div class="item gauw">
        <h4>${esc(t.titel||"")}</h4>
        ${t.vraag?`<p>${esc(String(t.vraag).slice(0,600))}</p>`:""}
        ${t.opties?`<ul>${(Array.isArray(t.opties)?t.opties:[t.opties]).map(o=>`<li>${esc(typeof o==="string"?o:(o.label||o.tekst||JSON.stringify(o)))}</li>`).join("")}</ul>`:""}
        ${t.aanbeveling?`<div class="note"><strong>Mijn advies:</strong> ${esc(t.aanbeveling)}</div>`:""}
      </div>`).join("")}</div>`;})()}

  <div class="grid g2">
    <div class="card">
      <h2>Credits — ElevenLabs</h2>
      <div style="font-size:27px;font-weight:700">${(v.spent||0).toLocaleString("nl")} <span style="font-size:15px;color:var(--dim)">/ ${(v.budget||0).toLocaleString("nl")}</span></div>
      <div class="bar"><i style="width:${Math.min(100,v.pct||0)}%"></i></div>
      <div class="note">${(v.remaining||0).toLocaleString("nl")} over · reserve 20.000 · stop bij 290.000</div>
    </div>
    <div class="card">
      <h2>Schrijflaag</h2>
      <div style="font-size:27px;font-weight:700">${sc.total||0} <span style="font-size:15px;color:var(--dim)">scènes</span></div>
      <div class="note">
        <span class="tag">${(sc.counts&&sc.counts.draft)||0} draft</span>
        <span class="tag info">${(sc.counts&&sc.counts["critic-pass"])||0} goedgekeurd</span>
        <span class="tag ok">${(sc.counts&&sc.counts.generated)||0} ingesproken</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Systeem</h2>
    <div class="row"><span class="t">Screenshots op schijf</span><span class="m">${dk.shotCount||0} bestanden · ${dk.screenshotsGB||0} GB</span></div>
    <div class="row"><span class="t">Branch</span><span class="m">${esc(g.branch||"?")}</span></div>
    <div class="row"><span class="t">Laatste scan</span><span class="m">${esc(S.generatedAt||"—")}</span></div>
  </div>`;
}

function vAgents(){
  const A=S.agents||{}, defs=A.definities||[], runs=A.runs||[], ses=A.sessies||[];
  if(!defs.length&&!runs.length)return '<h2>Agents</h2><div class="card"><div class="empty">Scannen…</div></div>';

  const spoorTag=s=>s==="A"?'<span class="tag info">spoor A</span>'
                  :s==="B"?'<span class="tag warn">spoor B</span>'
                  :'<span class="tag">altijd</span>';

  return `
  <h2>De agents — ${defs.length} gedefinieerd · ${A.totaalRuns||0} keer ingezet</h2>
  <div class="grid g2" style="margin-bottom:18px">${defs.map(d=>`
    <div class="agent ${d.runs?"":"ongebruikt"}">
      <div class="hd">
        <strong>${esc(d.name)}</strong>
        ${spoorTag(d.spoor)}
        <span style="margin-left:auto" class="m">${d.runs?d.runs+"× ingezet":"nog nooit"}</span>
      </div>
      <div class="last">${esc(d.desc)}</div>
      ${d.lastTask?`<div class="note" style="margin-top:8px">Laatst: <strong>${esc(d.lastTask)}</strong><br><span class="m">${esc((d.lastTime||"").slice(0,16).replace("T"," "))}</span></div>`:""}
    </div>`).join("")}</div>

  <h2>Wat de agents gedaan hebben — laatste ${runs.length}</h2>
  <div class="card">${runs.length?runs.map((r,i)=>`
    <div class="row" ${r.file?`style="cursor:pointer" onclick="openRun(${i})"`:""}>
      <span class="t"><span class="tag ${r.type&&r.type.indexOf("-")>0?"info":""}">${esc(r.type)}</span> ${esc(r.desc||"(geen omschrijving)")}</span>
      <span class="m">${esc(r.ago||"")}${r.file?" · klik":""}</span>
    </div>`).join(""):'<div class="empty">Nog geen agents ingezet.</div>'}
  </div>

  <h2>Levende sessies <span class="tag">laatste 24 uur</span></h2>
  <div class="card">
    ${ses.length?ses.map(s=>`
      <div class="row" style="cursor:pointer" onclick="openAgent('${esc(s.id)}')">
        <span class="t"><span class="dot ${s.active?"live":""}" style="display:inline-block;margin-right:7px"></span>
          ${s.active?"<strong>Actief nu</strong>":"Rust"} — ${esc((s.lastText||"(gereedschap)").slice(0,90))}</span>
        <span class="m">${esc(s.modified)} · ${s.sizeMB} MB</span>
      </div>`).join(""):'<div class="empty">Geen sessie in de laatste 24 uur.</div>'}
    <div class="note">Oudere chatsessies worden bewust niet getoond — daar staat niets in dat nog meespeelt.</div>
  </div>`;
}

const STATUS_TAG={bezig:"warn","af":"ok",klaar:"ok",gedaan:"ok",wacht:"bad",gepland:"",open:""};
const STATUS_ORDER=["bezig","wacht","gepland","open","af","klaar","gedaan"];

function vVoortgang(){
  const s=D.secties||[], e=D.eta||{};
  if(!s.length)return '<h2>Voortgang</h2><div class="card"><div class="empty">Geen secties in progress_data.js.</div></div>';
  return `
  <h2>Inschatting</h2>
  <div class="card">
    ${Object.entries(e).filter(([k])=>k!=="bijgesteld"&&k!=="toelichting").map(([k,v])=>
      `<div class="item later"><h4>${esc(k)}</h4><p>${esc(v)}</p></div>`).join("")}
    ${e.toelichting?`<div class="note">${esc(e.toelichting)}${e.bijgesteld?" · bijgesteld "+esc(e.bijgesteld):""}</div>`:""}
  </div>

  <h2>Per onderdeel</h2>
  ${s.map(sec=>{
    const items=sec.items||[];
    const gem=items.length?Math.round(items.reduce((a,i)=>a+(i.pct||0),0)/items.length):0;
    return `<div class="card">
      <h3>${esc(sec.titel)} <span class="tag">${esc(sec.scope||"")}</span>
        <span style="float:right;font-size:14px;color:var(--acc)">${gem}%</span></h3>
      <div class="bar" style="margin-bottom:14px"><i style="width:${gem}%"></i></div>
      ${items.map(i=>`
        <div style="padding:11px 0;border-bottom:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
            <strong style="font-size:14px">${esc(i.naam||"")}</strong>
            <span class="m">${i.pct!=null?i.pct+"%":""}${i.doel?" · doel "+esc(i.doel):""}</span>
          </div>
          <div class="bar" style="margin:7px 0"><i style="width:${i.pct||0}%"></i></div>
          ${i.groot?`<p style="font-size:13px;color:var(--dim);margin-top:5px">${esc(i.groot)}</p>`:""}
          ${i.notitie?`<div class="note">${esc(i.notitie)}</div>`:""}
        </div>`).join("")}
    </div>`;
  }).join("")}`;
}

function vTaken(){
  const t=D.taken||[];
  if(!t.length)return '<h2>Taken</h2><div class="card"><div class="empty">Geen taken in progress_data.js.</div></div>';
  const groups={};
  t.forEach(x=>{const k=(x.status||"overig").toLowerCase();(groups[k]=groups[k]||[]).push(x)});
  const keys=Object.keys(groups).sort((a,b)=>{
    const ia=STATUS_ORDER.indexOf(a), ib=STATUS_ORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  return `<h2>Taken — ${t.length} totaal</h2>`+keys.map(k=>`
    <div class="card">
      <h3>${esc(k)} <span class="tag ${STATUS_TAG[k]||""}">${groups[k].length}</span></h3>
      ${groups[k].map(x=>`
        <div style="padding:10px 0;border-bottom:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
            <span style="font-size:14px">${esc(x.taak||"")}</span>
            <span class="m">${x.pct!=null?x.pct+"%":""}</span>
          </div>
          ${x.pct!=null?`<div class="bar" style="margin:6px 0"><i style="width:${x.pct}%"></i></div>`:""}
          ${x.detail?`<p style="font-size:12.5px;color:var(--dim);margin-top:4px">${esc(String(x.detail).slice(0,420))}</p>`:""}
        </div>`).join("")}
    </div>`).join("");
}

function vSchrijf(){
  const sc=S.script||{}, v=S.voice||{};
  return `<h2>Schrijflaag & stem</h2>
  <div class="grid g3" style="margin-bottom:14px">
    <div class="stat"><div class="n">${sc.total||0}</div><div class="l">Scènes</div></div>
    <div class="stat"><div class="n">${(sc.words||0).toLocaleString("nl")}</div><div class="l">Woorden geschreven</div></div>
    <div class="stat"><div class="n">${(v.remaining||0).toLocaleString("nl")}</div><div class="l">Credits over</div></div>
  </div>
  <div class="card"><h3>Scènes</h3>
    ${(sc.scenes||[]).length?(sc.scenes||[]).map(s=>`<div class="row">
      <span class="t">${esc(s.title)}</span>
      <span class="m"><span class="tag ${s.status==="generated"?"ok":s.status==="critic-pass"?"info":""}">${esc(s.status)}</span></span>
    </div>`).join(""):'<div class="empty">Nog geen scriptbestanden. Ze komen in Eclipse/Content/Script/.</div>'}
  </div>
  <div class="card"><h3>Credit-ledger</h3>
    ${(v.rows||[]).length?(v.rows||[]).map(r=>`<div class="row">
      <span class="t">${esc(r.scope)} <span class="tag">tier ${esc(r.tier)}</span></span>
      <span class="m">${r.credits.toLocaleString("nl")} · ${esc(r.datum)}</span></div>`).join(""):
      '<div class="empty">Nog niets uitgegeven. phase0/VOICE_LEDGER.md is leeg.</div>'}
  </div>`;
}

function vBeeld(){
  const s=S.shots||[], cur=D.screenshots||[];
  return `
  ${cur.length?`<h2>Uitgelicht — door de agent gekozen</h2>
  <div class="shots" style="margin-bottom:22px">${cur.map(x=>`<div class="shot">
    <img src="${esc(x.file)}" loading="lazy" onclick="openImg('${esc(x.file)}','${esc(x.caption||"")}')">
    <div class="c" style="display:block"><span>${esc(x.caption||"")}</span></div></div>`).join("")}</div>`:""}

  <h2>Wat de agent nu ziet — laatste ${s.length}</h2>
  ${s.length?`<div class="shots">${s.map(x=>`<div class="shot">
    <img src="${x.url}" loading="lazy" onclick="openImg('${x.url}','${esc(x.name)}')">
    <div class="c"><span>${esc(x.modified)}</span><span>${x.kb} KB</span></div></div>`).join("")}</div>`
   :'<div class="card"><div class="empty">Geen screenshots.</div></div>'}
  <div class="card" style="margin-top:14px"><div class="note">Er worden er automatisch maar 50 bewaard — de dashboardserver ruimt de rest zelf op, zodat de map niet weer naar 1,9 GB groeit.</div></div>`;
}

const DOC_UITLEG={
  "JOUW_ACTIES.md":"Wat jij moet doen, wanneer, en hoe. Begin hier.",
  "STATUS.md":"Waar het project staat — de korte versie.",
  "BESTURING.md":"Het knoppenschema van de game.",
};

function vDocs(){
  const g=S.docs||{};
  const keys=Object.keys(g);
  if(!keys.length)return '<h2>Documenten</h2><div class="card"><div class="empty">Scannen…</div></div>';

  const mijn=g["Voor jou"]||[];
  const rest=keys.filter(k=>k!=="Voor jou");

  return `
  ${mijn.length?`<h2>Voor jou</h2>
  <div class="grid g3" style="margin-bottom:22px">${mijn.map(d=>`
    <div class="card" style="margin:0;cursor:pointer" onclick="openDoc('${esc(d.path)}')">
      <h3 style="color:var(--acc2)">${esc(d.name.replace(/\.md$/,"").replace(/_/g," "))}</h3>
      <p style="font-size:13px;color:var(--dim);margin:6px 0 0">${esc(DOC_UITLEG[d.name]||"")}</p>
      <div class="note">${d.kb} KB · ${esc(d.modified)}</div>
    </div>`).join("")}</div>`:""}

  <h2>Voor de agents</h2>
  <div class="card"><div class="note" style="margin:0">Deze documenten zijn geschreven om door agents gelezen te worden — daarom zijn ze dicht en technisch. Je hoeft ze nooit te openen; alles wat jou aangaat staat hierboven en op het tabblad <strong>Nu</strong>.</div></div>
  ${rest.map(k=>`
    <div class="card"><h3>${esc(k)} <span class="tag">${g[k].length}</span></h3>
    <div class="doclist">${g[k].map(d=>`
      <div class="doc" onclick="openDoc('${esc(d.path)}')">
        <span>${esc(d.name)}</span><span class="meta">${d.kb} KB · ${esc(d.modified)}</span>
      </div>`).join("")}</div></div>`).join("")}`;
}

function vHistorie(){
  const g=S.git||{}, gd=D.jijGedaan||[], cl=D.changelog||[];
  return `<h2>Historie</h2>
  <div class="card"><h3>Laatste commits <span class="tag">${(g.commits||[]).length}</span></h3>
    ${(g.commits||[]).map(c=>`<div class="row"><span class="t"><code>${esc(c.hash)}</code> ${esc(c.msg)}</span><span class="m">${esc(c.date)}</span></div>`).join("")}
  </div>

  <div class="card"><h3>Wat jij hebt aangeleverd <span class="tag">${gd.length}</span></h3>
    ${gd.length?gd.slice(0,12).map(x=>`<div class="item later"><p>${esc(String(x.wat||"")).slice(0,600)}</p>
      ${x.tijd?`<span class="m">${esc(x.tijd)}</span>`:""}</div>`).join(""):'<div class="empty">—</div>'}
  </div>

  <div class="card"><h3>Sessielogboek <span class="tag">${cl.length}</span></h3>
    ${cl.length?cl.slice(0,8).map(c=>`
      <div style="padding:12px 0;border-bottom:1px solid var(--line)">
        <strong style="font-size:14px">${esc(c.datum||"")}</strong>
        <ul style="margin:7px 0 0 18px;font-size:12.5px;color:var(--dim)">
          ${(c.punten||[]).slice(0,6).map(p=>`<li style="margin:4px 0">${esc(String(p).slice(0,320))}</li>`).join("")}
        </ul>
      </div>`).join(""):'<div class="empty">—</div>'}
  </div>`;
}

const VIEWS={nu:vNu,voortgang:vVoortgang,agents:vAgents,taken:vTaken,schrijf:vSchrijf,beeld:vBeeld,docs:vDocs,historie:vHistorie};

function render(){
  try{document.getElementById("v-"+cur).innerHTML=VIEWS[cur]();}
  catch(e){document.getElementById("v-"+cur).innerHTML='<div class="card"><div class="empty">Renderfout: '+esc(e.message)+'</div></div>';}
}

/* ---------- overlay ---------- */
const ov=document.getElementById("ov");
function closeOv(){ov.classList.remove("on")}
ov.addEventListener("click",e=>{if(e.target===ov)closeOv()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeOv()});

async function openDoc(p){
  document.getElementById("ov-t").textContent=p;
  document.getElementById("ov-b").innerHTML='<div class="empty">Laden…</div>';
  ov.classList.add("on");
  try{
    const r=await fetch("/api/doc?path="+encodeURIComponent(p));
    const j=await r.json();
    document.getElementById("ov-b").innerHTML=j.error?'<div class="empty">'+esc(j.error)+'</div>':'<div class="md">'+md(j.text)+'</div>';
  }catch(e){document.getElementById("ov-b").innerHTML='<div class="empty">Kon niet laden.</div>'}
}
async function openAgent(id){
  document.getElementById("ov-t").textContent="Agent "+id.slice(0,8);
  document.getElementById("ov-b").innerHTML='<div class="empty">Laden…</div>';
  ov.classList.add("on");
  try{
    const r=await fetch("/api/agent?id="+encodeURIComponent(id));
    const j=await r.json();
    const m=j.messages||[];
    document.getElementById("ov-b").innerHTML=m.length?m.map(x=>`
      <div class="msg ${esc(x.role)}"><div class="who">${x.role==="assistant"?"Claude":"Nathan"}${x.tools&&x.tools.length?" · "+x.tools.map(esc).join(", "):""}</div>
      <div class="tx">${esc(x.text||"(gereedschap)")}</div></div>`).join(""):'<div class="empty">Geen berichten.</div>';
    const b=document.getElementById("ov-b");b.scrollTop=b.scrollHeight;
  }catch(e){document.getElementById("ov-b").innerHTML='<div class="empty">Kon niet laden.</div>'}
}
function openRun(i){
  const r=((S.agents||{}).runs||[])[i]; if(!r)return;
  document.getElementById("ov-t").textContent=r.type+" — "+(r.desc||"");
  document.getElementById("ov-b").innerHTML=
    `<div class="msg"><div class="who">Opdracht</div><div class="tx">${esc(r.desc||"—")}</div></div>`+
    `<div class="msg assistant"><div class="who">Wat eruit kwam</div><div class="tx">${esc(r.result||"(geen resultaat vastgelegd)")}</div></div>`+
    `<div class="note" style="margin-top:14px">${esc(r.ago||"")}</div>`;
  ov.classList.add("on");
}
function openImg(u,n){
  document.getElementById("ov-t").textContent=n;
  document.getElementById("ov-b").innerHTML='<img src="'+u+'">';
  ov.classList.add("on");
}

/* ---------- uitklappen & navigeren ---------- */
function klapUit(id,btn){
  const el=document.getElementById(id); if(!el)return;
  const open=el.style.display!=="none";
  el.style.display=open?"none":"block";
  btn.textContent=open?"Hoe doe ik dit precies? ▾":"Verberg uitleg ▴";
}
function naarBeslissingen(){
  const el=document.querySelector(".vraag");
  if(el)el.scrollIntoView({behavior:"smooth",block:"center"});
  else{const h=[...document.querySelectorAll("#v-nu h2")].find(x=>/wacht op jou/i.test(x.textContent));
       if(h)h.scrollIntoView({behavior:"smooth",block:"start"});}
}

/* ---------- antwoord doorgeven ---------- */
async function antwoord(id,waarde,btn){
  const veld=document.getElementById("vt-"+id);
  const tekst=veld?veld.value.trim():"";
  const rij=btn.parentElement;
  [...rij.querySelectorAll(".kb")].forEach(b=>b.classList.add("bezig"));
  btn.textContent="bezig…";
  try{
    const r=await fetch("/api/answer",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id,waarde,tekst})
    });
    const j=await r.json();
    if(!j.ok)throw new Error(j.fout||"onbekende fout");
    btn.classList.remove("bezig");btn.classList.add("gelukt");
    btn.textContent="✓ doorgegeven";
    const kaart=document.getElementById("q-"+id);
    if(kaart){
      const m=document.createElement("div");
      m.className="advies";
      m.innerHTML="<b>Doorgegeven.</b> De agents lezen dit uit phase0/OWNER_ANSWERS.md.";
      kaart.appendChild(m);
    }
    setTimeout(poll,900);
  }catch(e){
    [...rij.querySelectorAll(".kb")].forEach(b=>b.classList.remove("bezig"));
    btn.textContent="mislukt — probeer opnieuw";
  }
}

/* ---------- nav ---------- */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");cur=b.dataset.v;
  document.getElementById("v-"+cur).classList.add("on");render();
});

/* ---------- live poll ---------- */
async function poll(){
  try{
    const r=await fetch("/api/state",{cache:"no-store"});
    S=await r.json();lastOk=Date.now();render();
  }catch(e){/* server plat */}
  const live=Date.now()-lastOk<12000;
  document.getElementById("dot").className="dot"+(live?" live":"");
  document.getElementById("pulse").textContent=live
    ? "live · "+new Date().toLocaleTimeString("nl")
    : "GEEN VERBINDING — start START_DASHBOARD.bat";
}
poll();setInterval(poll,5000);
setInterval(()=>{const l=Date.now()-lastOk<12000;document.getElementById("dot").className="dot"+(l?" live":"")},2000);
</script>
