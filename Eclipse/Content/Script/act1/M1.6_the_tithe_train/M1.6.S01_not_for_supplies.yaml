# ---- header ----
scene:        M1.6.S01
mission:      M1.6
title:        "Not For Supplies"
act:          1
location:     "Kessara / Underworks / Hollow Point — Map Table"
type:         cutscene
credit_tier:  2

# ---- the three-sentence contract (18.7) ----
want:         "Mara wants to hit a train that carries nothing Ember can use."
obstacle:     "Every previous target paid for itself; this one costs materials, ammunition and probably people."
turn:         "Brick speaks first, for the only time in the act, and after that nobody argues."

# ---- state ----
status:       draft
critic:       GO
words:        229

# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.6.md ----
# cast:      MARA, VOSS, DEX, REYES, BRICK, the cell
# flags-in:  Story.Beat.M15_Cells · Story.Choice.M15_IronChorusPact
# flags-out: none
# beats:     1) what the Tithe is, told through what it takes every month. Never explained (18.8)
#            2) Dex objects, and it is a GOOD objection: this yields nothing
#            3) Reyes prices a train assault in wounded
#            4) BRICK SPEAKS FIRST. 18.4 says he never does. This once he does, and
#               nothing is explained about it. Two sentences maximum
#            5) silence
#            6) Mara puts it on the map
# canon:     AR-11 pays here for the first time - the Tithe took Brick off Krad-9. He does
#            not say so. He says something else, and the player is only sure in S03.
# writer:    do not have anyone react to Brick speaking first. The room reacting would
#            explain the beat, and explaining it is what kills it.

# ---- dialogue-writer notes (L2) ----
# band:      `cutscene`. Ceiling 60, respected (longest 21 w at .070). Register reached at
#            .070 (21 w >= 20). Spread 4 w (.020) to 21 w (.070) = 5.25x. L1-R1 clean.
# ar-5:      no "you" and no "your" in any Mara line in this scene. Checked line by line.
# brick:     .140 IS the beat, and it is written as an INTERRUPTION. He cuts across a
#            question that was not aimed at him and answers a different one. 18.4 says he
#            never speaks first in a group; this once he does, over the top of somebody
#            else, and no line in the room acknowledges it. The shot is silence and Dex
#            looking at the map instead of at him. That is the entire reaction, per the stub.
#            His two sentences are a fact about the cars that only a passenger would own.
#            The player does not know that yet. He will in S03.
# plants:    - THE SWITCH (.170 / .180). Voss names the mechanism S04's choice turns on.
#              Cashed at M1.6.S04.010-.090. Unremarked here, and nobody asks him why.
#            - "pays us in mouths" (.060). Dex's phrase is the seed of S99's word problem.
#            - "the ninth of the month" (.040). Sela re-uses those five words in S03.170 as
#              the Blight's instalment plan. The player hears them here as a freight timetable.
# player:    .150 is Voss's interjection (18.7 - interjection satisfies the participation
#            rule). It carries no `choice:` block on purpose: an option pair whose `set`
#            nothing reads would fail L1-R2's choice-integrity check. One question, real,
#            unbranched.
# jokes:     Dex gets one comic beat (.060) and it is the frightened one (18.6).
# omitted:   nobody says that this mission is different from the other missions. The room
#            already knows, and saying it is the thesis statement 18.9 A bans.

lines:
  - id:      M1.6.S01.010
    speaker: MARA
    voice:   mara
    text:    "Fourteen cars leave the Mid-Works on the ninth. Twelve of them are ore."
    shot:    "Map table. She lays a length of cable across it for the line and weights both ends."

  - id:      M1.6.S01.020
    speaker: DEX
    voice:   dex
    text:    "And the other two?"

  - id:      M1.6.S01.030
    speaker: MARA
    voice:   mara
    text:    "Grates in the roof. So they can be counted from above without anybody opening a door."
    note:    "18.8 - the Tithe is told through what it takes, and never explained."

  - id:      M1.6.S01.040
    speaker: MARA
    voice:   mara
    text:    "It runs on the ninth of every month, and it has never once been late."
    note:    "The date. Sela re-uses it in S03.170 and it stops being a timetable."

  - id:      M1.6.S01.050
    speaker: DEX
    voice:   dex
    text:    "Twelve cars of ore and we're going for the two with nothing in them."

  - id:      M1.6.S01.060
    speaker: DEX
    voice:   dex
    tags:    [nervous]
    text:    "Four cutting charges. That's the whole cabinet, on a train that pays us in mouths."
    note:    "Dex's objection is GOOD, and it is also his joke, and the joke costs him (18.6). Seeds S99's problem."

  - id:      M1.6.S01.070
    speaker: REYES
    voice:   reyes
    text:    "How many of the wounded will be ours, and how many will be the ones we are taking off the train?"
    note:    "18.4 Reyes: asks a question instead of accusing. It is also the only pricing nobody in the room had done."

  - id:      M1.6.S01.080
    speaker: REYES
    voice:   reyes
    text:    "I have plasma for six people. I do not have it for sixty-six."
    note:    "No contractions. She is stressed and the training reasserts."

  - id:      M1.6.S01.090
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Ammunition we don't get back."

  - id:      M1.6.S01.100
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "How many are in the two cars?"

  - id:      M1.6.S01.110
    speaker: MARA
    voice:   mara
    text:    "Nobody outside that yard has ever counted them."

  - id:      M1.6.S01.120
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Then that isn't a number. That's a hope."

  - id:      M1.6.S01.130
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Every run so far bought the next one. What does this one buy--"

  - id:         M1.6.S01.140
    speaker:    BRICK
    voice:      brick
    interrupts: true
    text:       "They water them at the yard. Not before."
    shot:       "Nobody had asked him anything. Nobody answers. Dex looks at the map instead of at him."
    note:       "THE TURN. AR-11's first payment. 18.4: Brick never speaks first in a group; this once he does, and he does it over the top of somebody else. No explanation, no reaction line."

  - id:      M1.6.S01.150
    speaker: VOSS
    voice:   voss
    tags:    [pause]
    text:    "What happens to them at the yard?"

  - id:      M1.6.S01.160
    speaker: MARA
    voice:   mara
    text:    "The manifest counts the ore. It counts the rest the same way."

  - id:      M1.6.S01.170
    speaker: VOSS
    voice:   voss
    text:    "That line runs our side of the depot for a kilometre. There's a switch at the end of it."
    note:    "18.4 Voss: names the mechanism, unasked. PLANT - S04's choice happens at this switch."

  - id:      M1.6.S01.180
    speaker: VOSS
    voice:   voss
    text:    "Underworks spur one way, muster yard the other. Whoever's standing at that lever picks."

  - id:      M1.6.S01.190
    speaker: MARA
    voice:   mara
    text:    "Then we stand at it."

  - id:      M1.6.S01.200
    speaker: MARA
    voice:   mara
    text:    "Charges on the couplings, not the cars."

  - id:      M1.6.S01.210
    speaker: MARA
    voice:   mara
    tags:    [pause]
    text:    "Put it on the table."
    shot:    "She moves the cable up past the depot and leaves her hand on it. Dex is already looking at the cabinet with the four charges in it."
