# ---- header ----
scene:        M1.6.S01
mission:      M1.6
title:        "Not For Supplies"
act:          1
location:     "Kessara / Underworks / Hollow Point — Map Table"
type:         cutscene
credit_tier:  2

# ---- the three-sentence contract (18.7) ----
want:         "Mara wants to hit a train that carries nothing Ember can use."
obstacle:     "Every previous target paid for itself; this one costs materials, ammunition and probably people."
turn:         "Brick speaks first, for the only time in the act, and after that nobody argues."

# ---- state ----
status:       draft
critic:       null
words:        232

# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.6.md ----
# cast:      MARA, VOSS, DEX, REYES, BRICK, the cell
# flags-in:  Story.Beat.M15_Cells · Story.Choice.M15_IronChorusPact
# flags-out: none
# beats:     1) what the Tithe is, told through what it takes every month. Never explained (18.8)
#            2) Dex objects, and it is a GOOD objection: this yields nothing
#            3) Reyes prices a train assault in wounded
#            4) BRICK SPEAKS FIRST. 18.4 says he never does. This once he does, and
#               nothing is explained about it. Two sentences maximum
#            5) silence
#            6) Mara puts it on the map
# canon:     AR-11 pays here for the first time - the Tithe took Brick off Krad-9. He does
#            not say so. He says something else, and the player is only sure in S03.
# writer:    do not have anyone react to Brick speaking first. The room reacting would
#            explain the beat, and explaining it is what kills it.

# ---- dialogue-writer notes (L2) ----
# band:      type is `cutscene` (20-60 per 18.3), read as a CEILING, exactly as M1.1
#            established (see M1.1.S01 L2 notes). The 3x variance rule and a 20-word floor
#            cannot both hold. Ceiling respected: longest line 20 w.
# variance:  1 w (.150 "No." is in S03; here 4 w ".020") to 20 w (.070) = 5x.
# ar-5:      Mara spends no "you" and no "your" anywhere in this scene. Checked line by line.
# brick:     .140 is the beat. It is written as an INTERRUPTION, not a turn - he cuts across
#            a question that was not aimed at him and answers a different one. Nobody in the
#            room acknowledges that he spoke; the shot is the only reaction and it is silence.
#            His two sentences are a fact about the cars that only a passenger would own.
#            The player does not know that yet. He will in S03.
# plants:    - the SWITCH (.180/.190) - Voss names the mechanism S04's choice turns on. Cashed
#              in M1.6.S04.010-.060. Unremarked here.
#            - "pays us in mouths" (.060) - Dex's phrase is the seed of S99's word problem.
#            - "the ninth of the month" (.040) - Sela re-uses the date in S03.150 as the
#              Blight's instalment plan. Same three words, different meaning.
# choice:    .150 / .160 are the player's interjection (supplies angle / people angle).
#            SCRIPT_FORMAT still has no player-choice construct - marked by note only, same
#            escalation M1.1 already filed. .170 answers either one, so no flag is needed.
# jokes:     Dex gets one comic beat in this scene (.060) and it is the frightened one (18.6).
# omitted:   nobody says the mission is different from the other missions. The room already
#            knows and saying it would be the thesis statement 18.9 A bans.

lines:
  - id:      M1.6.S01.010
    speaker: MARA
    voice:   mara_sovann
    text:    "Fourteen cars leave the Mid-Works on the ninth. Twelve of them are ore."
    shot:    "Map table. She lays a length of cable across it for the line and weights both ends."

  - id:      M1.6.S01.020
    speaker: DEX
    voice:   dex_callum
    text:    "And the other two?"

  - id:      M1.6.S01.030
    speaker: MARA
    voice:   mara_sovann
    text:    "Grates in the roof. So they can be counted from above without anybody opening a door."
    note:    "18.8 - the Tithe is told through what it takes, never explained."

  - id:      M1.6.S01.040
    speaker: MARA
    voice:   mara_sovann
    text:    "It runs on the ninth of every month, and it has never once been late."
    note:    "The date. Sela re-uses it in S03.170."

  - id:      M1.6.S01.050
    speaker: DEX
    voice:   dex_callum
    text:    "Twelve cars of ore and we're going for the two with nothing in them."

  - id:      M1.6.S01.060
    speaker: DEX
    voice:   dex_callum
    tags:    [nervous]
    text:    "Four cutting charges. That's the whole cabinet, on a train that pays us in mouths."
    note:    "Dex's objection is GOOD and it is also his joke, and the joke costs him (18.6). Seeds S99."

  - id:      M1.6.S01.070
    speaker: REYES
    voice:   elin_reyes
    text:    "How many of the wounded will be ours, and how many will be the ones we take off it?"
    note:    "18.4 Reyes: asks a question instead of accusing. It is also the only pricing nobody in the room had done."

  - id:      M1.6.S01.080
    speaker: REYES
    voice:   elin_reyes
    text:    "I have plasma for six people. I do not have it for sixty-six."
    note:    "No contractions. She is stressed and the training reasserts."

  - id:      M1.6.S01.090
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Ammunition we don't get back."

  - id:      M1.6.S01.100
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "How many are in the two cars?"

  - id:      M1.6.S01.110
    speaker: MARA
    voice:   mara_sovann
    text:    "Nobody outside the yard has ever counted them."

  - id:      M1.6.S01.120
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Then that isn't a number. That's a hope."

  - id:      M1.6.S01.130
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Every run so far bought the next one. What does this one buy--"

  - id:         M1.6.S01.140
    speaker:    BRICK
    voice:      brick
    interrupts: true
    text:       "They water them at the yard. Not before."
    shot:       "Nobody had asked him anything. Nobody answers. Dex looks at the map instead of at him."
    note:       "THE BEAT. AR-11's first payment. 18.4 says Brick never speaks first in a group; this once he does, and he does it over the top of somebody else. No explanation, no reaction line. The room's silence is the whole of it."

  - id:      M1.6.S01.150
    speaker: VOSS
    voice:   voss
    tags:    [pause]
    text:    "What's in the other twelve?"
    note:    "PLAYER OPTION 1 of 2 (supplies angle). No axis variants - budget ruling C-6/Q-7 option (b): variants only where the scene branches."

  - id:      M1.6.S01.160
    speaker: VOSS
    voice:   voss
    tags:    [pause]
    text:    "What happens to them at the yard?"
    note:    "PLAYER OPTION 2 of 2 (people angle)."

  - id:      M1.6.S01.170
    speaker: MARA
    voice:   mara_sovann
    text:    "The manifest counts the ore. It counts the rest the same way."
    note:    "Answers either option, so no approach flag is required."

  - id:      M1.6.S01.180
    speaker: VOSS
    voice:   voss
    text:    "That line runs our side of the depot for a kilometre. There's a switch at the end of it."
    note:    "18.4 Voss: names the mechanism. PLANT - S04's choice happens at this switch."

  - id:      M1.6.S01.190
    speaker: VOSS
    voice:   voss
    text:    "Underworks spur one way, muster yard the other. Whoever's standing at that lever picks."

  - id:      M1.6.S01.200
    speaker: MARA
    voice:   mara_sovann
    text:    "Then we stand at it."

  - id:      M1.6.S01.210
    speaker: MARA
    voice:   mara_sovann
    text:    "Charges on the couplings, not the cars."

  - id:      M1.6.S01.220
    speaker: MARA
    voice:   mara_sovann
    tags:    [pause]
    text:    "Put it on the table."
    shot:    "She moves the cable up past the depot and leaves her hand on it. Dex is already looking at the cabinet with the four charges in it."
