# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.6.md ----
# cast:      VOSS, BRICK, MARA · SELA VANN (debut) · three conscripts
# flags-in:  none
# flags-out: Story.Char.SelaMet  (NEW TAG - systems task)
# beats:     1) the hatch opens. The smell, the light, too many people not moving
#            2) the first conscript who says he is staying. HIS REASON IS GOOD
#            3) Voss tries. It does not work - AND THAT MATTERS: Voss cannot do this
#            4) SELA. She does not talk to Voss. She talks to the car. Her 19.3 signature
#               line lands here and nowhere else: "They didn't take your brother. We let them."
#            5) the car starts to move
#            6) BRICK, in the hatchway, three or four words, about Krad-9. Now the player
#               understands why he spoke first in S01
#
# BEST SCENE IN MOVEMENT III. It proves pillar 3 (PEOPLE, NOT UNITS) without one statistic.
#
# plants:    P1-b - Sela's rhetoric names the Blight as the wound all of this came out of.
#            ONE reference, no explanation (18.8). Twist 1 pays in act 3.
# *** DONE - RULING L1-R14. Brick's line was "Krad-9. Eleven days."; it is now SEVENTEEN. ***
# Three scenes earlier, in M1.5.S03, "eleven days" means HOW LONG A MAN HELD OUT UNDER
# QUESTIONING before he broke. The player learns that meaning first, so Brick's line landed
# as interrogation instead of transit - which inverts AR-11's payoff at the exact moment it
# pays. Neither writer could see this; it only exists between two missions.
#
# AR-11 needs the BEAT ("he was in a car like this one"), not the number, so the ruling left
# the replacement to the writer. The ruling's own suggestions were "nine, six, sixteen" -
# and TWO OF THOSE THREE ARE THE SAME MISTAKE AGAIN. Counted across every spoken line in
# act 1 (Tools/count_generation_cost.py's sibling sweep): nine is spoken 30x in 6 missions,
# six 29x in 6. Both are as saturated as eleven was; picking one would have moved the
# collision instead of removing it.
#
# SEVENTEEN is spoken nowhere in act 1 - it and sixteen and eighteen were the only free
# numbers under twenty. Seventeen days in a box is long enough to do AR-11's work, and it
# measures nothing else in this act.
#
# M1.5 is GO and is not being reopened over a number; this is the cheaper repair and it
# produces the same result.
#
# writer:    SELA DOES NOT MAKE A SPEECH. AR-7: no oration is spent in act 1. She wins with
#            four to six short turns, at least two of which are questions. Rhetoric is
#            structure, not volume. 18.4: she never speaks about herself for more than one line.
#            The conscripts who want to stay have GOOD reasons. Written frightened or stupid,
#            they make Sela's victory worthless.

# ---- dialogue-writer notes (L2) ----
# band:      `cutscene`. Ceiling 60, respected (longest 20 w at .070). Register reached at
#            .070. Spread 1 w (.050 "No.") to 20 w = 20x. Sela is additionally held to the
#            HUB band (12-35) per AR-7 and the beat sheet; her longest is 19 w. No oration
#            is spent in act 1.
# cast:      the stub asks for THREE speaking conscripts. The casting registry (SCRIPT_FORMAT
#            section 4, L1-R5) has TWO rows - `civilian_kessara_a` and `_b` - and both are
#            still owner-question Q-5. I did not invent a third row. The third conscript's
#            material is folded into CIVILIAN_A, who is now the man who answered his summons
#            to protect his door AND the man whose brother went in the spring. That makes him
#            better, not smaller. If the owner opens `civilian_kessara_c`, splitting him back
#            out is two `speaker`/`voice` edits and no rewrite. ESCALATED in the report.
# sela:      FIVE turns - .140, .160, .170, .190, .200. Two are questions (.140, .190).
#            Her tic fires at .140 and .190: a private terror ("my address", "my brother") is
#            handed straight back as a collective one. She speaks about herself ZERO times
#            here, which is inside 18.4's limit of one.
#            She is IN the car and has been against the far wall through the whole argument.
#            Her entrance is standing up, not arriving, and she never once looks at Voss.
# signature: .160 is 19.3's signature line, VERBATIM, and it is the first thing the player
#            ever hears her say. She does not say it to Voss. Casting stage 2 auditions this
#            line - do not edit one word of it.
# p1-b:      .170. ONE reference to the Blight, no gloss, delivered as an activist's opinion
#            about a bill that keeps arriving. It re-uses S01.040's date, which the player
#            heard ninety seconds earlier as a freight timetable. Twist 1 pays in act 3.
# voss:      .090 is his attempt and it FAILS on all four axes, because all four argue about
#            the LIST. The car is not afraid of the list; it is afraid of being the reason.
#            The strategic variant is the strongest argument in the scene and it still loses.
#            That is deliberate, and it is why Sela's win is not a trick.
# refusers:  .070 and .100 are the good reasons and they are correct. Nobody in the car is
#            stupid, nobody begs, and nobody is converted by being told they are wrong.
#            .180 is the car refusing rhetoric, so Sela cannot win by sounding good.
# brick:     .220 is three words and there is no line around it. Two men stay in the car and
#            nobody argues with them - the victory is not clean, and S05's `emptied` branch
#            will come back to that.
# water:     .020/.030 pay S01.140 without a syllable of explanation. Somebody asks for water,
#            and Brick, who told the room where the water was, says nothing at all.
# omitted:   Voss does not thank her, Mara does not comment, and nobody says what just
#            happened. The scene ends on a head count.

lines:
  - id:      M1.6.S03.010
    speaker: VOSS
    voice:   voss
    text:    "Hinge side's clear. Mind the drop, there's no step."
    shot:    "The door goes over. The car is full end to end and not one of them moves toward the opening. Somebody's hand is up against the light."

  - id:      M1.6.S03.020
    speaker: CIVILIAN_B
    voice:   civilian_kessara_b
    text:    "Is there water?"

  - id:      M1.6.S03.030
    speaker: VOSS
    voice:   voss
    text:    "There's water at the head of the train."
    shot:    "Brick is in the hatchway behind him and says nothing at all."
    note:    "Pays S01.140. No explanation. The shot is the whole payment."

  - id:      M1.6.S03.040
    speaker: CIVILIAN_A
    voice:   civilian_kessara_a
    text:    "Is this the yard?"

  - id:      M1.6.S03.050
    speaker: VOSS
    voice:   voss
    text:    "No."

  - id:      M1.6.S03.060
    speaker: CIVILIAN_A
    voice:   civilian_kessara_a
    text:    "Then we're staying on."

  - id:      M1.6.S03.070
    speaker: CIVILIAN_B
    voice:   civilian_kessara_b
    text:    "They read the list at the yard. A name that doesn't answer gets a visit at the address beside it."
    note:    "The obstacle in one line. She is not frightened. She is informed."

  - id:      M1.6.S03.080
    speaker: CIVILIAN_B
    voice:   civilian_kessara_b
    text:    "Mine has two children in it."

  - id:      M1.6.S03.090
    speaker: VOSS
    voice:   voss
    text:    "The list goes up with the car. Nobody reads anything tonight."
    note:    "VOSS TRIES AND FAILS. All four axes argue about the list. Full four-axis coverage - one of the four scenes in M1.6 that earns it (BEATS section 9.8)."
    variants:
      pragmatist: "That list is paper in an office. Paper takes a week to catch up with anybody."
      idealist:   "Then nobody goes back. Not one of you, not tonight, not in the morning."
      personal:   "The address on my file was my aunt's. They came anyway."
      strategic:  "Sixty names missing at once stops being a list. It becomes somebody's problem upstairs."

  - id:      M1.6.S03.100
    speaker: CIVILIAN_A
    voice:   civilian_kessara_a
    text:    "I answered so they would stop at my door. If I run, my door goes back on the list."
    note:    "HIS REASON IS GOOD, and Voss has no answer to it on any axis."

  - id:      M1.6.S03.110
    speaker: CIVILIAN_B
    voice:   civilian_kessara_b
    text:    "Same."
    shot:    "A dozen of them sit back down on the floor. It is the quietest thing that has happened all night."

  - id:      M1.6.S03.120
    speaker: VOSS
    voice:   voss
    text:    "There's a spur two kilometres up that nobody watches--"

  - id:         M1.6.S03.130
    speaker:    CIVILIAN_B
    voice:      civilian_kessara_b
    interrupts: true
    text:       "And in the morning?"

  - id:      M1.6.S03.140
    speaker: SELA
    voice:   sela
    text:    "Who is left at your address that the Tithe has not already taken once?"
    shot:    "She has been against the far wall the whole time. She stands up inside the car. She does not look at Voss once in this scene."
    note:    "SELA'S FIRST LINE IN THE GAME. A question, aimed at the car, and her tic: a private address handed back as a collective one. Sets Story.Char.SelaMet."

  - id:      M1.6.S03.150
    speaker: CIVILIAN_A
    voice:   civilian_kessara_a
    text:    "They took my brother in the spring. They left the rest of us alone after that."

  - id:      M1.6.S03.160
    speaker: SELA
    voice:   sela
    text:    "They didn't take your brother. We let them."
    note:    "19.3 SIGNATURE LINE, verbatim. Lands here and nowhere else in the game. Casting stage 2 uses it. Do not edit."

  - id:      M1.6.S03.170
    speaker: SELA
    voice:   sela
    text:    "The Blight was on Meridia. The bill has come here on the ninth of the month ever since."
    note:    "P1-b. ONE reference, no explanation (18.8). Reads as an activist's opinion; act 3 makes it evidence. Re-uses S01.040's timetable date."

  - id:      M1.6.S03.180
    speaker: CIVILIAN_B
    voice:   civilian_kessara_b
    text:    "That doesn't move an address."
    note:    "The car refuses rhetoric, so Sela cannot win by sounding good."

  - id:      M1.6.S03.190
    speaker: SELA
    voice:   sela
    text:    "No. So say it out loud if you're staying, and the rest of us can stop counting on you."
    note:    "The organiser's move: she gives them permission to stay, which is exactly what makes them move. Second question."

  - id:      M1.6.S03.200
    speaker: SELA
    voice:   sela
    text:    "Nobody walks off this train on their own."

  - id:      M1.6.S03.210
    speaker: CIVILIAN_B
    voice:   civilian_kessara_b
    text:    "Two children."
    shot:    "She goes down the drawbar first and turns to take the next person by the arm. The car empties from the middle outward."
    note:    "The turn, in two words: the same reason, pointing the other way."

  - id:      M1.6.S03.220
    speaker: BRICK
    voice:   brick
    text:    "Krad-9. Seventeen days."
    shot:    "He holds the hatch open with one hand and does not come down. Two men stay sitting at the back of the car. Nobody argues with them and nobody looks at them twice."
    note:    "AR-11 lands. Three words, no explanation, no reaction line. The player now knows why he spoke first in S01."

  - id:      M1.6.S03.230
    speaker: MARA
    voice:   mara
    text:    "Head count at the bottom of the ramp. Twice."
