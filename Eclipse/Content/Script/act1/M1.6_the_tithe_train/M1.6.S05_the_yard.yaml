# ---- header ----
scene:        M1.6.S05
mission:      M1.6
title:        "The Yard"
act:          1
location:     "Kessara / Mid-Works / Supply Depot Yard"
type:         in-mission-radio
credit_tier:  2

# ---- the three-sentence contract (18.7) ----
want:         "Get several dozen unarmed people across a rail yard."
obstacle:     "Unarmed people do not move like a squad and cannot be ordered."
turn:         "Sela moves them, using her voice where Ember would have used cover."

# ---- state ----
status:       draft
critic:       null
words:        216

# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.6.md ----
# cast:      VOSS, MARA, BRICK, SELA, fighters, freed conscripts; Dominion response
# flags-in:  Story.Choice.M16_TrainRun
# flags-out: none
# beats:     1) the yard; searchlights; the response
#            2) THE TACTICAL PROBLEM IS NEW: civilians are not units. That is pillar 3
#               expressed as mechanics
#            3) Sela organises them - shouting, short instructions, names
#            4) Ember covers
#            5) losses, if any, are visible and have faces
# branches:  run   -> harder fight, more pressure, higher chance of civilian loss
#            empty -> shorter fight, and on the way out the player sees the people who did
#                     not come, counted and marked
#            Both hurt. That is the design (2.7 rule 2).
# writer:    Sela's lines here are the only place she uses the callout band. Short, loud,
#            names. It should be audibly the same person as S03 doing a different job.

# ---- dialogue-writer notes (L2) ----
# band:      `in-mission-radio`. Sela and the firefight run on explicit per-line `band:`
#            overrides (L1-R1). Register carried by .010 (11 w), .020 (13 w), .140 (14 w).
#            Spread 1 w (.420) to 14 w (.140) = 14x.
# branches:  branch conditions read `story.m16_train_choice` from S04 (L1-R3 leaf-tag form).
# sela:      audibly the same person as S03, doing a different job. Same structure - a
#            grouping, then an instruction, then who goes first - compressed into four to
#            six words because there is a searchlight on her. She never asks a question here;
#            S03 was two questions and this is none, and that difference is the character.
# names:     ESCALATION, and it is deliberate. The stub asks for "names". The writing brief
#            forbids new canon names, and S06 carries the biggest trap in the act (no freed
#            conscript may acquire a name or a close-up). So Sela identifies civilians by
#            coat, place and position - which is also what somebody who met them ninety
#            minutes ago would actually do - and the one name she uses is BRICK's (.090),
#            canon, and it lands as an organiser giving an order to a heavy weapon she has
#            known for an hour. If the architect wants civilian names, .090 / .230 / .320 are
#            the three drop-in points and it is a three-line edit. Reported, not invented.
# faces:     the loss has a face and no name - "the woman in the yard coat". She is the same
#            person in both branches: shot on the embankment under `run`, on her knees at the
#            weighbridge under `emptied`. Same coat, two endings, and neither is clean.
# aegis:     .020 / .140. ACT1_OVERVIEW section 2 puts AEGIS in M1.6 as a public announcement.
#            Present tense, no self-reference, states a figure where a person would state an
#            opinion, and it never addresses the player (AR-8). It is the yard's weather.
# thin:      .400-.410 is the RUNNING thread from M1.2.S03 - Voss notices the response is
#            too small and somebody explains it away. One touch, in the shared tail so both
#            branches get it, no mystery attached, and it is not solved. NOT a new plant:
#            P4-b belongs to M1.5.S05 and P4-c to M1.7. This is the same explanation getting
#            harder to say, which is the act's spine working, and nobody names it.
# brick:     no lines. He is a shot at .090.

lines:
  - id:      M1.6.S05.010
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Lights up on the north wall. All of them at once."
    shot:    "The yard from the ballast. Weighbridge, muster pens, four towers, and a line of people already walking into the open because nobody told them not to."

  - id:      M1.6.S05.020
    speaker: AEGIS
    voice:   aegis
    text:    "Muster is in progress. Personnel on the yard floor are counted where they stand."
    note:    "18.4 AEGIS: present tense, no self-reference, statement without persuasion. Announcement only - never addressed to the player (AR-8)."

  - id:      M1.6.S05.030
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "They won't stack up. They keep walking into the open."

  - id:      M1.6.S05.040
    speaker: VOSS
    voice:   voss
    band:    callout
    text:    "They don't know what cover looks like."
    note:    "Pillar 3 as a tactical problem, in seven words. Nobody explains it further."

  - id:      M1.6.S05.050
    speaker: MARA
    voice:   mara
    band:    callout
    text:    "Then we're the cover."

  - id:      M1.6.S05.060
    speaker: SELA
    voice:   sela
    band:    callout
    tags:    [shouting]
    text:    "Two lines! Slow ones inside!"

  - id:      M1.6.S05.070
    speaker: SELA
    voice:   sela
    band:    bark
    tags:    [shouting]
    text:    "Hands on the shoulder in front of you!"

  - id:      M1.6.S05.080
    speaker: SELA
    voice:   sela
    band:    callout
    text:    "Walk. Nobody runs."

  - id:      M1.6.S05.090
    speaker: SELA
    voice:   sela
    band:    callout
    tags:    [shouting]
    text:    "Brick, the wall! Not the tower!"
    shot:    "He is already moving to the wall before she finishes, and he does not answer her."

  - id:      M1.6.S05.100
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    band:    bark
    text:    "An old man's sat down. He's just sitting--"

  - id:         M1.6.S05.110
    speaker:    SELA
    voice:      sela
    band:       callout
    interrupts: true
    text:       "Leave him to me. Keep moving."

  - id:      M1.6.S05.120
    speaker: VOSS
    voice:   voss
    band:    callout
    text:    "Tower light. Take it out."
    shot:    "Two of them go wide for the tower. The light swings across the pens twice before it drops."

  - id:      M1.6.S05.130
    speaker: MARA
    voice:   mara
    band:    callout
    text:    "Nobody fires across the line."

  - id:      M1.6.S05.140
    speaker: AEGIS
    voice:   aegis
    text:    "Compliance in this district is measured hourly. The present figure is nine in ten."
    note:    "States a figure where a person would state an opinion. It is the yard's weather, not a threat."

  - id:        M1.6.S05.200
    speaker:   FIGHTER_B
    voice:     eclipse_fighter_b
    band:      bark
    condition: 'story.m16_train_choice == "run"'
    text:      "They're shooting at the cars. They know what's in them."

  - id:        M1.6.S05.210
    speaker:   SELA
    voice:     sela
    band:      callout
    tags:      [shouting]
    condition: 'story.m16_train_choice == "run"'
    text:      "Down the embankment! All of it!"

  - id:        M1.6.S05.220
    speaker:   VOSS
    voice:     voss
    band:      bark
    condition: 'story.m16_train_choice == "run"'
    text:      "Off the rails. That's all anyone's aiming at."

  - id:        M1.6.S05.230
    speaker:   FIGHTER_A
    voice:     eclipse_fighter_a
    band:      bark
    condition: 'story.m16_train_choice == "run"'
    text:      "The woman in the yard coat. She's not getting up."

  - id:        M1.6.S05.240
    speaker:   SELA
    voice:     sela
    band:      callout
    condition: 'story.m16_train_choice == "run"'
    text:      "Keep walking. Don't stop."
    shot:      "She steps past without looking down and takes the next person to the front by the sleeve. She does not break the rhythm of the count."

  - id:        M1.6.S05.250
    speaker:   MARA
    voice:     mara
    band:      bark
    condition: 'story.m16_train_choice == "run"'
    text:      "Count at the wall. Count again inside."

  - id:        M1.6.S05.300
    speaker:   FIGHTER_B
    voice:     eclipse_fighter_b
    condition: 'story.m16_train_choice == "emptied"'
    text:      "Two squads and one light. That's the whole response."

  - id:        M1.6.S05.310
    speaker:   SELA
    voice:     sela
    condition: 'story.m16_train_choice == "emptied"'
    text:      "There are people on that floor who didn't get off with us."
    shot:      "Forty of them on their knees along the weighbridge. Somebody is going down the row with a paint stick, marking the backs of their hands, and taking his time about it."

  - id:        M1.6.S05.320
    speaker:   SELA
    voice:     sela
    condition: 'story.m16_train_choice == "emptied"'
    text:      "The woman in the yard coat is in that line."

  - id:        M1.6.S05.330
    speaker:   MARA
    voice:     mara
    band:      bark
    condition: 'story.m16_train_choice == "emptied"'
    text:      "Nothing goes back across that yard tonight."

  - id:        M1.6.S05.340
    speaker:   VOSS
    voice:     voss
    band:      bark
    condition: 'story.m16_train_choice == "emptied"'
    text:      "Wall, then the culvert. Nobody stops at the wall."

  - id:      M1.6.S05.400
    speaker: VOSS
    voice:   voss
    band:    bark
    text:    "Nothing came down the Spire road. Not one vehicle."

  - id:      M1.6.S05.410
    speaker: MARA
    voice:   mara
    band:    bark
    text:    "It's a freight yard. Freight yards get freight guards."
    note:    "The running M1.2.S03 thread: the Dominion under-reacts and somebody explains it away. She believes it. Act 4 will not."

  - id:      M1.6.S05.420
    speaker: MARA
    voice:   mara
    band:    callout
    tags:    [pause]
    text:    "Move."
    shot:    "Voss looks back at the yard for a second longer than she does, and then goes."
