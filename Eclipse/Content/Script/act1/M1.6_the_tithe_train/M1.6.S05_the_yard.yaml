  - id:        M1.6.S05.370
    speaker:   SELA
    voice:     sela
    condition: 'story.m16_train_choice == "split"'
    text:      "Forty-one at the drawbar. Forty-one at this wall."
    shot:      "She goes down the line with a hand on each shoulder and comes off the end of it with the number she started with. Nobody writes anything down."
    note:      "*** THE COUNT COMES OUT, AND THAT IS THE CRUELTY. *** She is short in run and short in emptied; here she is exact. Forty-one is the mission's own intake figure (S06.010, S06.110, M1.8.S99.080) - no new number, and L1-R14's eleven is untouched. She reckons in it because it is the only unit she has. *** DRAWBAR = THE COUPLING AT THE SWITCH. RULING L1-R32, PINNED HERE SO IT CANNOT DRIFT. *** The first count is taken where the second car was cut away - S04.120, 'Second car goes with the Chorus', and the shot on S04.180 - so the forty-one at the drawbar is the FIRST car's column and the second car was never inside it. It is NOT S03.230's ramp ('Head count at the bottom of the ramp. Twice.'), which is taken before the switch and before anything had been cut away, and it is not S03.210's shot, where the drawbar is only how somebody climbs down. Read against the ramp, this line counts the wrong population and the arithmetic looks broken; read against the cut, the two figures match because nobody was lost crossing the yard, and the people who are missing are missing from a column they were never in. *** AND FORTY-ONE DOES NOT BRANCH. *** It is a campaign constant: S06.010, .040, .110, .120 and two of .190's variants all ship it, so do M1.7.S99.100/.120, M1.8.S99.080 and Sela's hub scene, and NOT ONE of those lines carries a story.m16_train_choice condition - the whole of S06 carries none, measured with a grep and not assumed. The three branches differ in WHO comes through the door of that vault, never in how many. S01.110/.120 is the reason and it is not a convenience: 'Nobody outside that yard has ever counted them.' / 'Then that isn't a number. That's a hope.' Forty-one is what Ember counted at a wall, not a fraction of a total anybody knew, so there is no subtraction to perform and no branch may state a loss figure. A number that moved per branch would claim somebody had counted that train. Nobody did. Registered in ACT1_OVERVIEW's number register under 'eenenveertig', which is the authority if this note and that table ever disagree."

  - id:        M1.6.S05.380
    speaker:   FIGHTER_A
    voice:     eclipse_fighter_a
    condition: 'story.m16_train_choice == "split"'
    text:      "The woman in the yard coat. Which one did she get on?"
    shot:      "He looks back down the line for a coat that is not in it. The line keeps moving past him."
    note:      "Her third ending, and the only one nobody sees. He does not know which car she took and neither does anybody else. This is S04.190 - 'Somebody should be able to say afterwards who got into that car' - being paid by nobody being able to."

  - id:        M1.6.S05.390
    speaker:   SELA
    voice:     sela
    condition: 'story.m16_train_choice == "split"'
    text:      "Everyone who came off that car with you is standing with you."
    shot:      "The fighter goes back to his place on the line and does not ask anybody else."
    note:      "18.4 SELA: rhetorical parallelism, second person plural twice, and her tic - a question about one person handed back as a fact about the whole column. It is true, it does not answer him, and it is the habit that makes the woman disappear. She asks nothing here; S03 was one question (.140) and this scene is none - L1-R34, 01-08; both notes used to say two."

  - id:      M1.6.S05.400
    speaker: VOSS
    voice:   voss
    text:    "Nothing came down the Spire road. Not one vehicle."

  - id:      M1.6.S05.410
    speaker: MARA
    voice:   mara
    text:    "Somebody's called it in by now. They think they're short some ore."
    note:    "The running M1.2.S03 thread: the Dominion under-reacts and somebody explains it away. She believes it. Act 4 will not. *** FLAT BY RULING L1-R21, REWRITTEN 01-08 - DO NOT POLISH IT BACK. *** The old text was 'It's a freight yard. Freight yards get freight guards.': literal anadiplosis, and T4 touch 3 of six (ACT1_OVERVIEW section 4). THE BEAT IS UNCHANGED AND SO IS THE CATEGORY ERROR. The old line answered a military absence with freight logic; so does this one - the enemy is doing inventory, so the enemy sent what you send about inventory. What went is the figure, the rhythm and the closing beat. AND IT IS A SMALLER CLAIM, which is what makes it the first crack: touches 1 and 2 are laws about how the Dominion behaves, and this is a guess about what they happen to believe tonight, which she cannot know. FLAT SERVES THE FIRST HALF OF THIS NOTE BETTER THAN THE MAXIM DID - a maxim is certainty performed, and a guess delivered flat is certainty. C2, AND THE SENTENCE ORDER IS THE ANSWER TO IT: delete the last sentence and 'Somebody's called it in by now.' explains nothing about a response that never came. The explanation IS the last sentence, so the deletion breaks the beat instead of tightening it. THE FIRST DRAFT OF THIS REWRITE OPENED 'Nothing was due down that road tonight.' and was cut before delivery - sentence-initial echo of .400's 'Nothing came down the Spire road', which is anaphora across the cut, and swapping one figure for another is not flat. It also borrows the emissary's tic (18.4: repeats the other person's word back at them), and that is his. L1-R17 POSTER TEST: neither half is a screenshot, and it ends on 'ore' - the night reduced to a commodity, with nobody underlining it. NO NEW CANON: 'ore' is M1.6.S01.010, 'Twelve of them are ore.' Branch-neutral - it is the same misreading after run, emptied and split."

  - id:      M1.6.S05.420
    speaker: MARA
