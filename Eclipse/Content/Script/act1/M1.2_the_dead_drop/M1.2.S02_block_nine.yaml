# ---- header ----
scene:        M1.2.S02
mission:      M1.2
title:        "Block Nine"
act:          1
location:     "Kessara / Mid-Works / Worker Housing"
type:         walk-and-talk
credit_tier:  2

# ---- the three-sentence contract (18.7) ----
want:         "Voss wants to cross a block of nine thousand people without one of them looking twice."
obstacle:     "A woman on the third gallery looks twice."
turn:         "She turns her radio up instead of shouting, and Voss learns the district is already choosing sides in ways nobody counts."

# ---- state ----
status:       draft
critic:       null
words:        230

# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.2.md ----
# cast:      VOSS, MARA, one Ember fighter, DEX (radio), one Kessaran civilian, AEGIS (public address)
# flags-in:  none
# flags-out: none
# plants:    P1-c (dressing only) - a Bursary ration placard about Meridia relief on the
#            gallery wall. Nobody mentions it. It is simply there, for act 3.
# beats:     1) the galleries; the sound of too many people in too little room
#            2) the AEGIS address - two sentences, present tense, a probability where a
#               human would give an opinion (18.4)
#            3) the woman sees them
#            4) she does the only safe thing: more noise
#            5) Mara's reaction teaches the player what that was worth
#            6) the cache
# writer:    THE CIVILIAN SPEAKS FOUR WORDS OR NONE. What she does is the line. A civilian
#            delivering a speech about hope is exactly the failure mode in 18.9 D.
#            AEGIS never argues and never prefers (18.4).
# casting:   needs civilian_kessara_a - see owner question Q-5.

# ---- dialogue-writer notes (L2) ----
# civilian:  FOUR WORDS, and they are not about hope, the Dominion, or us. She is calling
#            her children in. The player has to decide what she meant; so does Mara. The
#            LINE is the radio, and the radio is written as `shot`, not as text.
#            voice key civilian_kessara_a does not exist in 19.3 yet - Q-5/C-4. One line.
#            If Q-5 stalls, cutting .140 costs the scene nothing structural.
# aegis:     two sentences total, split across .060 and .130. Present tense, no self-
#            reference, a forecast where a human would give an opinion (18.4). AEGIS is
#            never mixed louder by a tag - the volume is a prop the civilian operates, so
#            it lives in `shot` for the mix pass. No [shouting] tag: AEGIS does not shout.
# p1-c:      the Bursary/Meridia placard is in the .010 `shot` and NOWHERE else. Nobody
#            looks at it, nobody names it. Dressing, per the stub.
# irony:     the thing that covers the cell is the Dominion's own voice, turned up by a
#            woman who never speaks to them. Nobody points at this.
# band:      walk-and-talk (10-25). Ceiling honoured: longest 20 w. Floor read as advisory,
#            same escalation as M1.1.S01 - a hard 10-word floor makes the 3x variance rule
#            impossible. Variance here is 1 w to 20 w = 20x.
# wrong:     FIGHTER_A misreads the woman twice (.110, .170) and is wrong both times.
#            18.9 D asks for somebody who is wrong in an interesting way.
# ar-5:      Mara: zero "you", zero "I". Two "we" (.200).
# names:     nobody is addressed by name in this scene at all.
# mast:      .260/.270 plant the observation Voss turns into the M1.3 proposal in S99.
#            One line, unremarked, no wondering.

lines:
  - id:      M1.2.S02.010
    speaker: MARA
    voice:   mara_sovann
    tags:    [quietly]
    text:    "Hands out of pockets. Nobody hurries in their own block."
    shot:    "Third gallery, Block Nine. Washing strung between pillars, sodium orange through it. A Bursary placard is pasted at eye height - MERIDIA RELIEF: YOUR RATION AT WORK. Two men walk past it without turning their heads."

  - id:      M1.2.S02.020
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "My aunt had the fourth floor of Twelve. Same stairs. Same smell of wet coats."

  - id:      M1.2.S02.030
    speaker: MARA
    voice:   mara_sovann
    text:    "Then walk like a nephew."

  - id:      M1.2.S02.040
    speaker: VOSS
    voice:   voss
    text:    "The gallery lamps run off the housing feed. They dim every time the pumps cycle."
    note:    "18.4 Voss: names the mechanism, asks nobody to care."

  - id:      M1.2.S02.050
    speaker: DEX
    voice:   dex_callum
    text:    "Then move when they dim. That's free, and free is my favorite price."

  - id:      M1.2.S02.060
    speaker: AEGIS
    voice:   aegis
    text:    "Curfew for Block Nine begins at the second horn. Ninety-four percent of this block will be indoors before it sounds."
    shot:    "The speaker is bolted above the stairhead. Nobody on the gallery looks up at it."
    note:    "AEGIS sentence 1 of 2. Present tense, a probability where a human states an opinion. It is wallpaper: nobody in the scene answers it."

  - id:      M1.2.S02.070
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "My aunt died in that flat two years back. Bet she's still ninety-four percent."

  - id:      M1.2.S02.080
    speaker: MARA
    voice:   mara_sovann
    text:    "Quieter."

  - id:      M1.2.S02.090
    speaker: VOSS
    voice:   voss
    tags:    [quietly]
    text:    "Third gallery, above the drying rack. She has been watching us since the landing."

  - id:      M1.2.S02.100
    speaker: MARA
    voice:   mara_sovann
    text:    "Keep walking."

  - id:      M1.2.S02.110
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "There's a warden's box at the top of that stair. Say the word and I'm up it."

  - id:      M1.2.S02.120
    speaker: MARA
    voice:   mara_sovann
    text:    "No word."

  - id:      M1.2.S02.130
    speaker: AEGIS
    voice:   aegis
    text:    "Ration issue continues through the third horn. Attendance at the block assembly is recorded."
    shot:    "The woman reaches inside her door. The same voice comes back twice as loud and fills the whole gallery. She does not look down at the men on the walkway once."
    note:    "AEGIS sentence 2 of 2. THE TURN happens in this shot, not in a line: the Dominion's own broadcast becomes the cell's cover, and she never says a word to them."

  - id:      M1.2.S02.140
    speaker: CIVILIAN
    voice:   civilian_kessara_a
    text:    "Inside. Both of you."
    shot:    "She says it to her own doorway, not to the gallery. Two children go in. She leaves the door open a hand's width behind them."
    note:    "Four words, and they are domestic, not political. Voice key pending Q-5."

  - id:      M1.2.S02.150
    speaker: DEX
    voice:   dex_callum
    text:    "Your background just tripled. Say again?"

  - id:      M1.2.S02.160
    speaker: VOSS
    voice:   voss
    text:    "Nothing. A radio."

  - id:      M1.2.S02.170
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "She's turning us in--"

  - id:      M1.2.S02.180
    speaker: MARA
    voice:   mara_sovann
    interrupts: true
    text:    "She could have screamed."

  - id:      M1.2.S02.190
    speaker: MARA
    voice:   mara_sovann
    text:    "She turned it up instead."

  - id:      M1.2.S02.200
    speaker: MARA
    voice:   mara_sovann
    text:    "Nobody counts that. We do."
    note:    "18.4 Mara: plural first person, short declarative, no praise and no sentiment."

  - id:      M1.2.S02.210
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Counts for what?"

  - id:      M1.2.S02.220
    speaker: MARA
    voice:   mara_sovann
    text:    "She is a door we did not have an hour ago."

  - id:      M1.2.S02.230
    speaker: VOSS
    voice:   voss
    text:    "Meter cabinet, third pillar. New seal on an old box."

  - id:      M1.2.S02.240
    speaker: DEX
    voice:   dex_callum
    text:    "New seal on an old box. That's not maintenance."

  - id:      M1.2.S02.250
    speaker: MARA
    voice:   mara_sovann
    text:    "Take it and walk."

  - id:      M1.2.S02.260
    speaker: VOSS
    voice:   voss
    text:    "There's a mast on the roof of Twelve. It's not on the housing feed."
    shot:    "He is looking up while he says it. He does not stop walking."
    note:    "Planted here, paid in S99 when he proposes the jammer. Nobody in this scene answers it with interest."

  - id:      M1.2.S02.270
    speaker: DEX
    voice:   dex_callum
    text:    "Nothing up there ever is."

  - id:      M1.2.S02.280
    speaker: MARA
    voice:   mara_sovann
    text:    "Later."
