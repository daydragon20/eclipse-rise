# ---- header ----
scene:        M1.2.S01
mission:      M1.2
title:        "The Number He Kept"
act:          1
location:     "Kessara / Underworks / Hollow Point — Map Table"
type:         cutscene
credit_tier:  2

# ---- the three-sentence contract (18.7) ----
want:         "Dex needs a patrol rotation he cannot buy, cannot steal, and does not have."
obstacle:     "Ember's entire intel holding is whatever four people happen to remember."
turn:         "Voss produces a badge number he has been carrying since the ration line, and the room's arithmetic changes."

# ---- state ----
status:       draft
critic:       GO
words:        434

# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.2.md ----
# cast:      DEX, MARA, VOSS, REYES
# flags-in:  Story.Beat.M11_ThirteenBullets · Story.Thread.Enforcer_BadgeHeld
# flags-out: none
# pays off:  01_game_vision.md 1.7 moment 1 - "the intel seed used in Act 1". This is
#            literally that payoff. The player gets a reward for something no quest asked
#            him to do, twenty hours earlier.
# beats:     1) Dex states what he does not know, in hardware terms
#            2) Mara weighs waiting against going
#            3) VOSS SAYS THE BADGE NUMBER
#            4) Dex runs it, gets a rotation, is surprised, and resents being surprised
#            5) Mara does not say it was clever - she changes the plan, which is bigger
# fallback:  if owner question Q-2 is refused, the badge does not exist and this scene
#            falls back to "Dex has a name in the ledger". It works. It costs the game
#            signature moment 1 and one of the five 2.11 threads. Escalate before writing
#            the fallback.
# player:    the prep decision (spend 5 Intel or go blind) hangs off this scene - 11.1
# writer:    nobody explains what intel is or how the Veil works (18.8).

# ---- dialogue-writer notes (L2) ----
#
# *** C-2 ESCALATION - READ BEFORE GENERATING ***
# The badge is WRITTEN, not smuggled. It is the scene's turn and the stub forbids me to
# change the turn, so writing around it was not an option. But it still has no cause:
# RECAP_CARDS_M1.md ships six cards and none of them is the ration-line Enforcer. Card 1's
# still IS a ration line, so the setting is established - the memorised plate is not.
# Q-2 green (card 3 added) => this scene plays as written, no edit.
# Q-2 red                  => lines .090 through .200 are the ONLY affected block. They are
#                             written as one contiguous run on purpose so the fallback
#                             ("Dex has a name in the ledger") is a surgical twelve-line
#                             patch, not a rewrite. I have NOT written that fallback:
#                             BEATS_M1.2 section 5 says escalate first. Escalated.
#
# *** THE PLATE: SPELLING SETTLED 01-08, VALUE STILL OPEN ***
# The number is invented by me and its VALUE is not mine to settle: M1.3.S05 shows this
# Enforcer alive and answering the tower on 917, and one man does not carry two plates.
# Architect call, escalated. It is a cheap one either way - the number lives in exactly six
# places (.090, .110 base, and the four .110 variants) and nowhere else in the corpus, so a
# change is one sweep, not a rewrite.
# THE SPELLING is settled: "two six one", spaced. It was hyphenated and it was the only
# hyphenated number-spelling in the corpus - M1.1.S05 ships "Four six two" (5x, and that is
# the calibration mission) and M1.3.S05 ships "Nine one seven". A hyphen is a known way to
# get a TTS model to read a plate as one compound word.
#
# band:      type is `cutscene` (20-60 per 18.3). Most lines sit well under 20. Same
#            escalation as M1.1.S01: 18.3's variance rule (>=3x) and a 20-word FLOOR cannot
#            both hold. Read the band as a CEILING, per 18.3's own note and 21_quality_mandate.
#            Ceiling respected: longest line 19 w. Variance 1 w to 19 w = 19x.
#
# *** REGISTER: RED, DELIBERATELY, RE-MEASURED 01-08. DO NOT "FIX" THIS BY ONE WORD. ***
# The check asks a scene-level question - does ANY line of the thirty reach 20 - so the
# answer has to be scene-level too. Two reasons, and the second one is the measured one.
# 1. Nobody standing at this table has a 20-word line in them. Four fingerprints share the
#    room and three of them forbid it: Dex is fragments (18.4), Mara is short declaratives,
#    Voss is a technician's economy, and Reyes gets one question and goes quiet. The two
#    longest lines are .120 (19 w, and its length is set by where Voss cuts in, not by me)
#    and .240 (19 w, an offer that has to stay countable in one breath). A twentieth word
#    on either is padding, and padding to clear a floor is the machine tell 18.3 wrote the
#    floor to catch.
# 2. THE SCENE DOES REACH THE REGISTER IN PERFORMANCE, ON ALL FOUR AXES. Counted by hand
#    01-08, after the plate respacing: pragmatist 22, strategic 23, personal 24, idealist
#    26. Voss is defined on two axes, this file ships all four keys, and every player is on
#    one of them - so every player hears a 20-plus line, and hears it on the scene's turn.
#    The earlier version of this block claimed exactly that while strategic ran 17. A
#    quarter of the audience got a scene whose longest line was 19, which is the scene the
#    check describes, and the block said "do not touch" over it. Strategic was rewritten;
#    the tool was not.
# The check reads base `text:` only and that is deliberate (validate_script.py: variants are
# measured against the CEILING and excluded from register and spread, because those two
# measure the scene's written shape, not its heard one). So the finding stays red, and it is
# true of the file and false of the playthrough.
# ar-5:      Mara says "you" ZERO times in this scene, and "I" never. Checked line by line.
#            Her imperatives address without the word - that is the mechanism.
# triads:    exactly one, and it is the shipped canon string at .280. Mine were removed.
# names:     one name-address in 30 turns (.220 "Reyes"). It was 28 before .262/.264.
# choice:    .250 / .260 are the prep decision PLAYED, not explained (11.1's honesty loop),
#            and since 01-08 they are a real `choice:` block per L1-R2 / SCRIPT_FORMAT 4.
#            The note-only version was written when the construct did not exist. It does
#            now, and without `group` nothing bound these two lines into one prompt: they
#            could play back to back and have Voss buy and refuse the same stairwell inside
#            four seconds. No validator fires on that - no `choice:` and no `condition:` is
#            nothing to check - so it was going to reach an actor as written.
#            NAMESPACE: `run.m12_drops_bought`, not story. A prep purchase is spent inside
#            the mission it was bought for and has no business in the save (L1-R4). Set at
#            .250/.260, read at .262/.264 in this file - the shape L1 has already cleared
#            twice (run.hub_triage_order, run.m18_threx_probe).
#            SYSTEMS, NOT DIALOGUE: this flag is what decides whether S02/S03 mark exact
#            stairwells or search areas, and it needs a row in the mission prep table and in
#            SCRIPT_FORMAT 4's run-fact list. Escalated; not invented further here.
# eleven:    L1-R14. .180 read "Eleven days. It's an eleven-day loop" - eleven twice in one
#            line, and patrol days are named in the ruling as one of the misuses. The loop
#            is SIXTEEN days as of 01-08. Sixteen is spoken nowhere else in act 1; M1.6.S03
#            measured the free numbers under twenty when he took seventeen, and eighteen is
#            spent at M1.1.S05.136. "The ninth" and the Block Nine rhyme are untouched -
#            they were never the problem, and the ninth of a sixteen-day loop is still
#            tonight. S99's "eleven mouths" is the ruling's own meaning and stays.
# variants:  .110 only. The scene branches on exactly one axis (offhand vs calculated), so
#            per C-6 option (b) that is the only line that pays for four variants.
# words:     434 = 339 spoken base + 95 in the four .110 variants. Variants are generated,
#            so they are counted; choice `label:` text is not, because it is never voiced.
#            Hand-counted - no shell in the session that wrote the 01-08 edits. The 310 the
#            file carried before was re-verified line by line and was exact; 339 = 310, +2
#            at .090 and +2 at .110 for the spaced plate, +25 for .262/.264.
#            (M1.1.S01 appears to count base only - flagged upstream.)

lines:
  - id:      M1.2.S01.010
    speaker: DEX
    voice:   dex
    text:    "Block Nine. Block Twelve. Two drops, both still good, and a rotation I can't read."
    shot:    "Map table. Dex has a scanner open on its back with the housing off."

  - id:      M1.2.S01.020
    speaker: DEX
    voice:   dex
    text:    "Nine hours on the warden band tonight. All I have to show for it is a cracked filter."

  - id:      M1.2.S01.030
    speaker: DEX
    voice:   dex
    text:    "Their rotation runs on a closed loop. I can't buy it and I can't lift it."
    note:    "18.4 Dex: fragments, hardware nouns. He states the want in equipment terms and never once says he is worried."

  - id:      M1.2.S01.040
    speaker: MARA
    voice:   mara
    text:    "Then we count it ourselves. Four nights, two people on the stair."

  - id:      M1.2.S01.050
    speaker: DEX
    voice:   dex
    text:    "Four nights of two people standing in a Mid-Works stairwell. Nobody's ever noticed that before."
    note:    "Dex carries the sarcasm in this mission. Mara never does (18.4)."

  - id:      M1.2.S01.060
    speaker: REYES
    voice:   reyes
    text:    "Four nights on a wet gallery. Am I preparing for exposure, or for a patrol that found them?"
    note:    "18.4 Reyes: a question instead of an objection. No contractions - she is stressed. One line, this scene."

  - id:      M1.2.S01.070
    speaker: MARA
    voice:   mara
    text:    "Both, in the end."

  - id:      M1.2.S01.080
    speaker: MARA
    voice:   mara
    text:    "And one of the drops is paper. Paper does not keep."

  - id:      M1.2.S01.090
    speaker: VOSS
    voice:   voss
    text:    "Two six one."
    shot:    "He has not moved from the edge of the table. Nobody was talking to him."
    note:    "THE TURN. 01_game_vision 1.7 moment 1, paid. First line of the C-2 block (.090-.200)."

  - id:      M1.2.S01.100
    speaker: DEX
    voice:   dex
    text:    "What?"

  - id:      M1.2.S01.110
    speaker: VOSS
    voice:   voss
    text:    "Enforcer plate, two six one. Foundry District ration line, third shift."
    variants:
      pragmatist: "Enforcer plate, two six one. Foundry District ration line, third shift. It was the only thing in that queue worth taking home."
      idealist:   "Enforcer plate, two six one. He pulled a man out of the ration line over a permit, and I read his sleeve while he did it."
      personal:   "Two six one. Foundry District ration line. He was there every third day, and I stood close enough to read him every third day."
      strategic:  "Enforcer plate, two six one. Third shift, Foundry District ration line. A man that regular is a schedule with a face on it."
    note:    "The one axis this scene branches on: offhand or calculated. Four variants, per BEATS section 10.7. Strategic was 17 words and is now 23 - it was the one axis that left its player without a single 20-word line anywhere in the scene, and it was the flattest of the four. It now does what the axis is for: he did not keep a man, he kept a pattern."

  - id:      M1.2.S01.120
    speaker: DEX
    voice:   dex
    text:    "You memorized a plate. For a month. In a ration queue, with nothing to write on and nothing to--"

  - id:      M1.2.S01.130
    speaker: VOSS
    voice:   voss
    interrupts: true
    text:    "It was on his sleeve."

  - id:      M1.2.S01.140
    speaker: VOSS
    voice:   voss
    text:    "Anyone in that line could have read it."
    note:    "18.4 Voss fixed trait: never claims credit in front of the people who did the work. Kept neutral across axes on purpose."

  - id:      M1.2.S01.150
    speaker: MARA
    voice:   mara
    text:    "Run it."

  - id:      M1.2.S01.160
    speaker: DEX
    voice:   dex
    text:    "Give me a minute. And nobody stand behind me."
    shot:    "He drags warden roster sheets off a crate and lays them edge to edge across the map."

  - id:      M1.2.S01.170
    speaker: DEX
    voice:   dex
    text:    "...that's a Mid-Works roster block. Which means he rotates. Which means the row rotates with him."
    note:    "18.9 B articulacy: he starts mid-thought. He is not narrating for us, he is working."

  - id:      M1.2.S01.180
    speaker: DEX
    voice:   dex
    text:    "Sixteen days. It's a sixteen-day loop, and on the ninth, Block Nine gets one walker and no van."
    note:    "L1-R14: this was eleven, twice, for a patrol duration. Eleven is Ember. The ninth stays - it is the rhyme with Block Nine and the reason .190 exists."

  - id:      M1.2.S01.190
    speaker: DEX
    voice:   dex
    text:    "The ninth is tonight."

  - id:      M1.2.S01.200
    speaker: DEX
    voice:   dex
    text:    "Nine hours I gave that band. Nine. And the answer's been eating our bread all week."
    note:    "Beat 4: surprised, and resents it. No feeling is named. Last line of the C-2 block."

  - id:      M1.2.S01.210
    speaker: MARA
    voice:   mara
    text:    "Tonight, then."
    shot:    "She does not look at Voss. She turns the map."
    note:    "Beat 5. She never says it was clever. She changes the plan, which is the larger compliment. The same move closes S99."

  - id:      M1.2.S01.220
    speaker: MARA
    voice:   mara
    text:    "Two teams becomes one. Reyes stays up. The rest sleep until the second horn."

  - id:      M1.2.S01.230
    speaker: DEX
    voice:   dex
    text:    "One thing. The drops."

  - id:      M1.2.S01.240
    speaker: DEX
    voice:   dex
    text:    "I can have the exact stairwells inside the hour. Costs five. Or we walk two blocks and a guess."
    note:    "Nobody says what five is. 18.8."

  - id:      M1.2.S01.250
    speaker: VOSS
    voice:   voss
    choice:
      group: m12_prep
      set:   'run.m12_drops_bought = true'
      label: "Pay the five. Buy the exact stairwells."
    text:    "Pay the five. I'd rather buy the stairwell than stand in it looking for it."
    note:    "PLAYER OPTION 1 of 2 (prep spend). No axis variants - the choice is the branch, not the tone."

  - id:      M1.2.S01.260
    speaker: VOSS
    voice:   voss
    choice:
      group: m12_prep
      set:   'run.m12_drops_bought = false'
      label: "Keep the five. Walk the two blocks."
    text:    "Keep the five. Two blocks and a guess is still a night's work."
    note:    "PLAYER OPTION 2 of 2 (prep spend)."

  - id:        M1.2.S01.262
    speaker:   DEX
    voice:     dex
    condition: 'run.m12_drops_bought == true'
    text:      "Five it is. I'll wake somebody who owes me, and he'll hate it."
    note:      "The spend is answered by the man who has to go and get it. Nobody says what five buys or who the somebody is (18.8) - the honesty loop is that intel comes off a person, not out of a menu."

  - id:        M1.2.S01.264
    speaker:   DEX
    voice:     dex
    condition: 'run.m12_drops_bought == false'
    text:      "Areas, then. Two blocks, and you walk them until something looks wrong."
    note:      "11.1's honesty loop, played: the game says out loud what the player did not buy, in the voice of the man who now cannot deliver it."

  - id:      M1.2.S01.270
    speaker: MARA
    voice:   mara
    text:    "Whichever it is, we are out before the second horn."
    note:    "Answers either option, and she declines to weigh in on which. Written before the choice block existed and it still needs no branch - that is why it survived the 01-08 edit unchanged."

  - id:      M1.2.S01.280
    speaker: MARA
    voice:   mara
    tags:    [pause]
    text:    "Two caches, two blocks, and a patrol that never learned our faces. Keep it that way."
    shot:    "Dex is already pulling the scanner housing back on. Nobody says goodnight."
    note:    "Shipped briefing string, DT_StoryMissions MT_M12, verbatim. The scene's one permitted triad."
