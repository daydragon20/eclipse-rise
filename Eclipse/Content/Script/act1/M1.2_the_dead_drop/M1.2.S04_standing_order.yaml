# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.2.md ----
# cast:      VOSS (at the terminal), DEX (radio), MARA (on watch)
# flags-in:  none
# flags-out: Story.Clue.CustodianKey  (NEW TAG - systems task). SET BY THIS SCENE, on scene
#            commit, because .120 is where the clue is spoken - ruling L1-R38. The debrief
#            does not set it and never did; S99's note claiming otherwise is corrected.
#
# P2-a. Plant for twist 2 (Whisper = Ilan Vex, a former AEGIS custodian who fled with
# root-access fragments). The writer must land exactly three facts and no more:
#     custodian  ·  key-token  ·  ranked ABOVE cell suppression
# NOBODY ASKS WHAT A CUSTODIAN IS. That is 18.8 in one beat, and it is the reason the
# act 2 reveal lands instead of thudding.
#
# beats:     1) the warden's office: a desk, an ink pad, a list of absentees
#            2) Voss opens the terminal - technician vocabulary, no explanation
#            3) DEX READS THE STANDING ORDER ALOUD (this is what makes an optional
#               document into a mandatory spoken plant, per AR-9)
#            4) a joke about what the Veil has lost
#            5) Mara: it means they are looking at somebody else. Relief.
# optional:  NONE. P2-d STANDS HERE NO LONGER - ruling L1-R37 (01-08), mirrored from the
#            corrected BEATS_M1.2.md. The redacted household record is M1.7.S03.250's,
#            gated on run.m17_record, where it stands beside P2-b.
# writer:    Dex is the loudest character in this mission and it is the only mission in
#            act 1 where that is true. This is where the player learns his voice.

# ---- dialogue-writer notes (L2) ----
# p2-a:      the three facts land in ONE line (.120) and are never touched again:
#            custodian / key token / takes precedence over cell suppression.
#            Nobody asks what a custodian is. Nobody asks what a key token is. Nobody is
#            curious. They are relieved, which is a completely different reaction and it is
#            the reason the act-2 reveal has anywhere to land.
# ar-9:      Dex reads it aloud, so the plant is spoken and mandatory. The staging problem
#            is that Voss is the one at the screen: solved at .100/.110, he pushes the feed
#            to Dex's set. That is technician vocabulary doing structural work.
#            SYSTEMS NOTE: AR-9 only holds if the warden's office is on the mandatory path.
#            The plant table calls the terminal "optional". If level design makes this room
#            skippable, P2-a loses its mandatory carrier and twist 2 has no plant. Reported.
# p2-d:      GONE FROM THIS SCENE, 01-08, ruling L1-R37. The escalation logged here in the
#            previous draft ("the overview plant table places P2-d at M1.7.S03, while
#            BEATS_M1.2 and this stub place it here") was answered: the record lives in
#            M1.7.S03.250, one line behind run.m17_record, and this scene's four
#            unconditional lines are struck. Two things this file was carrying go with them
#            - the missing condition, and .240 on 18.9 C2. Do not write it back: a beat that
#            the spec calls optional and every player hears is not texture any more, and P2-d
#            only does its work standing next to P2-b, which is in M1.7 and not here.
# joke:      .160/.170 is Dex's best line of the act per the beat sheet. It is built as a
#            long sentence and a three-word one so the landing is the short half. It also
#            does the plant's work: the scale of the search IS the size of what was lost.
# band:      in-mission-radio (10-25). Ceiling honoured: longest 18 w (.120, after the 01-08
#            C3 fix; .030 is 17). Shortest 1 w (.020, .140). Variance 18x. Register reached
#            at .010, .030, .050, .060, .120, .160. Twenty-two lines after the L1-R37 cut,
#            so register and spread both still apply and both still pass.
# maxims:    the scene's one permitted maxim (18.9 B, added by L1-R40) is Mara's .200
#            "Orders change. Lists do not." Dex's .060 is the borderline second and it is a
#            different mouth, so the row is clear either way. Reported to L1 with the sweep.
# words:     171 = 205 before the 01-08 L1-R37 cut, -34 for .220 (13 w), .230 (15 w),
#            .240 (3 w) and .250 (3 w). Hand-counted, no shell in that session; the 205 it
#            replaces was re-verified line by line first and was exact.
# ar-5:      Mara: zero "you", zero "I". She has five lines and four of them are under six
#            words - she is on watch, and a person on watch does not make speeches.
# names:     nobody is addressed by name.

lines:
  - id:      M1.2.S04.010
    speaker: VOSS
    voice:   voss
    tags:    [quietly]
    text:    "Warden's office. There's an ink pad on the desk and it's still wet."
    shot:    "One room off the stairhead. A desk, a stamp, a clipboard of absentees with half the column stamped and half not."

  - id:      M1.2.S04.020
    speaker: DEX
    voice:   dex
    text:    "Wet?"

  - id:      M1.2.S04.030
    speaker: VOSS
    voice:   voss
    text:    "He stamped the absentee list on his way out and did not wait for it to dry."

  - id:      M1.2.S04.040
    speaker: DEX
    voice:   dex
    text:    "Then he's back inside the hour. Terminal."

  - id:      M1.2.S04.050
    speaker: VOSS
    voice:   voss
    text:    "It's a warden box. Two ports, one live. I'm on the service side."
    note:    "18.4 Voss: sees the system, names the mechanism, explains nothing. 18.8 in one line."

  - id:      M1.2.S04.060
    speaker: DEX
    voice:   dex
    text:    "Good. Anything that asks for a name, walk away from it."

  - id:      M1.2.S04.070
    speaker: VOSS
    voice:   voss
    text:    "Quarterly postings. District orders. All of it just sitting--"

  - id:      M1.2.S04.080
    speaker: DEX
    voice:   dex
    interrupts: true
    text:    "Don't scroll. Top sheet."

  - id:      M1.2.S04.090
    speaker: VOSS
    voice:   voss
    text:    "The top sheet isn't postings. It's a standing order."

  - id:      M1.2.S04.100
    speaker: DEX
    voice:   dex
    text:    "Push it to my set."

  - id:      M1.2.S04.110
    speaker: VOSS
    voice:   voss
    text:    "Pushing. Line by line."

  - id:      M1.2.S04.120
    speaker: DEX
    voice:   dex
    text:    "District standing order, this quarter. Recovery of the stolen custodian key token. That takes precedence over cell suppression."
    shot:    "Hollow Point. Dex reading off a cracked handset display, flat, the way a man reads a parts list."
    note:    "P2-a. All three facts, one line, delivered without weight. THE PLANT. Twist 2 pays this back at the end of act 2. 18.9 C3, fixed 01-08: it ran '...custodian key-token takes precedence over...' - four Latinate nouns in a row and a k-n / t-k-n / t-k-s consonant stack across the join. The full stop puts the stack either side of a breath and gives the reader the pause a man takes on a bad display. 'key token' is now two words, and 'precedence' stays because .150 repeats it back."

  - id:      M1.2.S04.130
    speaker: DEX
    voice:   dex
    text:    "That's not a footnote. That's line one."

  - id:      M1.2.S04.140
    speaker: MARA
    voice:   mara
    text:    "Again."

  - id:      M1.2.S04.150
    speaker: DEX
    voice:   dex
    text:    "Precedence. Over us."

  - id:      M1.2.S04.160
    speaker: DEX
    voice:   dex
    text:    "Every hand they have on this planet, down on its knees, looking under the furniture."

  - id:      M1.2.S04.170
    speaker: DEX
    voice:   dex
    tags:    [amused]
    text:    "For a key."
    note:    "The joke, and it is doing the plant's job: the size of the search is the size of what was lost. Nobody follows up on what the key opens."

  - id:      M1.2.S04.180
    speaker: MARA
    voice:   mara
    text:    "Then they are counting somebody else this quarter."

  - id:      M1.2.S04.190
    speaker: MARA
    voice:   mara
    text:    "We have a quarter, then."
    note:    "Relief, and it is what makes this plant safe. They hear good news. So does the player."

  - id:      M1.2.S04.200
    speaker: MARA
    voice:   mara
    text:    "Take the list. Orders change. Lists do not."

  - id:      M1.2.S04.210
    speaker: VOSS
    voice:   voss
    text:    "Taking the quarter. All of it."

  # .220-.250 REMOVED 01-08 per ruling L1-R37. P2-d - the redacted personnel record from the
  # Arbiter's household - lives in M1.7.S03.250 and nowhere else. .210 runs clean into .260.
  # IDs .220-.250 are retired, not free: never reuse them in this scene (SCRIPT_FORMAT 2).

  - id:      M1.2.S04.260
    speaker: MARA
    voice:   mara
    text:    "Down the back stair."
