# ---- header ----
scene:        M1.5.S01
mission:      M1.5
title:        "Three Cells, One District"
act:          1
location:     "Kessara / Underworks / Hollow Point — Map Table"
type:         cutscene
credit_tier:  2

# ---- the three-sentence contract (18.7) ----
want:         "Mara wants a meeting with the only other cell on Kessara that has lasted longer than Ember."
obstacle:     "She has asked them twice before and been refused twice, and everyone in the room knows it."
turn:         "She admits the third invitation was not hers — it was theirs, and that is what frightens her."

# ---- state ----
status:       draft
critic:       GO
words:        259

# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.5.md ----
# cast:      MARA, VOSS, DEX, BRICK, REYES
# flags-in:  Story.Beat.M14_Quartermaster · Story.Clue.ThrexVoice_1
# flags-out: none
# beats:     1) who the Iron Chorus are, told as reputation and not as a dossier
#            2) Dex notes their radio discipline is better than Ember's. No envy - he
#               admires it
#            3) Mara's two previous refusals. SHE RAISES THEM HERSELF - Mara does not lie,
#               least of all upward
#            4) the inversion: this time they are asking
#            5) Brick asks one thing. It is practical and it is the right question
#
# LINK TO M1.3.S06 - ONE LINE, NEVER TWO:
# the first name Threx used on that Veil channel belonged to the Iron Chorus. THAT is why
# they are talking now. If the player connects it himself it is one of the best moments in
# the act. If a character explains it, it is a recap.
#
# writer:    Brick never speaks first in a group (18.4) - his question comes late.

# ---- dialogue-writer notes (L2) ----
# format:    written against SCRIPT_FORMAT rulings L1-R1 (bands are ceilings), L1-R5 (voice
#            keys from the casting file: mara / dex / reyes / brick / voss) and L1-R6 (role
#            speakers).
#            *** THE DEFECT THIS NOTE REPORTED IS FIXED - CLOSED 01-08 BY L1. ***
#            It said "M1.1's scenes still carry the superseded mara_sovann / dex_callum /
#            elin_reyes keys". Grepped across the corpus: those three keys appear nowhere
#            except in this note. The report was correct when it was written and the sweep
#            happened afterwards. A closed finding left standing is an instruction to the
#            next writer (L1-R30), which is the only reason this is being touched at all.
# band:      cutscene (20-60). Ceiling respected (max 22 w). Register reached at .040.
# spread:    1 w (.180) to 22 w (.040) = 22x.
# ar-5:      Mara says neither "I" nor "you" anywhere in this mission. Checked line by line.
# link:      .150 IS the M1.3.S06 link and it is the ONLY one. Dex states a fact and drops
#            it. NOBODY ANSWERS IT. The next line changes subject. The player makes the
#            connection or he does not; no character makes it for him. Written without the
#            name itself so that whoever writes M1.3.S06 keeps the choice - this line stays
#            valid whatever name lands there.
# fear:      Mara's turn is .160 and she never names a feeling (18.9 A). Her fear is written
#            as PROCEDURE instead: she benches the medic (.190) and takes the cell off the
#            air (.210) - running the discipline Dex just admired at .040. Nobody remarks
#            on that and nobody may.
# dex:       one joke (.220), the smallest he has. This is not a downtime scene; 18.6's
#            one-in-six ratio is not owed here.
# player:    .154 / .156 are the player's interjection, inserted between tens exactly as
#            SCRIPT_FORMAT section 2 intends. Both are answered by .160 and neither sets a
#            flag - 18.7 wants the player in a scene this long, and it does not want a
#            branch nothing reads.
# brick:     six words, both lines late, neither of them first (18.4).
# reyes:     no contractions anywhere - she is stressed and the training reasserts (18.4).
# omitted:   any line explaining what the Iron Chorus IS. Reputation only, three scraps
#            from three people. See report.

lines:
  - id:      M1.5.S01.010
    speaker: MARA
    voice:   mara
    text:    "Second shift tomorrow. The pump gallery under block nine. Three of us go down, three of them come up."
    shot:    "Map table. She sets a chip on the gallery and leaves her hand over it."

  - id:      M1.5.S01.020
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "The Chorus."

  - id:      M1.5.S01.030
    speaker: DEX
    voice:   dex
    text:    "Four years on this rock and nobody has put a face to one of them. Four years."

  - id:      M1.5.S01.040
    speaker: DEX
    voice:   dex
    text:    "Their net's cleaner than ours. Two keys and gone. No hold, no carrier, nothing left on the air to walk in on."
    note:    "18.4 Dex: fragments, technical nouns. Admiration, not envy - he is describing a machine he wishes he had built. Also the scene's register line (22 w)."

  - id:      M1.5.S01.050
    speaker: REYES
    voice:   reyes
    text:    "How many of them have you counted on the air?"

  - id:      M1.5.S01.060
    speaker: DEX
    voice:   dex
    text:    "None. That's the point. That's the whole point."

  - id:      M1.5.S01.070
    speaker: MARA
    voice:   mara
    text:    "We asked them in the spring. We asked again when the winter list came out. Both times, no."
    note:    "Beat 3. She raises the refusals herself, unprompted, in front of the room. 18.4: Mara does not lie, least of all upward."

  - id:      M1.5.S01.080
    speaker: REYES
    voice:   reyes
    text:    "For the same reason both times?"

  - id:      M1.5.S01.090
    speaker: MARA
    voice:   mara
    text:    "Both times they said Ember was a rumour with eleven people in it."
    note:    "AR-1. The eleven. Said flat, by the woman it was said about."

  - id:      M1.5.S01.100
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "And they'll come onto ground we hold?"

  - id:      M1.5.S01.110
    speaker: MARA
    voice:   mara
    text:    "Since the mast it is ground we hold."
    note:    "M1.3's Foothold paid in seven words. This is why the meeting is fictionally possible at all."

  - id:      M1.5.S01.120
    speaker: VOSS
    voice:   voss
    text:    "The gallery runs three ways. Two stairs and the overflow into the storm cut."
    shot:    "He has turned the chip over to see what is printed underneath it."

  - id:      M1.5.S01.130
    speaker: VOSS
    voice:   voss
    text:    "Pumps cycle on the half-hour. For two minutes nobody down there hears anything, including us."
    note:    "18.4 Voss: names the mechanism. Paid at M1.5.S02.050, where the emissary simply waits the pumps out - he has stood in rooms like this since before Ember existed."

  - id:      M1.5.S01.140
    speaker: MARA
    voice:   mara
    text:    "That's why it's the room."

  - id:      M1.5.S01.150
    speaker: DEX
    voice:   dex
    tags:    [quietly]
    text:    "That channel off the mast. The name he kept saying — theirs."
    shot:    "Nobody picks it up. Mara moves the chip an inch and the room follows her hand."
    note:    "*** THE M1.3.S06 LINK. ONE LINE. NOBODY ANSWERS IT. *** Do not add a second. The name itself is deliberately unspoken so M1.3's writer keeps the choice."

  - id:      M1.5.S01.154
    speaker: VOSS
    voice:   voss
    text:    "What changed for them?"
    note:    "PLAYER OPTION 1 of 2 (interjection). No flag - .160 answers either one, exactly as M1.1.S01.230 answers either approach. The player gets the floor in a scene of 28 turns (18.7) without inventing state nothing reads."

  - id:      M1.5.S01.156
    speaker: VOSS
    voice:   voss
    text:    "What do we have now that we didn't have in the spring?"
    note:    "PLAYER OPTION 2 of 2 (interjection). The obvious answer is forty rifles, and Mara declines to give it."

  - id:      M1.5.S01.160
    speaker: MARA
    voice:   mara
    text:    "This time the asking came the other way."
    note:    "The turn, and it answers option 1 directly and option 2 by refusing it. She does not say what any of it does to her. 18.9 A."

  - id:      M1.5.S01.170
    speaker: REYES
    voice:   reyes
    text:    "How many of us go down?"

  - id:      M1.5.S01.180
    speaker: MARA
    voice:   mara
    text:    "Three."

  - id:      M1.5.S01.190
    speaker: MARA
    voice:   mara
    text:    "Reyes stays up here. We are not walking a medic into a conversation."
    note:    "Fear as procedure. She is preparing for the conversation to stop being one, and she says so by rostering."

  - id:      M1.5.S01.200
    speaker: REYES
    voice:   reyes
    text:    "Then I will set for three."
    note:    "Deliberate echo of M1.1.S01.090. Same woman, same arithmetic, one more name."

  - id:      M1.5.S01.210
    speaker: MARA
    voice:   mara
    text:    "Dex. Nothing on the air from the moment we are in the street. Not a key, not a carrier."

  - id:      M1.5.S01.220
    speaker: DEX
    voice:   dex
    text:    "Dead air. My favourite instrument."

  - id:      M1.5.S01.230
    speaker: BRICK
    voice:   brick
    text:    "Who walks them out?"
    shot:    "He has been against the pillar the whole scene. Everyone turns."
    note:    "18.4 Brick: never speaks first in a group. Four words, and the only question in the room about what happens AFTER the talking. It is also the second half of the mission."

  - id:      M1.5.S01.240
    speaker: MARA
    voice:   mara
    text:    "Voss. And whoever he takes."

  - id:      M1.5.S01.250
    speaker: BRICK
    voice:   brick
    text:    "Then me."

  - id:      M1.5.S01.260
    speaker: MARA
    voice:   mara
    text:    "Second shift. We're early."
