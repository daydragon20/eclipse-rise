# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.5.md ----
# cast:      VOSS, Iron Chorus emissary, BRICK, MARA (rear)
# flags-in:  none
# flags-out: none
# beats:     1) walking the blocks; curfew; nobody outside
#            2) the emissary's questions - why Ember trusts Voss, what happens when Mara
#               is gone. NOBODY HAS ASKED THAT YET AND IT SEEDS M1.8
#            3) what he tells Voss about Mara: something true, something small, something
#               that does not make her worse but does make her human. Suggested: three
#               years ago she asked THEM for help and was refused because Ember was too
#               small to be worth the risk
#            4) Brick's eight words. He names somebody, and the emissary knows the name.
#               That is the first thing the two cells genuinely give each other
# why Brick: he is the only one not negotiating. 18.4 - he never lies. For cells that live
#            on distrust, a man who cannot lie is the best diplomat at the table.
# writer:    the emissary is never menacing. He is somebody who has already buried the
#            version of himself that would have liked Ember.
#
# *** RULING L1-R31, 01-08. THE L1-R14 EXCEPTION FOR THIS MISSION IS WITHDRAWN. ***
# .230 / .240 / .250 MOVE OFF ELEVEN. THE NUMBER IS EIGHTEEN, AND .250 LANDS ON THE
# NINETEENTH DAY.
#
# WHY. This is the only scene in the corpus carrying two meanings of eleven. .150 - "Eleven
# people is not a cell" - is L1-R14's own thesis said out loud by the rival, and it is the
# best use of the number in the act. Eighty lines later the same word measures days under
# questioning, and .240 is a flat echo that isolates the number exactly on the collision.
# The exception rested on one stated ground - "M1.5 is GO" - and all six M1.5 files carry
# status: draft. Meanwhile fifteen scene files now carry an explicit "eleven: L1-R14
# checked" note and M1.6.S03.220 gave up its own number to protect this line. The corpus was
# swept everywhere except here.
#
# REQUIREMENTS - the lines are the writer's, these are not:
#   .230  EXACTLY EIGHT WORDS, unchanged shape: "Cell two. He gave you eighteen days first."
#   .240  ONE WORD. This is the emissary's tic (18.4: repeats the other's last word back,
#         flat). A two-word number turns an echo into a statement.
#   .250  ONE DAY LATER, so the nineteenth. The beat is that he came out the day after the
#         other man broke.
#
# EXCLUDED, MEASURED, DO NOT SUBSTITUTE:
#   seventeen - lives in M1.6.S03.220 since L1-R14 as transit days in a box. Putting it here
#               MIRRORS the defect instead of finishing the repair.
#   nine, six - saturated: spoken 30x and 29x across act 1.
#   thirteen  - M1.1's title and six spoken uses.
#   fourteen  - IN THIS MISSION, S99.100/.110, counting civilians.
#   sixteen   - forces .250 onto the seventeenth, which is M1.6.S03 again.
# Full table: ACT1_OVERVIEW section 7, number register.
#
# NOT AFFECTED: .150 keeps eleven and must. That is the canonical meaning.

# ---- dialogue-writer notes (L2) ----
# format:    L1-R1 / L1-R5 / L1-R6 applied. Speaker EMISSARY was escalated in S02's L2 notes
#            and closed by L1-R6b. The Iron Chorus fighter was the second half of that
#            escalation and is closed by L1-R30: CHORUS_B / iron_chorus_fighter_b, the rival
#            cell's own keys. He is the same man as S04.180 and S05.070/.160.
# band:      walk-and-talk (10-25). Ceiling respected (max 20 w), register reached at .030.
# spread:    1 w (.010 / .210) to 20 w (.140) = 20x.
# mara:      one word (.010), then gone. She is forty metres back and hears none of this.
#            That is the whole point of the staging, and it is why the turn can land.
#
# *** BRICK'S EIGHT WORDS, .230. ESCALATION - READ THIS. ***
# The stub asks Brick to NAME somebody the emissary recognises. No such name exists in canon
# and I may not invent one, so the beat is written WITHOUT a proper noun and loses nothing:
# Brick names an Iron Chorus man by his cell number and by what he cost. M1.4.S03's stub
# establishes three cells in the Foundry Row holding block, two of them empty; Brick was in
# one of them for three months. He is telling the emissary what became of a man the Iron
# Chorus never got back. He never lies, so "first" stays in - the man did break, eventually,
# and Brick will not round that off to make it kinder.
# If Q-4 lands and the Iron Chorus is given names, this line can take one at zero cost.
# EXACTLY EIGHT WORDS. Counted.
#
# eleven:    L1-R14 checked, and this file is the reason the rule exists. ONE spoken eleven
#            survives, at .150, where it measures the size of Ember Cell in the rival's mouth.
#            That is the canonical meaning and it may never be harmonised away.
# eighteen:  RULING L1-R31 EXECUTED 01-08. .230 / .240 / .250 were eleven / eleven / twelfth
#            and are now eighteen / eighteen / nineteenth. Not one other word moved, and both
#            hard constraints hold: .230 is still exactly eight words, .240 is still one. The
#            second is the load-bearing one - a two-word number would turn a flat echo into a
#            statement, and the echo is 18.4's whole fingerprint for this man.
#            `words` does not move. Every substitution is one token for one token: 226.
#            THE SCENE NOW CARRIES ONE MEANING OF ELEVEN INSTEAD OF TWO, which was the point.
#
# *** ESCALATION TO L1 - THE NUMBER REGISTER'S EIGHTEEN ROW IS ONE CARRIER SHORT. ***
# I did not re-open the number and I did not go looking for a better one. This is what a
# grep for the two words I was told to type turned up, reported because the register's own
# rule is "add a row as soon as a number touches a SECOND scene", and eighteen just did:
#   M1.1.S05.080 is SPOKEN and reads "We're eighteen minutes inside that." It took eighteen
#   on 01-08, in this same rulings round, under L1-R14 - and its note says in as many words
#   that eighteen is spoken nowhere in act 1. That was true when it was written and this line
#   is what made it false. ACT1_OVERVIEW's register lists only .230/.240/.250 under
#   "achttien / negentien"; M1.1.S05.080 is not in the carriers column and should be.
#   I EXECUTED RATHER THAN STOPPED because the collision is much weaker than the one being
#   repaired: minutes against days, a relief-cycle margin against an interrogation, four
#   missions apart, and no payoff for it to invert. Eleven's defect was that both meanings
#   were load-bearing. Neither of eighteen's is, yet.
#   If L1 wants it clean anyway, SIXTEEN is free and costs one token in M1.1.S05.080. L1-R31
#   excluded sixteen only because it forces .250 onto the seventeenth, which is Brick's; that
#   objection does not exist in M1.1.
# ALREADY RULED, NOT RE-OPENED: the register accepts nineteen against M1.8.S01.040's door
# count - ordinal against cardinal, three missions apart. Two further uses are outside that
# row and are noted for the register rather than argued: M1.7.S03.040 dates a log
# "Nineteenth of last month" (ordinal against ordinal, but a date, not a count of days) and
# M1.4.S04.140 is "Nineteen years old". .250 is forced arithmetic - one day after .230 - so
# there was never anything here for a writer to choose.
# I have not touched M1.1, M1.4, M1.7 or M1.8, or the register.
#
# lucky:     .250 puts "lucky" in the emissary's mouth attached to a man who was not. He
#            spends the word again at S05.170 about the Veil sweep (P4-b), and by then the
#            player knows what he thinks of it. That rhyme is the whole reason P4-b is
#            carried by the rival instead of by Ember.
# gift:      .260-.270. He gives back tactically (the yard wall, paid at S05.150) and then
#            gives Voss a piece of Mara that Mara does not know he has. That is what makes
#            the walk a transaction and not a courtesy.
# voss:      no axis variants - the scene does not branch (C-6 option b). .080 is 18.4 Voss:
#            he refuses the credit before it is offered.
# omitted:   a reply to .120. Voss has no answer to what Ember is without Mara, and the
#            scene refuses to give him one. See report.

lines:
  - id:      M1.5.S03.010
    speaker: MARA
    voice:   mara
    text:    "Spacing."
    shot:    "From the rear, to nobody in particular. She stays back there for the whole scene."

  - id:      M1.5.S03.020
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Nobody in the windows. Yours, or theirs?"

  - id:      M1.5.S03.030
    speaker: VOSS
    voice:   voss
    text:    "Neither. The wardens run this row at the fourth horn and everyone here can count."

  - id:      M1.5.S03.040
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Mm."

  - id:        M1.5.S03.050
    speaker:   EMISSARY
    voice:     iron_chorus_emissary
    condition: 'story.m15_terms == "accepted"'
    text:      "Your commander agreed fast. That is either discipline or it is nothing at all."

  - id:        M1.5.S03.060
    speaker:   EMISSARY
    voice:     iron_chorus_emissary
    condition: 'story.m15_terms != "accepted"'
    text:      "You didn't hand me the door down there. Good. Nobody should."

  - id:      M1.5.S03.070
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Why do they trust you?"

  - id:      M1.5.S03.080
    speaker: VOSS
    voice:   voss
    text:    "They don't. They trust her, and she puts me in front of things."
    note:    "18.4 Voss: never claims credit in front of the people who did the work. He hands it back before it is even offered."

  - id:      M1.5.S03.090
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "And when she stops putting you in front of things?"

  - id:      M1.5.S03.100
    speaker: VOSS
    voice:   voss
    text:    "Then somebody else stands where I'm standing."

  - id:      M1.5.S03.110
    speaker: CHORUS_B
    voice:   iron_chorus_fighter_b
    tags:    [quietly]
    text:    "Light on the corner. Wardens."
    shot:    "The whole column steps into a doorway without anybody giving an order. Ember is half a beat slower."

  - id:      M1.5.S03.120
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "What happens to Ember when she is gone?"
    shot:    "Voss does not answer. Three doorways go by."
    note:    "SEEDS M1.8. Nobody in the game has asked this out loud yet, and the man who asks it is not a friend."

  - id:      M1.5.S03.130
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Nobody has asked you that."

  - id:      M1.5.S03.140
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "She came to us three years ago. Walked the lanes on her own. Stood outside a door for six hours."

  - id:      M1.5.S03.150
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "We told her no. Eleven people is not a cell. It's a list somebody hasn't filed yet."
    note:    "Rhymes forward into S02's doctrine and backward into M1.5.S01.090. Cruel, true, and he does not soften it."

  - id:      M1.5.S03.160
    speaker: VOSS
    voice:   voss
    text:    "She told the room she asked twice."

  - id:      M1.5.S03.170
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "She did ask twice. She didn't tell them she stood in the rain for the second one."
    note:    "THE TURN. True, small, and it makes her larger rather than smaller. Kessaraan rain is canon (03.3 - warm and grey)."

  - id:      M1.5.S03.180
    speaker: VOSS
    voice:   voss
    text:    "Six hours."

  - id:      M1.5.S03.190
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Six hours. And we watched her do it."

  - id:      M1.5.S03.200
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Foundry Row. The holding block. How many cells?"
    note:    "He is fishing and he is not subtle about it. He has people he never got back."

  - id:      M1.5.S03.210
    speaker: VOSS
    voice:   voss
    text:    "Three."

  - id:      M1.5.S03.220
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Three."

  - id:      M1.5.S03.230
    speaker: BRICK
    voice:   brick
    text:    "Cell two. He gave you eighteen days first."
    shot:    "The emissary stops walking. His two fighters go four paces before they notice he is not with them."
    note:    "*** BRICK'S EIGHT WORDS. *** See the L2 escalation above. He answers a question nobody put to him, in the only currency he has, and it is worth more than everything said in the gallery. EIGHTEEN, NOT ELEVEN, BY RULING L1-R31 - and still exactly eight words: Cell / two. / He / gave / you / eighteen / days / first."

  - id:      M1.5.S03.240
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Eighteen."
    note:    "*** ONE WORD, AND IT STAYS ONE. *** 18.4 emissary: he repeats the other man's last word back, flat, and adds nothing. A two-word number turns the echo into a statement and the tic into a comment."

  - id:      M1.5.S03.250
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    tags:    [quietly]
    text:    "We came out of that quarter on the nineteenth day. We thought we'd been lucky."
    note:    "*** 'Lucky' is planted here, on a man who was not. He spends the word again at S05.170. *** The nineteenth is one day after .230, and that gap is the beat: he walked out the morning after the other man stopped holding."

  - id:      M1.5.S03.260
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "The house tonight. Two doors and a yard wall. Take the wall."
    note:    "Paid at S05.150. The first thing the Iron Chorus gives Ember without being asked for it."

  - id:      M1.5.S03.270
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "She still doesn't know we watched."

  - id:      M1.5.S03.280
    speaker: VOSS
    voice:   voss
    text:    "The yard wall backs onto the storm cut."
    shot:    "He says it to the street. He is already reading the block the way he read the map."
