# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.5.md ----
# cast:      VOSS, MARA, BRICK · Iron Chorus emissary + two Iron Chorus fighters
# flags-in:  none
# flags-out: none (the pact commits at S99)
# beats:     1) arrival; three exits; nobody sits down
#            2) the emissary tests - no threat, just questions nobody can answer well
#            3) P3-b: HE ASKS HOW EMBER VETS ITS PEOPLE. Ember vets nobody. He laughs,
#               and it is not a kind laugh. PLANT FOR TWIST 3 - IT MUST SOUND LIKE
#               ARROGANCE, NOT LIKE FORESHADOWING
#            4) their doctrine: the Dominion does not fall until the people who keep it
#               running pay a price. Defensible in one sentence (2.7 rule 2): shift bosses
#               file the absentee lists the Tithe draws from
#            5) THE OFFER: joint operation, their terms, one name first
#            6) the player gets the floor
#
# LONGEST DIALOGUE SCENE IN ACT 1, and the only place the player genuinely negotiates.
# Three or four options with REALLY different outcomes - not three flavours of yes.
#
# THE IRON CHORUS IS RIGHT ABOUT AT LEAST ONE THING AND THE PLAYER MUST NOTICE.
# If they are only hard, the mission is a straw man and the act 3 payoff is worthless.
#
# casting:   the emissary has no name until owner question Q-4 is answered. Write him as
#            "the emissary" - it suits a cell that does not give its names away, and it is
#            reversible. DO NOT INVENT A NAME.
# writer:    18.3 variance (factor 3) and 18.9 B symmetry bite hardest here. Put
#            interruptions in. Let somebody dodge a question and never come back to it.
#            Full Voss variant coverage on both axes.

# ---- dialogue-writer notes (L2) ----
#
# *** ESCALATION 1 - SPEAKER TOKEN. One word, and it is the only one in the mission. ***
# L1-R6 allows a glossary name or ^(FIGHTER|CONSCRIPT|VEIL|CIVILIAN|OFFICER|PRISONER)_[A-Z]$.
# The emissary is neither: Q-4 has not given him a name, and its own justification ("AR-1
# and AR-10 keep Ember's RANK AND FILE nameless") does not describe the second lead of a
# dialogue mission. I have written `speaker: EMISSARY` because the stub, the beat sheet and
# the casting key all call him that, and because burying him in FIGHTER_C would make sixty
# lines unreadable for the critic's strip test.
# ASK: add EMISSARY to L1-R6's alternation, or answer Q-4. Zero-cost fallback if the ruling
# goes the other way: EMISSARY -> FIGHTER_C, and shift the two fighters to _D and _E.
# Generation is NOT at risk either way - `voice: iron_chorus_emissary` resolves today.
#
# CLOSED 2026-07-31 by L1-R6b: EMISSARY is in the alternation, the writer was right, and his
# fingerprint went into 18.4 verbatim. Q-4 (a proper name) stays open and stays optional.
# THE PATTERN QUOTED ABOVE IS STALE - it is what L1-R6 said on 31-07. Current, per L1-R30:
# ^(FIGHTER|CONSCRIPT|VEIL|CIVILIAN|OFFICER|PRISONER|CHORUS)_[A-Z]$, or EMISSARY.
# THE FALLBACK IN THE LINE ABOVE IS NOW FORBIDDEN, not merely unused: putting the emissary on
# FIGHTER_C would re-file the rival cell under Ember's token, which is the whole of L1-R30.
#
# *** ESCALATION 2 - IRON CHORUS FIGHTER VOICES. ***
# L1-R5's table has no iron_chorus_fighter_* key, so the two fighters carry
# eclipse_fighter_c / _d, which resolve. That is the CHEAP answer the beat sheet section 10
# names and it is a voice-director decision, not mine: two Iron Chorus lines here
# (.220, .480) and four across the mission are doing faction-differentiation work, and .220
# in particular is the line that stops the emissary's boast being a boast. Reported, not
# quietly settled.
#
# CLOSED 2026-08-01 by L1-R30, and the escalation was right on every point. The voice-director
# took the BETTER answer of beat sheet section 10, not the cheap one: these two are cast as the
# rival's people (owner card O-16, slot C "she belongs to the Iron Chorus, not to you"). So the
# keys moved with the casting - `iron_chorus_fighter_a` / `_b`, and `speaker: CHORUS_A` / `_B`.
# Ember's `eclipse_fighter_c` / `_d` are retired, not aliased. Cost: zero, nothing generated.
# Still open and NOT blocked by this: those two slots have no bound voice until O-16.
#
# band:      hub (12-35), ceiling respected (max 20 w). Register reached repeatedly.
# spread:    1 w (.190 "Nobody.") to 20 w (.210 / .460) = 20x.
#
# EMISSARY FINGERPRINT (proposed - 18.4 has no row for him; see report):
#   syntax  clipped declaratives; counts where anyone else would use an adjective
#   tic     repeats the other person's last word back at them, flat (.030 .200 .230 .380)
#   never   NEVER USES A PERSON'S NAME. Not Mara's, not Voss's, not Brick's, not his own,
#           not his fighters'. "She", "the big one", "your commander". A cell that does not
#           give its names away does not spend anyone else's either. Mechanically checkable,
#           and it is what makes Mara's use of "Voss" in S99 land.
#   right   he is correct at .170, at .300 and at .400. The player must feel all three.
#
# P3-b:     .150-.230, and it is the spine of the mission. Played as a RIVAL SCORING A POINT
#           OFF THE NEWEST MAN AT THE TABLE. Ember's reaction is offence, not unease.
#           .220 - his own fighter correcting the count upward - is what turns the boast
#           into a bill. NOTHING IN THE SCENE MARKS IT AS IMPORTANT. Nobody returns to it,
#           here or in S99.
# dodge:    .090 asks who tipped Ember on the armoury. .100 answers a question nobody asked.
#           It is never returned to, in this scene or anywhere in M1.5.
# ember-hit: .410. Voss works out that this meeting may itself be the small false thing, and
#           the emissary says yes. The only unguarded word he gives Ember, and the moment
#           the negotiation actually starts.
# choice:   .490-.520, group m15_terms, four outcomes that are not four flavours of yes.
#           story.m15_terms is read at S03.050/.060 and S99.150. EVERY BRANCH STILL REACHES
#           S04 - he walks Ember to the house either way, and refusing the condition is not
#           refusing the walk.
# triads:   exactly one (.430), and it is his offer, so it is allowed to sound rehearsed.
# em-dash:  two in fifty-four lines (.070 rhetorical, .130 interruption).
# omitted:  a menacing line. He never threatens once, in any scene. See report.

lines:
  - id:      M1.5.S02.010
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "She said three. There are three."
    shot:    "Standing water. Three mouths to the gallery, one of them dark. Nobody has taken a hand off anything."

  - id:      M1.5.S02.020
    speaker: VOSS
    voice:   voss
    text:    "Three ways out of this gallery. You came in by two of them."

  - id:      M1.5.S02.030
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "We did."

  - id:      M1.5.S02.040
    speaker: MARA
    voice:   mara
    text:    "There are crates against the wall."

  - id:      M1.5.S02.050
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "We'll stand."
    shot:    "The pumps come up under the floor. Two minutes of noise. He waits them out without moving his eyes."
    note:    "Pays M1.5.S01.130. Ember chose this room for the two minutes of cover; he simply waits."

  - id:      M1.5.S02.060
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Forty rifles out of Foundry Row. Sealed crates, and the door was not burned."

  - id:      M1.5.S02.070
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Forty rifles is forty pairs of hands. So which is it — forty of you, or thirty strangers?"
    note:    "His want, stated as arithmetic. Cell or crowd."

  - id:      M1.5.S02.080
    speaker: MARA
    voice:   mara
    text:    "We took what was there."

  - id:      M1.5.S02.090
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Who told you it would be there?"

  - id:      M1.5.S02.100
    speaker: MARA
    voice:   mara
    text:    "The gallery runs dry at the fourth horn. Nobody should still be in it."
    note:    "*** THE DODGE. *** She answers a question nobody asked. Never returned to by anybody in this mission."

  - id:      M1.5.S02.110
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    tags:    [beat]
    text:    "Mm."
    shot:    "He files it. He does not chase it, and that is worse."

  - id:      M1.5.S02.120
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "The big one. Four days on your roster."

  - id:      M1.5.S02.130
    speaker: MARA
    voice:   mara
    text:    "He came out of a cell that we--"

  - id:         M1.5.S02.140
    speaker:    EMISSARY
    voice:      iron_chorus_emissary
    interrupts: true
    text:       "I know what he came out of."

  - id:      M1.5.S02.150
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "How do you check the people you take in?"
    note:    "P3-b OPENS HERE."

  - id:      M1.5.S02.160
    speaker: VOSS
    voice:   voss
    text:    "We know where they come from."

  - id:      M1.5.S02.170
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "That's not checking. That's recognising."
    note:    "He is right, and it is the cheapest correction in the game. Nobody in Ember has an answer to it."

  - id:      M1.5.S02.180
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Who checked you?"
    shot:    "He has turned to Brick. He has not raised his voice and he is not smiling."

  - id:      M1.5.S02.190
    speaker: BRICK
    voice:   brick
    text:    "Nobody."
    shot:    "The pumps are off. Nobody fills it."
    note:    "*** P3-b, THE PLANT ITSELF. *** 18.4: Brick never lies, and the man who cannot lie is the man who hands the rival his point. One word. Nothing marks it. Do not mark it."

  - id:      M1.5.S02.200
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    tags:    [laughs]
    text:    "Nobody."

  - id:      M1.5.S02.210
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "We hold a man three months before he carries anything heavier than a message. Three months. We still lost two."

  - id:      M1.5.S02.220
    speaker: CHORUS_A
    voice:   iron_chorus_fighter_a
    text:    "Three."
    note:    "His own fighter corrects the count upward. It stops the boast being a boast and turns it into a bill - what three months of discipline still costs. Speaker and voice keys are the rival cell's own (L1-R30); escalation 2 is closed."

  - id:      M1.5.S02.230
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Three."

  - id:      M1.5.S02.240
    speaker: VOSS
    voice:   voss
    text:    "After three months, what tells you?"
    note:    "18.4 Voss: he wants the mechanism, not the verdict."

  - id:      M1.5.S02.250
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Nothing tells you. You hand him something small and false, and you watch where it comes out."

  - id:      M1.5.S02.260
    speaker: MARA
    voice:   mara
    text:    "We are not going to feed our own people lies."

  - id:      M1.5.S02.270
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "No. You'll do what we did."
    note:    "The whole Iron Chorus thread in six words: we were you, and this is the road. 2.11's fusion / schism / tragedy starts here."

  - id:      M1.5.S02.280
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "The mast on the checkpoint road. That was Ember."

  - id:      M1.5.S02.290
    speaker: VOSS
    voice:   voss
    text:    "That was us."
    note:    "18.4 Voss: he does not say 'that was me' in front of the people who carried the charges."

  - id:      M1.5.S02.300
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "The district shouted for one night. The Tithe ran the next morning at the usual hour."
    note:    "He deflates Ember's largest victory with a fact, and the fact is true. The scene's obligation: the rival is RIGHT."

  - id:      M1.5.S02.310
    speaker: MARA
    voice:   mara
    text:    "People stood in the street."

  - id:      M1.5.S02.320
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "They did. Then they went to work."

  - id:      M1.5.S02.330
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "The Tithe doesn't run on soldiers. It runs on a sheet of who was not at their bench."

  - id:      M1.5.S02.340
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Shift bosses file the sheet. No sheet, no quota. No quota, no transport."
    note:    "2.7 rule 2 - the doctrine, defensible in one sentence, with no rhetoric attached to it."

  - id:      M1.5.S02.350
    speaker: VOSS
    voice:   voss
    text:    "How many file for the Foundry District?"

  - id:      M1.5.S02.360
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Nine. Five have stopped."

  - id:      M1.5.S02.370
    speaker: VOSS
    voice:   voss
    text:    "Stopped."

  - id:      M1.5.S02.380
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Two of them moved up to the Spire side. Yes. Stopped."
    note:    "He confirms three killings without saying a word that could be quoted. He is not hiding it; he is declining to dress it."

  - id:      M1.5.S02.390
    speaker: MARA
    voice:   mara
    text:    "And the quota?"

  - id:      M1.5.S02.400
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Down a fifth since the winter."
    shot:    "Mara does not answer. She has nothing to set beside that number, and the gallery watches her not have it."
    note:    "IT WORKED. The hardest line in the mission to write, and the reason act 3 can afford this cell at all."

  - id:      M1.5.S02.410
    speaker: VOSS
    voice:   voss
    text:    "Something small and false. Is that what tonight is?"

  - id:      M1.5.S02.420
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Yes."
    note:    "The one unguarded word he gives Ember, and the most respect anybody shows anybody in this scene."

  - id:      M1.5.S02.430
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Our operation. Our timing. Your ground."
    note:    "The only triad in the scene (18.9 B). It is his offer, so it is allowed to sound rehearsed."

  - id:      M1.5.S02.440
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "After that we plan together and your people learn what a check looks like."

  - id:      M1.5.S02.450
    speaker: VOSS
    voice:   voss
    text:    "And tonight?"

  - id:      M1.5.S02.460
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Tonight there's a name on our list four streets from here, and Ember stands in the room while it closes."

  - id:      M1.5.S02.470
    speaker: MARA
    voice:   mara
    text:    "Watch."

  - id:      M1.5.S02.480
    speaker: EMISSARY
    voice:   iron_chorus_emissary
    text:    "Anybody can shake a hand. I want to see what a cell does with its face."
    shot:    "One of his fighters has already moved to the dark stair mouth. She was there before he finished."

  - id:      M1.5.S02.490
    speaker: VOSS
    voice:   voss
    choice:
      group: m15_terms
      set:   'story.m15_terms = "accepted"'
      label: "Accept his terms."
    text:    "We'll be at the door."
    variants:
      pragmatist: "One name against forty rifles' worth of cover. We'll be at the door."
      idealist:   "We'll be at the door. And we'll be looking at what happens on the other side of it."
      personal:   "We'll be at the door. Somebody should be."
      strategic:  "We'll be at the door. The one after that goes on our map, not yours."

  - id:      M1.5.S02.500
    speaker: VOSS
    voice:   voss
    choice:
      group: m15_terms
      set:   'story.m15_terms = "conditional"'
      label: "Come, but commit to nothing."
    text:    "We walk with you. What happens at the door, I call there."
    variants:
      pragmatist: "We walk with you. Nothing is agreed until I have seen the house."
      idealist:   "We'll walk with you. Nobody here is promising what he does at the end of it."
      personal:   "We walk with you. I decide at the door and not before."
      strategic:  "We walk with you. The rest holds until I know who else is on that list."

  - id:      M1.5.S02.510
    speaker: VOSS
    voice:   voss
    choice:
      group: m15_terms
      set:   'story.m15_terms = "refused"'
      label: "Refuse the condition."
    text:    "Our ground and our guns. Not a name."
    note:    "He still walks them out. Refusing the condition is not refusing the escort, and the emissary takes Ember to the house anyway (.550)."
    variants:
      pragmatist: "Ground and guns. The list isn't ours to sell."
      idealist:   "Everything we have is on that floor except a man's name."
      personal:   "Not a name. Not out of me."
      strategic:  "A name buys you one night. Ground buys you a district."

  - id:      M1.5.S02.520
    speaker: VOSS
    voice:   voss
    choice:
      group: m15_terms
      set:   'story.m15_terms = "counter"'
      label: "Turn the test around."
    text:    "Whose list are we on?"
    variants:
      pragmatist: "Before any of that. Who has us on a sheet?"
      idealist:   "You want a name off us. Say whose list has ours on it first."
      personal:   "Somebody files for us as well. Who?"
      strategic:  "Nine file for this district. Which of them files for Ember?"

  - id:        M1.5.S02.530
    speaker:   EMISSARY
    voice:     iron_chorus_emissary
    condition: 'story.m15_terms == "accepted"'
    text:      "Then walk behind us, and let nobody in that house hear an Ember voice."

  - id:        M1.5.S02.540
    speaker:   EMISSARY
    voice:     iron_chorus_emissary
    condition: 'story.m15_terms == "conditional"'
    text:      "Decide at the door. That's where everyone finds out."

  - id:        M1.5.S02.550
    speaker:   EMISSARY
    voice:     iron_chorus_emissary
    condition: 'story.m15_terms == "refused"'
    text:      "Come anyway. Look at the bill before deciding not to pay it."

  - id:        M1.5.S02.560
    speaker:   EMISSARY
    voice:     iron_chorus_emissary
    condition: 'story.m15_terms == "counter"'
    text:      "Ember is. Since the mast."
    note:      "The act's spine handed over as a jab: every victory made them more visible. He does not explain it and Ember does not ask."

  - id:        M1.5.S02.570
    speaker:   EMISSARY
    voice:     iron_chorus_emissary
    condition: 'story.m15_terms == "counter"'
    text:      "Come and see the other end of a sheet."

  - id:      M1.5.S02.580
    speaker: MARA
    voice:   mara
    text:    "Second stair. We go up first."
