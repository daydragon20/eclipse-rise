# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.4.md ----
# cast:      MARA, VOSS, DEX, REYES, BRICK, the cell
# flags-in:  Story.Beat.BrickRecruited
# flags-out: Story.Beat.M14_Quartermaster (exists) · Story.Beat.BrickRecruited (exists)
# commit:    +200 M / +100 C, day +1, Brick onto the roster, UnlockedLoadoutTags +=
#            real-rifle tier, optional no-soldier-downed +15 M. No region flip.
# beats:     1) the haul laid out; Dex unable to leave it alone
#            2) the bill: what it cost
#            3) REYES EXAMINES BRICK. Ex-Dominion medic facing ex-Dominion prisoner. She
#               knows exactly what his cell looked like because she worked inside that
#               system. SHE DOES NOT SAY SO. The player reads it off her hands
#            4) the names
#            5) Mara puts Brick on the list
#            6) P3-a: Dex notes that somebody has to keep track of all this. There is a
#               stock now, so there is a ledger, so there is a JOB
#
# *** P3-a IS THE TWIST-3 PLANT AND IT MUST LAND AS A JOKE. ***
# "Somebody has to keep track of this" may not sound weighty under any circumstances. If
# it sounds weighty, the player knows who the mole is in act 3 before the game tells him.
#
# *** REYES CONTRACTS IN THIS SCENE. THIS IS HER BASELINE - RULING L1-R19. ***
# 18.4 gives her "drops contractions WHEN STRESSED - training reasserts". That is a
# DIFFERENTIAL tell, and a differential with no baseline never fires. She uses zero
# contractions in M1.1 (defensible - she is under pressure in every appearance there) and
# drops them again in M1.6.S06 and hard in M1.8.S07. If nobody ever establishes the relaxed
# Reyes, four acts of writers will assume that clipped register IS her voice, and the tell
# becomes invisible exactly when it should land hardest.
#
# This scene is where she is most in her element: a careful examination, in the base, after
# a win, on her own terms. SHE CONTRACTS HERE - "I've", "he's", "don't" - naturally and
# without comment.
#
# The act 1 ladder is then: M1.4.S99 baseline -> M1.6.S06 drops -> M1.8.S07 drops hard.
# HUB.A1.reyes_first_conversation is a second baseline but CANNOT be relied on: the hub
# tier fell out of the budget (L1-R11), so this is the only VOICED baseline she gets.
#
# *** AMENDED 01-08 - RULING L1-R22. THE BASELINE WAS NEVER WRITTEN, AND THE FIX IS NOT
#     "RELAX HER EVERYWHERE". READ THIS BEFORE TOUCHING A REYES LINE. ***
# Counted, not assumed. This scene has TEN Reyes lines (.070 .090 .100 .110 .130 .140 .150
# .170 .190 .200), and ON THE DAY THIS RULING WAS WRITTEN not one of them contracted:
# .130 read "That is a place", .140 read "Then it is old... and I cannot open it tonight".
# So the L1-R19 differential was firing against an identical background, which made it
# inaudible. THAT IS NO LONGER THE STATE OF THIS FILE - the ruling was executed on 01-08
# and .070 .130 .140 contract now. The diagnosis is kept because it is the reason the
# lines look the way they do; do not read it as work still owed, and do not put the
# uncontracted wording back. That is my ruling failing, not a writing failure - the
# L2 note below says "zero contractions", which is 18.4's static reading, and 18.4 is where
# a writer looks when he needs a voice. The instruction was here and it lost.
#
# WHICH LINES, AND WHY .190 IS DIFFERENT:
#   .070  .130  .140   CONTRACT. Inventory, a dry correction to Brick, a diagnosis. She is
#                      working, in her element, after a win. This is the baseline.
#   .190  .200         DO NOT CONTRACT, AND THAT IS PERMANENT. These are the two lines
#                      AFTER "Tam. Oyelaran. Vic."
# The tell therefore fires ONCE, quietly, INSIDE its own baseline scene, on the exact beat
# where Brick puts three names on the table and she closes her kit. Then M1.6.S06 is the
# same instrument louder and M1.8.S07 is it hard.
# A baseline that is only a baseline teaches the player nothing. A baseline in which the
# needle moves once teaches him what to listen for. Generalised in L1-R22 and it now applies
# to Torren's silences and Kaya's undercutting in act 2 as well.
# COST: zero. status is draft, critic is null. Nothing is generated and nothing is re-paid.
#
# *** .020-.050 IS A T4 TOUCH, AND THE SECOND CARRIER OF PLANT P4-e. RULING L1-R45 (02-08).
#     NOT ONE WORD OF DIALOGUE CHANGES. READ THIS BEFORE YOU "FIX" ANYTHING HERE. ***
# The critic could not decide this and was right not to: only L1 may put a row in the touch
# inventory, and the inventory says "write a ninth one into this table or do not write it".
# I have measured it against the definition instead of against the L2 note, and it is a touch.
# THE DEFINITION HAS THREE PARTS AND THIS BEAT HAS ALL THREE:
#   1  THE DOMINION FALLS SHORT.   .020 - the book said forty were in that hall and there
#      were twenty-six. .030 asks where the other fourteen are. That is fourteen missing
#      bodies off a defended position, which is the same SHAPE as P4-a (a block the Veil
#      marked and never swept) and P4-b (a sweep that came late and thin).
#   2  A PERSON ACCOUNTS FOR IT.   Twice. Dex says corruption (.040, "sold, or written into
#      a column nobody checked"); Mara overrides him with competence (.050, "we got in
#      because we were better than they are").
#   3  NOBODY ARGUES.              The shot on .060 says so in as many words, and the L2 note
#      correctly calls that shot load-bearing.
# SO THE L2 CLAIM "this deliberately does NOT plant T4" WAS UNTRUE ABOUT ITS OWN FILE, and
# its stated ground - "the armory was fully defended" - is contradicted four lines earlier by
# .020. It is corrected below. This is the recurring failure of eight critic rounds: never a
# bad line, always a note that asserts something the file denies.
#
# WHAT IT COSTS TO REGISTER IT: nothing, and that is the point. The line is already flat.
# "We got in because we were better than they are" has no parallelism, no antithesis and no
# closing image - it is a plain declarative, which is exactly what L1-R17 asks of a touch.
# It does not add to the form-tell. What it adds is a ROW IN THE COUNT, so that the ninth
# touch is measured against nine and not against eight.
#
# IT IMPROVES MARA'S CURVE INSTEAD OF DISTURBING IT. Play order now reads: competence
# (M1.2.S03.150) -> self-belief, HERE -> consensus from another mouth (M1.5.S05.200) -> the
# first crack (M1.6.S05.410) -> her own sentence repeated (M1.7.S06.160) -> two unfinished
# reasons (M1.8.S03.130) -> four words on a dead radio (M1.8.S09.130). This scene is the TOP
# of that curve, not a crack in it: it is the most confident and the most personal version she
# ever gives, and the L2 note already had the requirement exactly right - "not a comfort that
# reads as a lie later, but a conviction that reads as a cause of death".
#
# AND THE RHYME NOBODY HAD REGISTERED, WHICH IS THE BEST ARGUMENT FOR LEAVING IT ALONE:
# Dex's TRUE explanation is cut off mid-word here (.040), and Dex's TRUE explanation of the
# K-77 betrayal is cut off mid-word in M1.8.S99.080. Same man, same shape, seven missions
# apart, and both times the correct answer is the least finished sentence in the room. That
# was written twice by two writers who could not see each other. Do not tidy either one.
#
# P4-e: this beat shares one plant row with M1.4.S04.220, which is the same fact from the
# Dominion's side - a clerk booking a shortfall against the DISTRICT ALLOCATION. The cell
# explains the missing fourteen as theft; the building's own officer files losses by
# allocation, two scenes apart, in one mission. Act 4 turns both over at once. AR-9 is
# satisfied twice: both carriers are mandatory, spoken and unconditional.
# CONTINUITY DEBT TO ACT 4, and it is registered in ACT1_OVERVIEW section 4 so it cannot be
# forgotten: whoever writes the twist-4 payoff must be able to point back here. The fourteen
# were not embezzled - they were allocated elsewhere, because a pressure valve has to be able
# to arm itself. Nothing in act 1 may say that, hint at it, or let anybody wonder about it.
#
# writer:    Reyes's arc is "from penance to purpose" (2.5). This is the first stone: she
#            treats a man she would once have been ordered to triage by loyalty score.
#            The scene knows it. She does not say it.

# ---- dialogue-writer notes (L2) ----
# band:      `cutscene` (20-60) read as a CEILING per the M1.1 precedent; longest base
#            line 19 w. A 20-word floor and 18.3's variance rule cannot both hold.
# variance:  1 w (.060 / .080 / .120 / .160) to 19 w (.040) = 19x.
#
# eleven:    L1-R14 checked. *** READ THIS BEFORE PUTTING A NUMBER BACK. ***
#            .010 read "Eleven rifles that fire today". Rifles are on the ruling's own
#            exclusion list, and the defence that eleven rifles are eleven people does not
#            survive the same line: "Four more when I've had a night with them" makes it
#            fifteen, and twenty lines later .210 puts Bex on the roster. The count never
#            was the cell. It is gone.
#            WHAT REPLACED IT, AND WHY IT IS NOT A NUMBER. `check_spoken_numbers.py` could
#            not be run in this session - no shell - so the corpus was swept by hand with
#            the rule that tool applies (number words inside `text:` and variant lines).
#            Every value that would fit a haul of nine crates is already carrying weight
#            somewhere: thirteen is M1.1's title and is quoted in this mission at
#            S02.200; fourteen is M1.5's civilians and stands two lines below at .030;
#            fifteen is the age of two dead conscripts in M1.3.S01; seventeen is Brick's
#            days on the Krad-9 wagon and Brick is in this room; nineteen is his own line
#            in S04; twelve is what the cell becomes when Voss joins, which is the exact
#            drift this ruling exists to stop, in the exact scene where the roster grows.
#            So the clause stopped counting. "A rifle each that fires today" says the
#            thing the mission is for without spending a number on it, it is true whether
#            the roster reads eleven or twelve, and it pays M1.1 - five between us,
#            thirteen rounds - without quoting either. Dex still opens on a hard count,
#            which is his fingerprint; he just does not put a second one next to it.
#            Do not write here that some number is free. Four agents wrote that sentence
#            about four different numbers on 01-08 and all four are untrue now. The one
#            eleven this mission keeps is S01.140, "Eleven bunks", and it means the cell.
# words:     300. The line is one word longer than it was (17 -> 18) and .040 is still the
#            longest at 19, so the deliberate REGISTER red below is untouched.
#
# *** REGISTER: RED, DELIBERATELY, REVIEWED 01-08. DO NOT "FIX" THIS BY ONE WORD. ***
# The scene misses the cutscene floor by one word, and the 19-word line is .040 - the line
# MARA CUTS IN HALF at .050. Its length is not mine to set; it is set by where the
# interrupter comes in, and one more word before the cut is one more word she has to talk
# over. Everything else in the room is short because of who is in it: Dex in fragments,
# Brick on a 30-word mission budget, Reyes clinical, Mara terse. There is no beat here
# asking for room - the two that could take it (.100, the P3-a joke at .250-.290) are
# explicitly instructed SHORTER by L1: her history must stay unspoken and the job must
# land as a complaint. A twentieth word would buy a green bar and cost the scene.
# beat map:  the haul .010-.040 | THE EXPLANATION .040-.060 | the bill .070-.080 |
#            Reyes examines Brick .090-.140 | the names .150-.200 | the roster .210-.220 |
#            Voss hands the night away .230-.240 | P3-a .250-.290
#
# *** .040-.060 IS THE ONE THE ACT HANGS ON. ***
# Dex is halfway through the true explanation - their book was rotten, that is how we got
# in - and Mara CUTS HIM OFF with the flattering one. She is not reassuring anybody and
# she is not covering anything up; she believes it, she has earned the right to believe
# it, and every player in the room believes it with her. That is the requirement: not a
# comfort that reads as a lie later, but a conviction that reads as a cause of death.
# The shot on .060 is load-bearing: NOBODY DISAGREES WITH HER. Dex shrugs. If Dex looks
# doubtful, the twist is flagged sixty hours early and the scene is worthless.
# NOTE - CORRECTED 02-08 BY RULING L1-R45. The sentence that stood here said "this
# deliberately does NOT plant T4", on the ground that "the armory was fully defended". That
# ground is contradicted by .020 four lines above it: the book said forty and there were
# twenty-six. IT IS A T4 TOUCH AND IT IS NOW REGISTERED - see the L1 block for the full
# reasoning, and do not put the old sentence back.
# WHAT THE NOTE HAD RIGHT, AND IT IS THE HALF THAT MATTERS TO THE WRITING: what is planted
# here is Mara's READING of the win. It is a character fact first and an enemy fact second,
# and it is written flat on purpose. Nothing changes in these five lines.
#
# reyes:     her biggest scene of the act and she never says where she learned any of it.
#            .100 is the whole thing: she knows where the cuff sits in a Dominion holding
#            block before she has looked. Dex clocks it and says nothing (shot). No line
#            in this file states or hints that she served. 2.5's "penance to purpose"
#            arrives as a prescription at .200 and is never named.
#            18.4: complete clinical sentences, questions instead of accusations. NOT
#            "zero contractions" - that sentence stood here while L1-R22 sat six lines
#            above it saying the opposite, and the lines followed this note, not the
#            ruling. She contracts at .070 .130 .140 and stops at .190. She is also
#            allowed to be slightly short with him at .130 - 18.9 D says real people
#            are petty.
# brick:     5 words here (.120 = 1, .160 = 1, .180 = 3). Mission total 27, under the 30.
#            .180 is the SECOND time the player hears the three names, and this is where
#            it lands: for three months in the dark, that was the whole of his work.
#            No explanation follows, here or ever.
# .210:      the name he gave in S05 goes on the roster. Mara never says it back to him.
# .220:      the list is getting too long to say out loud - the M1.6 plant the beat sheet
#            asks for. Deliberately NOT a wall and NOT a plate: the wall is M1.8's and I
#            am not spending it here.
# variants:  .240, all four axes. Voss is handed the night's credit and hands it straight
#            to a man who is sitting in the room. 18.4: never claims credit in front of
#            the people who did the work.
# *** P3-a: .250-.290 AND IT IS A JOKE. *** The job exists by the end of .270 and the
#            last thing anybody says about it is that it comes with a pencil. Nobody
#            volunteers, nobody is appointed, nobody is looked at. If this beat sounds
#            weighty the player knows the mole in act 3 before the game tells him.
# no flags:  no `condition` anywhere in this scene. The casualty state of the run is not
#            readable from any tag that exists, so every line here is written to be true
#            on both outcomes. .070 states injuries, never deaths.

lines:
  - id:      M1.4.S99.010
    speaker: DEX
    voice:   dex
    text:    "Nine crates out. A rifle each that fires today. Four more when I've had a night with them."
    shot:    "Bunk row. The haul is laid down the middle of the floor and there is nowhere left to walk."
    note:    "Nine, against the four Dex costed in S01. The difference is Brick and nobody says so. L1-R14: the middle clause was a spoken rifle count and it is now a ratio - see the `eleven` note in the L2 block. It also pays M1.1 without quoting it: five between us, thirteen rounds, and now one each that works."

  - id:      M1.4.S99.020
    speaker: DEX
    voice:   dex
    text:    "And their book said forty were in that hall. There were twenty-six."
    note:    "*** T4 TOUCH OPENS - L1-R45 (02-08). *** Fourteen missing bodies off a defended position: the same shape as P4-a and P4-b, one mission earlier than either. In act 1 this is a paperwork fact about a corrupt garrison and it must never read as stranger than that. FORTY here is the Dominion's OWN BOOK and it is a lie in the fiction - it is not the forty-one of M1.6's intake (L1-R32) and not the freed of M1.8. Nobody counts it twice and nobody comes back to it."

  - id:      M1.4.S99.030
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "So where's the other fourteen?"

  - id:      M1.4.S99.040
    speaker: DEX
    voice:   dex
    text:    "Sold, or written into a column nobody checked. That's how we got in, and it's the only reason we--"

  - id:      M1.4.S99.050
    speaker: MARA
    voice:   mara
    interrupts: true
    text:    "We got in because we were better than they are."
    note:    "*** T4 TOUCH, REGISTERED - L1-R45. THE LINE DOES NOT CHANGE. *** It is already flat: no parallelism, no antithesis, no closing image. That is what L1-R17 asks of a touch and it is why registering it costs nothing. This is the TOP of Mara's curve, not a crack in it - the most confident and most personal explanation she ever gives - and the curve breaks down from M1.6.S05.410 onward. If anybody ever polishes this into something quotable, the whole breakdown curve inverts. Dex's true explanation is cut off mid-word by it, exactly as it is again in M1.8.S99.080."

  - id:      M1.4.S99.060
    speaker: DEX
    voice:   dex
    text:    "Sure."
    shot:    "He shrugs and goes back to the crate. Nobody in the room disagrees with her."

  - id:      M1.4.S99.070
    speaker: REYES
    voice:   reyes
    text:    "Two crush injuries and a hand that won't close for a week."
    note:    "L1-R22. She contracts here -- `won't` -- and this is the baseline the M1.6 and M1.8 tell fire against. Leave it in: .190 and .200 drop the contraction and they only land against this line."

  - id:      M1.4.S99.080
    speaker: MARA
    voice:   mara
    text:    "Cheap."

  - id:      M1.4.S99.090
    speaker: REYES
    voice:   reyes
    text:    "Sit down and take the left arm out of the sleeve."
    shot:    "She pulls a crate over and sits on it, which puts her below him."

  - id:      M1.4.S99.100
    speaker: REYES
    voice:   reyes
    text:    "The cuffs sit high in those blocks. Show me above the bone first."
    shot:    "She knows where to look before she looks. Dex glances up and says nothing."
    note:    "The whole of her history, and not one word of it is spoken. Do not add one."

  - id:      M1.4.S99.110
    speaker: REYES
    voice:   reyes
    text:    "When did the shoulder go?"

  - id:      M1.4.S99.120
    speaker: BRICK
    voice:   brick
    text:    "Krad-9."

  - id:      M1.4.S99.130
    speaker: REYES
    voice:   reyes
    text:    "That's a place."
    note:    "L1-R22. Contracts. A dry correction to a man she is not worried about yet."

  - id:      M1.4.S99.140
    speaker: REYES
    voice:   reyes
    tags:    [pause]
    text:    "Then it's old, it set on its own, and I can't open it tonight."
    note:    "The scene's one permitted triad (18.9 B). L1-R22: contracts. Last contraction she uses in act 1 - .190 and .200 come after the three names and they do not."

  - id:      M1.4.S99.150
    speaker: REYES
    voice:   reyes
    text:    "Three months in a holding block. What was there to do with the time?"

  - id:      M1.4.S99.160
    speaker: BRICK
    voice:   brick
    text:    "Counted."

  - id:      M1.4.S99.170
    speaker: REYES
    voice:   reyes
    text:    "Counted what?"

  - id:      M1.4.S99.180
    speaker: BRICK
    voice:   brick
    text:    "Tam. Oyelaran. Vic."
    shot:    "He does not look up. Reyes stops writing."
    note:    "Second pass on the signature line. This is where S03 lands."

  - id:      M1.4.S99.190
    speaker: REYES
    voice:   reyes
    tags:    [pause]
    text:    "There is nothing in my kit for that."

  - id:      M1.4.S99.200
    speaker: REYES
    voice:   reyes
    text:    "Sleeve down. Come back in the morning and say them again."
    note:    "She prescribes the names. The turn, and she never explains it to anybody."

  - id:      M1.4.S99.210
    speaker: MARA
    voice:   mara
    text:    "Bex goes on the roster."

  - id:      M1.4.S99.220
    speaker: MARA
    voice:   mara
    text:    "It used to be a list we could say out loud."
    note:    "Plant for M1.6. The list outgrows the mouth before it outgrows the room."

  - id:      M1.4.S99.230
    speaker: MARA
    voice:   mara
    text:    "The trench was not on any plan we had."

  - id:      M1.4.S99.240
    speaker: VOSS
    voice:   voss
    text:    "It wasn't ours. It came out of cell three for nothing."
    shot:    "He does not look at Brick while he says it. Brick does not look up."
    variants:
      pragmatist: "It came out of cell three, for nothing, from a man with no reason to give it."
      idealist:   "It was his. He gave it away before anybody offered him anything."
      personal:   "Ask the man who was in the dark with it for three months."
      strategic:  "One building is mapped now. The next one like it, we won't be guessing."

  - id:      M1.4.S99.250
    speaker: DEX
    voice:   dex
    text:    "One more thing and then I'm going to bed."

  - id:      M1.4.S99.260
    speaker: DEX
    voice:   dex
    text:    "There's nine crates on that floor and no paper on any of it."

  - id:      M1.4.S99.270
    speaker: DEX
    voice:   dex
    text:    "Somebody keeps the book now, or in a month we're stealing our own rounds back."
    note:    "P3-a. The job exists as of this line and it arrives inside a complaint."

  - id:      M1.4.S99.280
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Not it."

  - id:      M1.4.S99.290
    speaker: DEX
    voice:   dex
    text:    "It comes with a pencil."
    shot:    "Somebody laughs down the row. Nobody volunteers and nobody is asked. The lamps go down."
