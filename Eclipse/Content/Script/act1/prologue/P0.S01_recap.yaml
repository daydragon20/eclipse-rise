# ---- the three-sentence contract (18.7) ----
want:         "The opening wants the player to understand what was taken from Voss before it asks him to take anything back."
obstacle:     "There are ninety seconds and seven still frames, and no scene in which anything can be dramatised."
turn:         "The last card stops describing a life and states a debt — eleven people, one night, thirteen rounds."

