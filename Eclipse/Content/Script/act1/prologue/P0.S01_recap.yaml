# ---- story-architect notes (L1) — see phase0/beats/BEATS_P0_prologue.md ----
# THIS IS THE RECAP OPENING, not a playable prologue (SPEC-P2-04 decision 1, ACCEPTED).
#
# *** SLOTS ARE NOT CARDS. RULING L1-R47 (02-08), AND IT IS THE FIX FOR A REAL AMBIGUITY. ***
# This file has SEVEN id blocks; phase0/RECAP_CARDS_M1.md has SIX approved cards. The extra
# block is the reserved Enforcer card (Q-2), and it sits at position 3, so every card after it
# is one higher here than in the approved copy. This file used to call them all "card N",
# which meant "card 4" was Petra in one document and Mara in the other. Anybody handed
# "repair card 4" had a coin-flip chance of editing the wrong one.
# THE APPROVED-COPY NUMBERS WIN, because that document is what the owner signed and what the
# cold-reader test scores. What this file has are SLOTS: permanent id blocks, never
# renumbered, never mistaken for a card number again.
#
#   SLOT  ids            what it holds                       approved card
#   ----  -------------  ----------------------------------  -------------
#     1   010 020 030    The city                            card 1
#     2   040 050 060    The Tithe                           card 2
#     3   070 080 090    The Enforcer line - Q-2, EMPTY      none yet (proposal)
#     4   100 110 120    Petra                               card 3
#     5   130 140 150    Mara                                card 4
#     6   160 170 180    The container                       card 5
#     7   190 200 210    Ember Cell                          card 6
#
# Approved copy for slots 1,2,4,5,6,7 lives in phase0/RECAP_CARDS_M1.md. Slot 3 is a
# story-architect PROPOSAL pending owner question Q-2 and repairs the orphaned Enforcer
# thread (finding C-2). If Q-2 is answered yes, the approved copy grows to seven cards and
# slot number and card number line up again - and until then this table is the only place
# the offset is written down.
#
# voice:     open. Owner question Q-1: are the cards narrated at all? Recommendation is
#            yes, in Voss's voice, both genders, ~2,200 credits. If the answer is no,
#            this file stays as the text source and voice-director skips it.
#
# ID BLOCKS - three ids reserved per slot, never renumbered. See the slot table above for
# which approved card each slot holds. Slot 3 stays EMPTY and reserved if Q-2 is refused.
#
# flags-in:  none
# flags-out: Story.Thread.Enforcer_BadgeHeld  (card 3 only - NEW TAG, systems task)
# plants:    T4 groundwork - AEGIS is introduced as an arresting machine, not a predictor.
#            Keep that impression flat and hard. Act 4 inverts it; act 1 must not hedge it.
# *** 18.9 D, THE THREE-CONSECUTIVE-BEATS ROW: THIS SCENE HAS THE EXCEPTION, IN WRITING. ***
# Ruling L1-R51 (02-08) added a row to 18.9 D - "the same rhetorical construction carries
# three consecutive beats" - and THIS FILE IS WHERE IT WAS FOUND. Three lines gloss a proper
# noun with the identical move: .040 "The Tithe of Hands - a labor lottery nobody wins.",
# .190 "Hollow Point - a dead geothermal vault the Dominion forgot.", .200 "Ember Cell:
# eleven people who still say no." Each does two jobs and each survives the Explaining row
# alone; the PATTERN is the tell, and no line-by-line check can see it.
# THE EXCEPTION IS GRANTED AND HERE IS THE ARGUMENT, because the new row requires it to be
# written down rather than assumed. A recap has ninety seconds and seven still frames to hand
# the player four proper nouns he has never heard, and gloss-on-first-use is the form's whole
# job - 18.8's relaxation for exactly this case. Note also that the three are NOT adjacent in
# play: .040 is card 2 and .190/.200 are card 6, four cards apart, and only .190/.200 actually
# run consecutively. TWO IS NOTHING. So the honest reading is that this scene is at the line
# and not over it - and it may not move: nobody adds a fourth gloss in this construction, and
# slot 3's copy (Q-2) must NOT be written in it.
# writer:    second person, past tense - the ONLY place in the game where that is allowed.
#            Max three lines per card. No card names an emotion (18.9 A); the existing
#            line "That was the day keeping your head down stopped working" names a
#            behaviour, and that is the ceiling.

# ---- dialogue-writer notes (L2) — draft 2026-07-31 ----
# WHAT WAS WRITTEN HERE, AND WHAT WAS NOT.
#   The six approved cards are TRANSCRIBED, word for word, from phase0/RECAP_CARDS_M1.md.
#   Not one syllable of that copy was rewritten - it is signed off and it carries an open
#   cold-reader action. What this pass authored is line granularity, stills-as-shot,
#   tags, bands, and the reserved gaps. If a reviewer wants copy changes, that is a
#   RECAP_CARDS_M1.md change and therefore a story-architect + owner decision, not mine.
#   *** ONE EXCEPTION SINCE 02-08, AND IT WENT THE ROUTE THIS PARAGRAPH DESCRIBES. ***
#   .100 (approved card 3, Petra) was amended by story-architect under ruling L1-R46 because
#   its syntax was carried by quotation marks that TTS does not pronounce, and
#   RECAP_CARDS_M1.md was updated in the same pass so there is still exactly one source. The
#   writer was right to refuse this rewrite and right to escalate it. Every other line in
#   this file is still verbatim, and the rule above still stands for everybody.
#
# CARD 3 IS NOT WRITTEN. Block 070-090 is left empty and reserved exactly as the stub
#   instructs. Q-2 is unanswered, the Enforcer badge is a live canon conflict (C-2), and
#   inventing it here would put uncleared canon into the first ninety seconds of the game.
#   The architect's proposed copy already exists in BEATS_P0_prologue.md section 3; it is
#   deliberately NOT copied into this file. See the escalation note at the gap below.
#
# ONE-TO-ONE MAPPING. Each '>' line of an approved card becomes exactly one script line.
#   Cards with two copy lines leave their third id unused (030, 180). That is what the
#   tens scheme is for: card 3's copy can land, or a second Petra line can be added in
#   October, without renumbering a single generated asset.
#
# WHY EVERY LINE CARRIES 'band: ambient'.
#   The scene's type is 'cutscene' (20-60), which is right for the SCENE REGISTER - this
#   is a non-interactive opening - but wrong for the DELIVERY of any line in it. There is
#   no held camera and no performance: the player reads two or three short lines off a
#   static frame. The longest approved line is 12 words, so with 16 lines this scene fails
#   SCRIPT_FORMAT section 4's register check as written, and the only two ways to "fix"
#   that would be to rewrite signed-off copy or to edit a locked header field. Neither is
#   a writer's call. 'band:' is the format's own per-line mechanism for exactly this
#   divergence, and 'ambient' (6-16) is the closest existing band that every approved line
#   sits inside. ESCALATED to story-architect: recap cards may deserve their own type.
#
# NO VOSS VARIANTS, ON PURPOSE. 18.10 asks for variants on every axis the scene branches
#   on; this scene branches on nothing. The recap narrates events that happened identically
#   in every playthrough, and FEclipseRecapCard { FName StillId; FText Lines; } has no
#   variant slot to ship them in. Writing four axes here would quadruple the most
#   expensive-per-word scene in the game to produce four identical readings, against a
#   tier 2 that findings C-6 / Q-7 already show ~15% over budget.
#
# ZERO DIRECT BEATS. Not one line states an emotion. AR-12 spends act 1's single
#   'direct_beat' in M1.8; the prologue spends none of the ~30.
#
# DELIVERY NOTE FOR voice-director (if Q-1 is yes). This is not Voss talking to someone.
#   It is Voss reading his own past in the second person, flat, after the fact - closer to
#   a man listing what happened than to a man remembering it. The two '[quietly]' tags are
#   the whole emotional direction the text needs; the beat sheet forbids '[grieving]' and
#   that ban should survive into generation.

lines:
  # ============ SLOT 1 — THE CITY — approved card 1 ============
  - id:      P0.S01.010
    speaker: VOSS
    voice:   voss
    band:    ambient
    tags:    [quietly]
    text:    "Kessara. Your city, under Dominion curfew."
    shot:    "STILL. Ration line at dusk, sodium orange. An AEGIS eye decal above the queue."
    note:    "Approved copy, card 1. First line of the game. 'quietly' per beat sheet."

  - id:      P0.S01.020
    speaker: VOSS
    voice:   voss
    band:    ambient
    tags:    [quietly]
    text:    "You are Voss. You keep your head down. Everyone does."
    note:    "Cold-reader question 1 lives entirely in this line. 'Everyone does' is the
              card that stops it being a character flaw and makes it a city."

  # 030 reserved, unused. Card 1 is two lines of approved copy.

  # ============ SLOT 2 — THE TITHE — approved card 2 ============
  - id:      P0.S01.040
    speaker: VOSS
    voice:   voss
    band:    ambient
    text:    "The Tithe of Hands — a labor lottery nobody wins."
    shot:    "STILL. The Tithe of Hands lottery board; one name lit; nobody meets anyone's eyes."
    note:    "CORRECTED 02-08 (L1 documentation sweep). This note used to say the Tithe is
              `used correctly and never defined`, and the line it is attached to defines it:
              `a labor lottery nobody wins` is a definition, in six words. WHAT IS ACTUALLY
              TRUE, and it is the thing 18.8 asks for: the Tithe is GLOSSED and never
              EXPLAINED. Nobody says who runs it, how a name is drawn, what happens to the
              drawn, or why anybody complies. Sela supplies the politics in M1.6 and Brick
              supplies the body in HUB.A1.brick_the_tithe - and Brick is on Kessara because
              of it (AR-11), which the player is never told here."

  - id:      P0.S01.050
    speaker: VOSS
    voice:   voss
    band:    ambient
    text:    "Last month it took your neighbor's son."

  - id:      P0.S01.060
    speaker: VOSS
    voice:   voss
    band:    ambient
    text:    "He has not come back."
    note:    "Shortest line of the card and the only one with no information in it. The
              deletion test (18.9 C2) was run on this card and it fails backwards: cut
              this and the Tithe is an institution instead of a person. Kept."

  # ============ SLOT 3 — THE ENFORCER LINE — NO APPROVED CARD, NOT WRITTEN, Q-2 ============
  # IDS 070, 080, 090 ARE RESERVED AND DELIBERATELY EMPTY.
  #
  # This is the Enforcer badge card. It is a story-architect PROPOSAL (BEATS_P0_prologue.md
  # section 3) against open canon conflict C-2 and open owner question Q-2, and it is the
  # sole root of the section 2.11 thread 'The Enforcer' plus the trigger for M1.2.S01's
  # intel beat. 01_game_vision.md section 1.7 and 02_story_bible.md section 2.11 both
  # promise it; the six APPROVED cards do not contain it.
  #
  # The writer was instructed not to invent it, and did not. Nothing here should be read
  # as the copy: the proposal lives in the beat sheet and is not duplicated into this file,
  # because two copies of an unapproved card is how the wrong one gets generated.
  #
  # If Q-2 is YES: card copy lands at 070/080/090, this scene's word count rises by roughly
  #   forty, and Story.Thread.Enforcer_BadgeHeld becomes a systems task (new tag).
  # If Q-2 is NO: this block stays empty forever and story-architect must re-root or retire
  #   the Enforcer thread, because M1.2.S01 currently pays off a plant that does not exist.
  # Either way: DO NOT RENUMBER. That is how a script loses its audio.

  # ============ SLOT 4 — PETRA — approved card 3 ============
  - id:      P0.S01.100
    speaker: VOSS
    voice:   voss
    band:    ambient
    tags:    [quietly]
    text:    "Then AEGIS came for Aunt Petra. The notice said pre-compliance."
    shot:    "STILL. A forced door, an overturned chair, an AEGIS notice on the table."
    note:    "T4 groundwork. AEGIS enters as an arresting machine, flat and hard. No hedge,
              no ambiguity - act 4 pays for this first impression by inverting it.
              *** COPY AMENDED 02-08 BY RULING L1-R46. STORY-ARCHITECT + APPROVED-COPY
              CHANGE, NOT A WRITER'S CALL. *** It read: Then AEGIS came 'pre-compliance' and
              took Aunt Petra, with the euphemism in quotation marks. Quotation marks make no
              sound. Say it as TTS gets it and 'came' takes a complement it cannot take, so
              the punctuation was carrying the entire syntax on a card at credit_tier 2 whose
              only tag is [quietly] and whose delivery note says flat, after the fact - the
              exact delivery in which an unmarked quotation disappears. Same class as L1-R36,
              and worse, because a hyphen at least has a default reading. The intent is
              unchanged and it is the intent that was approved: AEGIS used that euphemism and
              Petra was taken. What changed is that the euphemism is now attributed to a
              DOCUMENT instead of to punctuation, which needs no performance to survive, ties
              the line to the notice already in the shot, and is more bureaucratic rather than
              less (02_story_bible 2.2). Cold-reader question 3 rests on this card and it is
              answered harder than before. phase0/RECAP_CARDS_M1.md card 3 updated in the same
              pass; do not re-transcribe the old wording from a stale copy."

  - id:      P0.S01.110
    speaker: VOSS
    voice:   voss
    band:    ambient
    tags:    [quietly]
    text:    "No charge. No date. No office that answers."
    note:    "The scene's only rhetorical triple (18.9 B allows one). Voss's technician
              vocabulary is doing the work: he grieves by naming a broken mechanism."

  - id:      P0.S01.120
    speaker: VOSS
    voice:   voss
    band:    ambient
    text:    "That was the day keeping your head down stopped working."
    note:    "The ceiling line for 18.9 A in this whole scene. It names a BEHAVIOUR, never
              a feeling, and no other line in the prologue may go further than this one."

  # ============ SLOT 5 — MARA — approved card 4 ============
  - id:      P0.S01.130
    speaker: VOSS
    voice:   voss
    band:    ambient
    text:    "A stranger found you before the sweeps did. Mara."
    shot:    "STILL. A gloved hand pushes a folded route card across a table. Face out of frame."
    note:    "Face out of frame is load-bearing: Mara is a hand and a route before she is a
              person, and the player meets her face for the first time in M1.1."

  - id:      P0.S01.140
    speaker: VOSS
    voice:   voss
    band:    ambient
    text:    "She slipped you a route out of the cordon."
    note:    "The debt the whole act carries. Paid back inverted in M1.8.S08."

  - id:      P0.S01.150
    speaker: VOSS
    voice:   voss
    band:    ambient
    text:    "You took it."
    note:    "Three words, the shortest line in the scene, and the only thing Voss does in
              ninety seconds. He claims no credit for it (18.4, Voss fixed trait): she
              found him, she slipped it, he took it."

  # ============ SLOT 6 — THE CONTAINER — approved card 5 ============
  - id:      P0.S01.160
    speaker: VOSS
    voice:   voss
    band:    ambient
    text:    "Out of the city, folded into a cargo container."
    shot:    "STILL. Interior of a cargo container. Light through the seams. Two eyes in the dark."

  - id:      P0.S01.170
    speaker: VOSS
    voice:   voss
    band:    ambient
    text:    "Breathing quietly through every checkpoint."
    note:    "The card that earns section 8 of the beat sheet: the player arrives at Hollow
              Point having hidden, not fought. Nothing here suggests he begins anything."

  # 180 reserved, unused. Card 6 is two lines of approved copy.

  # ============ SLOT 7 — EMBER CELL — approved card 6 ============
  - id:      P0.S01.190
    speaker: VOSS
    voice:   voss
    band:    ambient
    text:    "Hollow Point — a dead geothermal vault the Dominion forgot."
    shot:    "STILL. The geothermal vault at Hollow Point. Eleven silhouettes around the glow of a pipe."
    note:    "Cold-reader question 2. 'Forgot' is the smallest possible version of the T4
              plant - the Dominion under-reacts from the first card onward and nobody in
              act 1 ever finds that strange."

  - id:      P0.S01.200
    speaker: VOSS
    voice:   voss
    band:    ambient
    text:    "Ember Cell: eleven people who still say no."
    note:    "AR-1: the eleven are Mara, Dex, Reyes and eight unnamed. Voss is the twelfth
              and is NOT counted here - he has not joined anything yet."

  - id:      P0.S01.210
    speaker: VOSS
    voice:   voss
    band:    ambient
    text:    "Tonight, Mara says, the first real strike. Thirteen bullets to our name."
    shot:    "Hold on the pipe glow. Cut to the M1.1 briefing surface."
    note:    "Longest line in the scene (12) against the shortest (3) - spread is 4x. It is
              the only line in the present tense and the only one where the pronoun turns
              plural: 'our'. That word is Mara's, quoted, and it is the handoff into
              M1.1.S03's ammo count. Last line of the prologue; nothing follows it."
