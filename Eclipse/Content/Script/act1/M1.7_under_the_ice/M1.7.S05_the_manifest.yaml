# cast:      VOSS, MARA, BRICK
# flags-in:  none
# flags-out: Story.Intel.K77Manifest ✚ · Story.Char.PetraLocated ✚  (NEW TAGS)
# beats:     1) the manifest - a transfer list to Blacksite K-77
#            2) names. Many names
#            3) PETRA
#            4) Voss says nothing, or says her name. Both work - make it a variant
#            5) BRICK READS ALONG AND NAMES NOBODY. The only time in the act he sees a
