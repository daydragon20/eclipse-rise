lines:
  - id:      M1.7.S03.010
    speaker: VOSS
    voice:   voss
    text:    "It's a log, eight months of it, and it's sorted by sector."
    shot:    "Four screens on a plywood desk in what used to be a valve gallery. Somebody's tea has gone cold beside the keyboard. Two coats on a hook."
    note:    "One sentence, three finite verbs, and it names what the thing is FOR. That is the Voss rule for this scene and it starts on line one."

  - id:        M1.7.S03.020
    speaker:   DEX
    voice:     dex
    condition: 'story.m17_dex_along == true'
    text:      "Off. My chair."

  - id:        M1.7.S03.030
    speaker:   DEX
    voice:     dex
    condition: 'story.m17_dex_along == false'
    text:      "Top right. There's always a sector index and it's always top right."

  - id:      M1.7.S03.040
    speaker: VOSS
    voice:   voss
    text:    "The relay mast is in here. Nineteenth of last month, twenty-one forty."
    note:    "Was \"Relay mast. Nineteenth of last month, twenty-one forty.\" - three bare-noun fragments, which is Dex's grammar in Voss's mouth. The clause goes back on the front and the timestamp stays a field value, because that is what a man reading a field aloud sounds like."

  - id:      M1.7.S03.050
    speaker: VOSS
    voice:   voss
    text:    "The Foundry Row armoury is in it. The pump gallery. The tithe line. The yard."
    note:    "Four items, not three - 18.9 B's triad check. All four are canon act-1 locations. The first arrives as a sentence and the rest arrive faster than he can build sentences for them, which is how a list comes off a screen."

  - id:      M1.7.S03.060
    speaker: DEX
    voice:   dex
    text:    "Not an alert log. That's a case file."
    note:    "18.4 Dex: the technical noun does the work and no feeling is stated anywhere near it. Opens verbless now - it was \"That's not an alert log\", which is Voss's shape. He is not reading; he is naming what he has just heard, so it plays on the stair."

  - id:      M1.7.S03.070
    speaker: VOSS
    voice:   voss
    text:    "The overpass isn't in it. Block Twelve isn't in it."

  - id:      M1.7.S03.080
    speaker: VOSS
    voice:   voss
    text:    "It starts at the mast."

  - id:      M1.7.S03.090
    speaker: MARA
    voice:   mara
    text:    "Then they saw the mast and not the two we did before it."
    note:    "The two are the overpass and Block Twelve, named by Voss one line earlier. \"we did\" is the fingerprint and it is also the knife: she is the one who puts Ember's hand on the two that were missed."

  - id:      M1.7.S03.100
    speaker: VOSS
    voice:   voss
    text:    "There are fourteen entries. Five of them are us."
    shot:    "Nobody answers him. The cursor goes on down the list by itself."
    note:    "*** ACT 1'S ENGINE ON A SCREEN. *** Every victory made them more visible, in the player's own chronology, with timestamps. The reaction is the shot. Nobody says one word about how it feels (18.9 A)."

  - id:      M1.7.S03.110
    speaker: MARA
    voice:   mara
    text:    "We take the sub-file. All of it, not the summary."
    note:    "Was a bare imperative (\"Copy the sub-file\"). Bare pronoun-elided imperatives are Petra's fingerprint and Petra debuts later in this same act; Mara's fingerprint is the first person plural. Same instruction, and now only one of the two women can say it."

  - id:      M1.7.S03.120
    speaker: VOSS
    voice:   voss
    text:    "There's a query chain sitting under ours. The authorisation isn't the same, and it's older than the whole file."
    note:    "P2-b setup. He reads BOTH fields - chain and date - because the man at the desk is the only person who can, in either branch. This used to be seven words and Dex supplied the fields he could not see."

  - id:      M1.7.S03.130
    speaker: DEX
    voice:   dex
    text:    "That's not theirs, then. Somebody else's chain, bolted under a Veil file."
    note:    "P2-b, and it is the one line the stub gives him: he says what it is NOT. \"then\" is doing the branch work - he is answering .120, not reading a screen, so it plays identically on the stair. \"bolted\" is the hardware verb 18.4 hands him. He does not say who, and nobody asks."

  - id:      M1.7.S03.140
    speaker: VOSS
    voice:   voss
    text:    "Nothing was ever filed after it."
    note:    "Sets Story.Clue.OutsideQuery. Moved off Dex 01-08: it is an absence you can only see in a file tree, and half the players have him a hundred metres away on a stair. NO THEORY FOLLOWS. Nobody guesses, nobody frowns, nobody says the word hunter."

  - id:      M1.7.S03.150
    speaker: MARA
    voice:   mara
    text:    "We take that too."

  - id:      M1.7.S03.160
    speaker: VOSS
    voice:   voss
    text:    "There's a requisition on the same sector. Interdiction package. Four standing teams and a permanent--"
    note:    "P4-c OPENS. Bureaucratic listing, not rhetoric - no 'and the whole hammer', no triad, no flourish. He does not get to finish it. The clause on the front is the Voss rule; the fragments after it are him reading faster than he is speaking."

  - id:         M1.7.S03.170
    speaker:    DEX
    voice:      dex
    interrupts: true
    text:       "Right. So that's what's coming. When does it start?"
    note:       "The expert assumes, fast, over the top of the man still reading. He is about to be wrong, and that is what stops this beat from ever being quotable."

  - id:      M1.7.S03.180
    speaker: VOSS
    voice:   voss
    text:    "It doesn't. There's a stamp across it."

  - id:      M1.7.S03.190
    speaker: DEX
    voice:   dex
    text:    "Across it how? Read me the stamp."

  - id:      M1.7.S03.200
    speaker: VOSS
    voice:   voss
    text:    "It says Allocation. There's no command signature on it."
    note:    "Was \"Allocation. Not a command signature.\" - punchier, and belonging to the wrong man. He reports the field and then reports the field that is missing, which is duller and is his."

  - id:      M1.7.S03.210
    speaker: DEX
    voice:   dex
    text:    "Not his chain, then. An allocation stamp means it stopped with whoever sets the sector's team numbers for the quarter."
    note:    "*** THE LINE TWIST 4 RESTS ON, REWRITTEN FLAT 01-08 (L1-R17). *** The old text was a cleft antithesis that turned on its last three words. This one carries the same fact and has nothing on the end to cut: delete the final sentence and only a shrug is left, which is the deletion test running backwards and is the whole difference. Ends on a fiscal period. Sets Story.Clue.AegisDenial."

  - id:      M1.7.S03.220
    speaker: DEX
    voice:   dex
    text:    "Told no. I didn't know they got told no."
    note:    "The stub's budget joke, kept limp on purpose (L1-R17). It is a deflated realisation, not a witticism, and 18.4 Dex deflects the beat rather than sitting in it. The run-up came off the front so it opens verbless like the rest of him."

  - id:      M1.7.S03.230
    speaker: MARA
    voice:   mara
    text:    "Then he asked for more and didn't get it."
    note:    "The act-1 explanation, and it is eight boring words that restate the document. She adds nothing. Act 4 takes it apart."

  - id:      M1.7.S03.240
    speaker: MARA
    voice:   mara
    text:    "That's room."
    shot:    "She is already looking at the next screen. Nobody agrees with her and nobody argues."
    note:    "She sees room in it. Two words, no follow-up, and the next line is about an unrelated document. Nobody in this room looks at any of it twice."

  - id:        M1.7.S03.245
    speaker:   VOSS
    voice:     voss
    condition: 'run.m17_record == true'
    text:      "There's a personnel record in here out of the Arbiter's household. The name's lacquered out and so's the post."
    note:      "P2-d, half one. NEW 01-08. The read moved to the man who is always at the desk, because L1-R37 withdrew the M1.2 copy and this is now the only place in act 1 the record exists - so it cannot sit behind the Dex branch as well as behind the optional objective. Same flag as .250, and the format allows only one comparison per condition, which is why it is two lines and not one conditioned twin."

  - id:        M1.7.S03.250
    speaker:   DEX
    voice:     dex
    condition: 'run.m17_record == true'
    text:      "Household staff, then. No idea. Take it anyway."
    note:      "P2-d, half two, and it is the stub's line: he does not understand it and he does not stop. Nothing here requires eyes on a screen and nothing requires hands on the desk - \"Take it anyway\" is said TO Voss, which is why it plays on the stair. No reaction from anybody, no second beat. SYSTEMS: if the optional record objective is cut, delete this line and .245 together."

  - id:      M1.7.S03.260
    speaker: MARA
    voice:   mara
    text:    "We have the log. Everybody off that desk."
    shot:    "Nobody moves off the desk. On the fourth screen a channel indicator has been lit the whole scene."
