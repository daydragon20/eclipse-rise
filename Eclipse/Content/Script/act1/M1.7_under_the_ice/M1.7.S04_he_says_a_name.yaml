lines:
  - id:      M1.7.S04.010
    speaker: VOSS
    voice:   voss
    text:    "The channel's live."
    shot:    "A handset off its cradle on the fourth screen. The indicator has been lit since they walked in and nobody looked at it."

  - id:      M1.7.S04.020
    speaker: VEIL_A
    voice:   veil_operative_a
    text:    "Sector file, subject four. No movement since the yard."
    note:    "18.5 rule 5. Two seconds of Veil vocabulary: a human being is a subject and a number, and the tone is a man reading a stock level."

  - id:      M1.7.S04.030
    speaker: THREX
    voice:   threx
    text:    "There's a name in that file. Use the name."

  - id:      M1.7.S04.040
    speaker: VEIL_A
    voice:   veil_operative_a
    text:    "Designation is preferred on an open chann--"

  - id:         M1.7.S04.050
    speaker:    THREX
    voice:      threx
    interrupts: true
    text:       "{name}."
    shot:       "*** He says it the way the Foundry District says it, stress on the front, and he is right. *** VO note: this is the correct local pronunciation and it is the point of the scene. Mara has stopped with a hand flat on the desk."
    note:       "AR-6 RUNG 3 LANDS HERE. He overrides his own service's radio procedure to say a first name out loud. 18.4: never uses rank when a first name will wound more."

  - id:      M1.7.S04.060
    speaker: THREX
    voice:   threx
    text:    "{name} gives half a ration away on the ninth. Every ninth, for a year now. That is not a thing a frightened person does."
    note:    "Sincere, accurate, and unbearable. Pronoun-free (L1-R8). The ninth is the Tithe date established in M1.6.S03.170 and nobody glosses it (18.8)."

  - id:      M1.7.S04.070
    speaker: THREX
    voice:   threx
    text:    "Who is feeding {name} now? Somebody in that cell must be, and I would like to know which one."
    note:    "Question-heavy, warm, and it is a targeting query wearing concern. Pronoun-free."

  - id:      M1.7.S04.080
    speaker: VEIL_A
    voice:   veil_operative_a
    text:    "Do you want a pickup order against the file?"

  - id:      M1.7.S04.090
    speaker: THREX
    voice:   threx
    text:    "No. Nobody is going to knock on a door at four in the morning and make a martyr out of somebody who shares a ration."
    note:    "He declines, and the reason is kindness. 18.4 Threx entire. No threat anywhere in the scene - that is what makes it work."

  - id:      M1.7.S04.100
    speaker: THREX
    voice:   threx
    text:    "And keep the coat on. That hall was never meant to have people standing in it."
    shot:    "Two coats on the hook by the desk. Neither of them has been touched."
    note:    "He says something kind to a man who is standing where Ember is standing. Nobody in the scene points at it."

  - id:      M1.7.S04.110
    speaker: MARA
    voice:   mara
    tags:    [quietly]
    text:    "How long has that man been saying that name?"
    shot:    "She has not moved since .050. Nobody answers her, and nobody ever does."
    note:    "*** THE ONLY TIME MARA SOUNDS FRIGHTENED IN THE GAME. *** One line. The tell is that she ASKS - in M1.2.S03 an anomaly got arithmetic, not a question. No feeling is named and no adjective is spent."

  - id:      M1.7.S04.120
    speaker: VOSS
    voice:   voss
    text:    "That channel's open, so the watch hasn't turned over yet."

  - id:      M1.7.S04.130
    speaker: VOSS
    voice:   voss
    text:    "Everything on that desk comes with us. We're not coming back down here."
    shot:    "Mara is already at the stair mouth. She stops there and does not come back."
    note:    "Beat 6, and it is not what she wants. First time in the game he overrules her, and it is about staying longer in the worst room on Kessara."
