  - id:      M1.8.S91.020
    speaker: DEX
    voice:   dex
    text:    "Eleven files on it. Dated. Every one of them addressed to the same four words."
    note:    "L1-R14: the blessed use. Eleven recordings for eleven people, and nobody in the scene says the second half of that."

  - id:      M1.8.S91.030
    speaker: VOSS
    voice:   voss
    text:    "Which words?"

  - id:      M1.8.S91.040
    speaker: DEX
    voice:   dex
    text:    "The next of us."

  - id:      M1.8.S91.050
    speaker: DEX
    voice:   dex
    text:    "Board holds nine hundred hours. She used about forty minutes of it, which for her is practically a--"
    shot:    "He stops on his own. Nobody interrupted him and nobody was going to."
    note:    "*** THE JOKE HE DOES NOT LAND. *** 18.6 allows zero comic beats in aftermath, so this is the absence of one, written. Second time in the act he leaves an opening unused - the first was M1.3.S06, and the player now knows what it means."

