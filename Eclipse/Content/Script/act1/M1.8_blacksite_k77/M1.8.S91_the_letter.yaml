    speaker: VOSS
    voice:   voss
    text:    "Play the first one."

  - id:      M1.8.S91.070
    speaker: DEX
    voice:   dex
    text:    "It isn't for you."

  - id:      M1.8.S91.080
    speaker: VOSS
    voice:   voss
    text:    "Play it."

  - id:      M1.8.S91.090
    speaker: MARA
    voice:   mara
    text:    "Elin. If this is playing, the water rota is the first thing that falls over, not the guns."
    shot:    "RECORDING. Compressed, close, a chair creaking somewhere behind her. Play it through the console speaker, not as clean VO. Voss does not sit down."
    note:    "*** THE FIRST LETTER, AND IT IS ADDRESSED TO REYES. *** No pathos, no farewell, no legacy - a housekeeping note about which system fails first. That is why it lands."

  - id:      M1.8.S91.100
    speaker: MARA
    voice:   mara
    text:    "We keep the rota on paper and we keep it where everybody can see it. That's all this one is about."
    note:    "Two 'we's and no 'you' anywhere in the recording. AR-5 holds posthumously: she spent the word once, in S08, and never got to spend it again. Every later Mara recording in acts 2-4 inherits this rule."

  - id:      M1.8.S91.110
    speaker: MARA
    voice:   mara
    text:    "There'll be a longer one when there's time."

  - id:      M1.8.S91.120
    speaker: DEX
    voice:   dex
    text:    "Dated the spring before last. Before the overpass."
    note:    "*** IT PREDATES THE PLAYER. *** M1.1 is the overpass. The cell planned for its own continuation before Voss existed to it, and it would have carried on without him. Eight flat words, read off a timestamp, and nobody says another thing about it."

  - id:      M1.8.S91.130
    speaker: VOSS
    voice:   voss
    text:    "Leave it running."

