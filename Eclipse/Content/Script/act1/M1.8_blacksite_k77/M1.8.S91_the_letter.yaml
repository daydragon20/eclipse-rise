# *** CANON PLANT. 02_story_bible 2.5: Mara's recorded "letters to the next of us" appear
# through Act 4. WITHOUT THIS SCENE THOSE LETTERS ARRIVE FROM NOWHERE IN ACT 2. ***
#
# beats:     1) the console. Dex alone, then Voss
#            2) the list of recordings. ELEVEN - as many as the cell used to be
#            3) Dex's joke, and he does not land it
#            4) THE FIRST RECORDING PLAYS - ADDRESSED TO SOMEBODY OTHER THAN VOSS
