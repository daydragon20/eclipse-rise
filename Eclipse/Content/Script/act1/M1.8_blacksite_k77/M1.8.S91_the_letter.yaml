# ---- dialogue-writer notes (L2) ----
# band:      cutscene (20-60). Ceiling respected (longest 21 w at .100).
#            Register reached at .100. Spread 2 w (.030 / .080) to 21 w = 10.5x.
# ELEVEN:    L1-R14. This is the one blessed use in the mission and the only "eleven" in the
#            whole file set. Eleven recordings, eleven people in the cell, and no character
#            says the second half of that sentence.
#
# *** THE RECORDING - THREE DESIGN DECISIONS, ALL OF THEM PAYING SOMETHING. ***
# 1. IT IS ADDRESSED TO REYES. The stub only requires "somebody other than Voss"; using
#    Elin costs no canon (02_story_bible / 18.4 give the name) and buys the most, because
#    Reyes is the one person in the cell whose job is keeping people alive in a building.
# 2. IT IS ABOUT THE WATER ROTA. No pathos, no farewell, no legacy - a housekeeping note
#    about which system fails first. That is 18.4 Mara exactly, and it is the reason the
#    scene is unbearable rather than sentimental.
# 3. IT PREDATES THE PLAYER. .120 dates it "before the overpass" - M1.1, the night Voss
#    joined. The cell existed without him, planned for its own continuation without him, and
#    would have carried on without him. That is the anti-chosen-one beat of the whole act
#    and it costs eight flat words from an engineer reading a timestamp.
# PRONOUN AUDIT: the recording contains no "you" and no "your". She says "we" twice. AR-5
# holds even posthumously: the word was spent once, in S08, and she never got to spend it
# again. All her later recordings in acts 2-4 must obey this - flagged for those writers.
#
# dex:       .010 is his want stated as a task, .020-.040 is the list, and .050 IS THE JOKE
#            HE DOES NOT LAND. He starts a hardware comparison and abandons it inside the
#            sentence. 18.6 forbids comic beats in aftermath - so this is the absence of one,
#            written out loud, and it is the second time in the act he leaves an opening
#            unused (M1.3.S06 was the first). The player knows what that means now.
#            .070 is four words and he says it to protect Voss from what is coming, and it
#            does not work.
# voss:      four short lines and a conditional. He asks twice, he does not argue, and his
#            only instruction is to leave it running. No axis variants: there is no judgement
#            here, only a man deciding not to switch something off.
# condition: .140/.150 read story.thread_mara_letters_open, set by HUB.A1.mara_letters, where
#            the player watched her record one. For that player Voss already knows what the
#            files are and says so - quietly, three lines after Dex explained them to him -
#            and Dex's three-word fragment is the whole reaction. AR-9 holds: the scene is
#            complete without the hub, and the hub makes it worse. That is what condition: is
#            for and it is why the plant survived the hub-layer budget cut (L1-R11).
# omitted:   a line addressed to Voss, a message from Mara to Voss, any acknowledgement that
#            she is dead, and any statement of what the recordings mean. Nobody says her name
#            in this scene either. See report.

