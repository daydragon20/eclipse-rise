# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.8.md ----
# cast:      VOSS, MARA, BRICK, REYES, fighters, prisoners; Veil (barks)
# flags-in:  none
# flags-out: none
# beats:     1) the fight, in short callouts
#            2) prisoners who cannot run. Reyes under pressure - HER CONTRACTIONS
#               DISAPPEAR (18.4). Clearest fingerprint moment in the act. NOBODY REMARKS ON IT
#            3) Brick carries
#            4) THE FIRST NAME ON THE WALL: one of the eight dies, same name Threx spoke in
#               M1.7.S04 (AR-10). THIS death is authored and guaranteed
#            5) onward
#
# DESIGN CONSTRAINT: NO LINE ANYWHERE IN THIS MISSION MAY ASSUME A CASUALTY COUNT.
#
# writer:    callout band throughout except Reyes, who is doing medicine and therefore
#            speaks in complete sentences even here. That contrast IS the scene.

# ---- dialogue-writer notes (L2) ----
# band:      scene type is in-mission-radio (10-25); twenty-one of the twenty-five lines
#            carry `band: callout` (L1-R1 override, ceiling 6, all checked).
#            .045 / .105 / .195 use the insertion slots the tens scheme exists for
#            (SCRIPT_FORMAT section 2) and are monotonic; nothing was renumbered.
#            The four that do not are Reyes's, and that is the scene: everything in this
#            corridor is three words long except the doctor, who is incapable of shortening
#            a sentence and gets slower and more grammatical as it gets worse.
#            Register reached at .070 (19 w), .110 (22 w), .180 (22 w), .220 (20 w) - all
#            non-overridden. Spread 1 w (.040 / .170 / .210) to 22 w = 22x.
# reyes:     ZERO contractions in all four of her lines, against "can't", "won't", "Where's",
#            "Got her" everywhere around her. 18.4: training reasserts under stress. NOBODY
#            REMARKS ON IT and no shot points at it. This is the clearest fingerprint moment
#            in the act and it is invisible if you are not listening, which is correct.
#            .180 is deliberately a three-stage instruction in the middle of a firefight.
#
# *** THE AUTHORED DEATH, AND THE ONE DECISION IN IT. ***
# {name} does not speak. Not one line, not a last word, not an acknowledgement.
# Two reasons and the second is the load-bearing one:
#   1. the roster name is procedural (L1-R8) while the voice pool is fixed, so a spoken line
#      would risk a voice that does not match the name the player is hearing;
#   2. the beat is that OTHER PEOPLE say the name. .130 puts them on the bar, .140/.150 are
#      Voss ordering them off twice and being ignored, .200 is somebody asking where they
#      are, and .210 is Brick answering with a noun. The player is never told what happened.
#      They are told where.
# All four {name} lines are pronoun-free as L1-R8 requires - checked, including "Where's
# {name}?" which uses no gendered word at all.
# brick:     .210 is the whole character in one syllable. He answers a difficult question by
#            naming a dead soldier; tonight the question is where somebody is, and the answer
#            is a piece of architecture. 18.4 "he hands you a noun" - never more so.
# crowd:     .160 is the turn and it comes from a PRISONER, not from Ember. The crowd moves
#            because it saw somebody hold a door, and the person who says so is one of the
#            people being saved. No principal is allowed to narrate that.
# veil:      three lines, calm, no volume, no reinforcement calls (the M1.7 rule holds and
#            pays here). They MARK and they HOLD A LIP. They do not pursue. Nobody in Ember
#            notices; the player has now watched the Veil decline to chase twice in two acts.
# counting:  .220 is the casualty-count constraint turned into character - Reyes REFUSES to
#            count in the corridor, out loud, as a medical decision. No line in this mission
#            states a number of dead, and this is the line that makes that a choice instead
#            of an omission. It also holds her 18.4 never: she does not guess out loud.
# eleven:    L1-R14 checked. Not used.

