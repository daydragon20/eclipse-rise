    speaker: VOSS
    voice:   voss
    band:    callout
    text:    "Both ends closing."
    shot:    "A white corridor sixty metres long with people in it who have not walked that far in months."

  - id:      M1.8.S07.020
    speaker: VEIL_A
    voice:   veil_operative_a
    band:    callout
    text:    "Hold the north lip."

  - id:      M1.8.S07.030
    speaker: VEIL_B
    voice:   veil_operative_b
    band:    callout
    text:    "Counting through."

  - id:      M1.8.S07.040
    speaker: BRICK
    voice:   brick
    band:    callout
    text:    "Here."

  - id:      M1.8.S07.045
    speaker: MARA
    voice:   mara
    band:    callout
    text:    "Two lines. Hands on shoulders."
    note:    "The last ordinary order she gives in the game, and it is a place and a group, which is her shape. Nothing marks it."

  - id:      M1.8.S07.050
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    band:    callout
    text:    "{name}, hinge side!"

  - id:      M1.8.S07.060
    speaker: PRISONER_B
    voice:   civilian_kessara_b
    band:    callout
    text:    "I can't--"

  - id:      M1.8.S07.070
    speaker: REYES
    voice:   reyes
    text:    "She cannot run and she is not going to be able to. Somebody take the other side of her."
    note:    "First of four. Zero contractions, complete sentences, and she is the slowest speaker in a corridor where everybody else has three words."

  - id:      M1.8.S07.080
    speaker: BRICK
    voice:   brick
    band:    callout
    text:    "Got her."

  - id:      M1.8.S07.090
    speaker: VOSS
    voice:   voss
    band:    callout
    text:    "Middle of the hall!"

  - id:      M1.8.S07.100
    speaker: VEIL_A
    voice:   veil_operative_a
    band:    callout
    text:    "Mark and hold the lip."
    note:    "The Veil contains and does not pursue. Same doctrine, same vocabulary as M1.5.S05.030. No reinforcement call anywhere in this scene."

  - id:      M1.8.S07.105
    speaker: PRISONER_A
    voice:   civilian_kessara_a
    band:    callout
    text:    "Which way is up?"
    note:    "Four words from a man who has lost the concept. Nobody answers him and the line is never referred to again."

  - id:      M1.8.S07.110
    speaker: REYES
    voice:   reyes
    text:    "There are people at the back who have not eaten in two days. They will fall and they will not get up."

  - id:      M1.8.S07.120
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    band:    callout
    text:    "Door won't hold!"

  - id:      M1.8.S07.130
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    band:    callout
    text:    "{name} has the bar."
    shot:    "Seen once, at distance, through moving bodies. The camera does not go closer and does not come back."
    note:    "*** THE AUTHORED DEATH BEGINS. AR-10. *** {name} never speaks in this scene. Other people say the name; the player is never shown the moment."

  - id:      M1.8.S07.140
    speaker: VOSS
    voice:   voss
    band:    callout
    text:    "Off the bar!"

  - id:      M1.8.S07.150
    speaker: VOSS
    voice:   voss
    band:    callout
    text:    "Get off it!"

  - id:      M1.8.S07.160
    speaker: PRISONER_A
    voice:   civilian_kessara_a
    band:    callout
    text:    "Go. Go, go."
    shot:    "The crowd had stopped. It starts again from the middle, where people can see the door, and it is a prisoner who starts it."
    note:    "*** THE TURN, AND IT BELONGS TO ONE OF THE PEOPLE BEING RESCUED. *** No principal narrates why the crowd moved."

  - id:      M1.8.S07.170
    speaker: BRICK
    voice:   brick
    band:    callout
    text:    "Walk."

  - id:      M1.8.S07.180
    speaker: REYES
    voice:   reyes
    text:    "Take his weight on the right. We are going to do this in three stages and the first one is standing up."

  - id:      M1.8.S07.190
    speaker: MARA
    voice:   mara
    band:    callout
    text:    "Last door. Everyone through."

  - id:      M1.8.S07.195
    speaker: VEIL_B
    voice:   veil_operative_b
    band:    callout
    text:    "Log the hour. Both ends."
    shot:    "Nobody follows Ember through the last door. The corridor behind them is being written up."
    note:    "Same doctrine and nearly the same words as M1.5.S05.230. The Veil closes a night as paperwork, twice in two acts, and Ember never notices either time. P4 texture, delivered as procedure."

  - id:      M1.8.S07.200
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    band:    callout
    text:    "Where's {name}?"

  - id:      M1.8.S07.210
    speaker: BRICK
    voice:   brick
    band:    callout
    text:    "Door."
    note:    "One syllable, and it is how the player finds out. He answers a question about a person with a piece of architecture, which is the same move as naming a dead soldier and it is the only answer he has."

  - id:      M1.8.S07.220
    speaker: REYES
    voice:   reyes
    text:    "The last of them is through. I am not going to count anybody in this corridor until we are up."
    note:    "The no-casualty-number constraint, written as a medical decision made out loud. She does not guess and she does not count where the counting would be wrong (18.4). No line in this mission states a number of dead."
