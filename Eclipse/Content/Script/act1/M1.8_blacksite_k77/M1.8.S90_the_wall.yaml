lines:
  - id:      M1.8.S90.010
    speaker: REYES
    voice:   reyes
    text:    "There is a bunk plate missing off the third frame and nobody is going to say anything about that either."
    shot:    "Bunk Row at some hour that is not a time. A welder going in short bursts, throwing the whole vault white and then dark. Voss is standing four metres back with a cup he has not drunk. Reyes says this to him, not to Brick."
    note:    "The memorial costs a bed, and the only person who notices says so and covers it in the same sentence. 05_base_building 5.3 - grief is never a purchase - given a price nobody itemises."

  - id:      M1.8.S90.020
    speaker: BRICK
    voice:   brick
    text:    "{name}."
    shot:    "He has scratched it into the plate with a punch before welding, so the letters are wrong and deep. He says it once, checking it against nothing."
    note:    "AR-10. The first name on the wall, and it is the name Threx spoke in M1.7.S04 and again in M1.8.S05.060. Pronoun-free per L1-R8. He does not speak first in the scene (18.4)."

  - id:      M1.8.S90.030
    speaker: REYES
    voice:   reyes
    text:    "Is that the whole name?"
    note:    "Her tic - a question where anybody else would offer condolence. Deliberately pronoun-free so the roster decides gender at runtime."

  - id:      M1.8.S90.040
    speaker: BRICK
    voice:   brick
    text:    "No."

  - id:          M1.8.S90.050
    speaker:     BRICK
    voice:       brick
    direct_beat: true
    text:        "I'm scared of forgetting."
    shot:        "He does not stop working while he says it. Nobody answers him. Voss does not move."
    note:        "*** AR-12 - THE ACT'S ONE RATIONED direct_beat. *** Justification: the man whose entire tic is answering hard questions by naming a dead soldier has the name in front of him already, so the deflection is spent - and the feeling he names is the reason the Memorial Hall exists (02_story_bible 2.5). Four words, in the quietest scene in the act, from the character who has never stated one. Nobody responds to it."

  - id:      M1.8.S90.060
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "There's more bunk plate in the workshop."
    shot:    "Two people have come down the row and stopped. One of them is carrying a plate already. Nobody asked anybody for anything."

  - id:      M1.8.S90.070
    speaker: BRICK
    voice:   brick
    text:    "Plates."
    shot:    "By the time the shift horns go there are four plates on the wall and no ceremony has happened. One of them has three letters on it. The camera does not go close enough to read any of them."
    note:    "One noun, and it founds a facility. He is not asking for plates; he is telling the room what this wall is now. Story.Thread.WallOpen commits here."
