#
# THIRD TAP OF THE P4-d CHAIN (M1.2.S03 -> M1.7.S06 -> HERE -> M1.8.S09 final), and the last
# reminder before act 4 pays it. RENUMBERED 01-08: this block used to say "the third variant"
# of her M1.2.S03 explanation, which counts a different set from the one the M1.7 writer was
# counting. Two chains with two numbering schemes is how L1-R17 got its own count wrong.
