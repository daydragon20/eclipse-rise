#     wave-offs are four of them: M1.2.S03.150, M1.6.S05.410, M1.7.S06.160, and .130 here.
# Cite the chain by name or do not cite a number.
#
# *** P4-d MUST BE FLAT, NOT QUOTABLE - RULING L1-R17 / L1-R21. ***
# Mara's line here is the WEAKEST of the chain by design - she is repeating herself under
# pressure. A polished epigram is the opposite of a woman running out of explanations.
# Flat. Tired. Slightly too fast. Nothing you would put on a poster.
# NOTE FOR THE WRITER: the L2 block below says "the two shipped explanations". There are
# THREE (L1-R21) and the third, M1.6.S05.410, is being flattened. The reasoning in that block
