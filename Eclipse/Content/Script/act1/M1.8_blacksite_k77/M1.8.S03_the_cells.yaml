#            TWO: PRISONER_A (the questions) and PRISONER_B (Thursday). Splitting a third out
#            later is two field edits and no rewrite. Same call the M1.6 writer made; noted
#            again in the report so it stays visible.
# reyes:     zero contractions throughout, and .080 is the scene's register line. She gives a
#            hydration-style order with a clause attached - the same shape as S02.060 - which
#            is the deliberate contrast against Petra's bare verbs one scene from now.
# brick:     one word, and it is the worst detail in the building.
# mara:      .160 keeps Voss out of a door for the second time in fifteen minutes. Two words.
