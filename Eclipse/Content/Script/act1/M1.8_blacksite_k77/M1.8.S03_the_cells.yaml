lines:
  - id:      M1.8.S03.010
    speaker: VOSS
    voice:   voss
    text:    "It's an office."
    shot:    "Bright, low ceiling, a desk with a kettle on it and a rota pinned above the kettle. The cell doors are the same colour as the walls. No noise anywhere."

  - id:      M1.8.S03.020
    speaker: BRICK
    voice:   brick
    text:    "Carpet."
    note:    "18.4 Brick: one noun, and it is the most frightening thing in the building. Nobody expands on it."

  - id:      M1.8.S03.030
    speaker: REYES
    voice:   reyes
    text:    "There are observation charts on the doors. Somebody has been writing these up twice a day."

  - id:      M1.8.S03.040
    speaker: MARA
    voice:   mara
    text:    "Open them. Left side first."

  - id:      M1.8.S03.050
    speaker: PRISONER_A
    voice:   civilian_kessara_a
    text:    "Is it over?"
    shot:    "The door has been open for six seconds. He has not stood up."

  - id:      M1.8.S03.060
    speaker: VOSS
    voice:   voss
    text:    "Block's ours. Nobody's coming down."

  - id:      M1.8.S03.070
    speaker: PRISONER_A
    voice:   civilian_kessara_a
    text:    "No. The questions. Is that part over."
    shot:    "It is not a question the second time. Voss has nothing. Hold on him for a beat too long."
    note:    "The stub's 'it means something other than it sounds like'. He is not asking about the war. Nobody comforts him and no line in the scene acknowledges what he just told the room."

  - id:      M1.8.S03.080
    speaker: REYES
    voice:   reyes
    text:    "Sit on the step. I am going to look at your feet, and then we are going to walk to the lift."
    note:    "The only kindness available is a procedure. Zero contractions - and the clause attached to the order is the mechanical difference from Petra, who will give the same care in three bare words one scene from now."

  - id:      M1.8.S03.090
    speaker: PRISONER_B
    voice:   civilian_kessara_b
    text:    "I'm on the list for Thursday."
    shot:    "She is sitting with her back against the bunk frame and her shoes lined up beside her. She does not move when the door opens."

  - id:      M1.8.S03.100
    speaker: MARA
    voice:   mara
    text:    "Everyone out to the corridor. Move to the light."

  - id:      M1.8.S03.110
    speaker: VOSS
    voice:   voss
    text:    "Nineteen doors on this level. Five people watching them."
    note:    "*** P4-d, PART ONE. *** The numerator is S01.040, spoken by Dex as logistics. The player did the arithmetic before Voss said it out loud."

  - id:      M1.8.S03.120
    speaker: VOSS
    voice:   voss
    text:    "This is the building they put people in so nobody finds them, and it's got five."

  - id:      M1.8.S03.130
    speaker: MARA
    voice:   mara
    tags:    [exhausted]
    text:    "It's a shift change. Or the Tithe's got half of them standing on a platform somewhere, that happens every--"
    note:    "*** P4-d, THE EXPLANATION. FLAT BY SPECIFICATION - L1-R17. *** Two reasons instead of one, neither finished, no image, no rhythm, nothing quotable. She reaches for the Tithe because it is the nearest ordinary thing in Kessaran life. She does not hear how thin it is."

  - id:      M1.8.S03.140
    speaker: MARA
    voice:   mara
    text:    "Keep opening doors."
    note:    "Not a rebuttal. A task, used to close the subject - the only part of the exchange she puts any weight behind. Voss does not push a second time and nobody else says anything."

  - id:      M1.8.S03.150
    speaker: REYES
    voice:   reyes
    text:    "Two of them cannot walk unaided. I need somebody at each elbow and I need it now."

  - id:      M1.8.S03.160
    speaker: MARA
    voice:   mara
    text:    "Voss. Route."
    shot:    "She is already at the far end of the block. She does not wait to see whether he goes."
    note:    "Second time in fifteen minutes she has kept him out of a door. Two words, no reason, and the player has now seen the pattern without being told there is one."
