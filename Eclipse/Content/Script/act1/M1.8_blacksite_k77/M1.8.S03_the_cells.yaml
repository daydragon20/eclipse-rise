# ---- dialogue-writer notes (L2) ----
# band:      in-mission-radio (10-25). Ceiling respected (longest 22 w at .080).
#            Register reached at .030, .080, .120, .130, .150.
#            Spread 1 w (.020 "Carpet.") to 22 w = 22x.
#
# *** P4-d, AND WHY IT IS BUILT THIS WAY - RULING L1-R17. ***
# THERE IS NOW ONE shipped epigram, not two: "Police always come afterwards." (M1.5.S05.200).
# M1.6.S05.410 was the second and was rewritten flat on 01-08 under L1-R21 -- it now reads
# "Somebody's called it in by now. They think they're short some ore."
# THE ARGUMENT BELOW SURVIVES THAT, and is worth keeping for a reason the old count hid:
# L1-R17 is not "never write two", it is that the FORM becomes the tell. One shipped epigram
# plus a second neat one still reads as an authorial habit rather than as two people talking.
# So .130 is built out of everything an aphorism is not:
#   - it offers TWO explanations, which is one more than a confident person needs
#   - neither of them is finished. The first is four words. The second dies on "every--"
#   - it has no rhythm, no symmetry, no closing beat, and no image
#   - it reaches for the Tithe, which is the most ordinary thing in Kessaran life, the way
#     a tired person reaches for the nearest available reason
#   - and .140 is not an argument. It is a task, issued to end the conversation, and it is
#     the only part of the exchange she delivers with any weight
# Nothing here would survive being printed on anything. That is the specification.
# She does not notice that it is thin. Nobody in the scene tells her. Voss does not push a
# second time. That silence is the tragedy and there is no line about it.
#
# arithmetic:
#            .110 is not a new fact - Dex said "Nineteen" in S01.040 as ordinary logistics.
#            The player already owns the numerator. Voss supplies the denominator and says
#            "five" twice, because a man who cannot let go of a number repeats it.
#            IMPORTANT: Voss does NOT say Threx knew. He cannot - S05 is where the trap
#            reveals, and pre-empting it would cost the act its best beat. His observation is
#            about STAFFING, which is exactly the shape twist 4 needs: an anomaly with a
#            human explanation available, taken.
# prisoner:  .050 sounds like a question about the war. .070 says what it was about, and it
#            is much smaller and much worse. Voss answers the wrong question first and has
#            nothing for the right one. NOBODY COMFORTS HIM. Reyes arrives with a procedure
#            instead, which is the only kindness available in the scene.
