#
# CORRECTION 1. This block used to end: "Petra has no pronouns at all." SHE HAS FOUR, and
# they are in the file it was written about: "Roll IT" (.010), "IT goes back" (.030), "where
# SHE can see the door" (.050), "Both of THEM" (.090). What is true, and is the separation
# that was meant, is narrower and still mechanical:
#   * no second person ANYWHERE in the file - `\b(you|your)\b` returns nothing
#   * no first person in ANY Petra line - `\b(I|I'm|I've|we|we're|we've|us|our)\b` returns
#     nothing across .010 .030 .035 .050 .070 .090 .110 .120
# So the only pronouns she owns point at crockery, at bedding, and at another prisoner. She
# has no word for herself and no word for him, which is the asymmetry the scene is built on.
# Mara's whole fingerprint is "we"; Petra never reaches first person at all. THAT is the
# cleanest available separation between the two women, and it survives being checked.
# Why it mattered: "no pronouns at all" is unwritable. A writer taking it literally in act 3
# would produce a woman who cannot say "Both of them", and the tic dies with it.
#
# *** MARA vs PETRA - THE MECHANICAL DIFFERENCE, AT .080/.090. ***
# The two lines are adjacent on purpose, so the strip test (18.9 C1) can be run on them
# alone:
#   MARA   a first person plural and a collective, plus a place.  "We move on the hour.
#          Everyone in the corridor."     She moves a room.
#   PETRA  no person in the line at all - a household object and a count.
#          "Cups. Both of them."          She moves two hands.
# Mara's unit is the room; Petra's unit is the next thing a pair of hands does.
#
# CORRECTION 2. The row above used to read "PETRA names a THING and a VERB" and cite .090
# for it. THERE IS NO VERB IN "Cups. Both of them." The published 18.4 rule - he hands you a
# noun, she hands you a verb - is right and holds across her set, but .090 is one of her
# VERBLESS lines and cannot be the example. The lines that carry the rule are .010 ("Roll it
# from the foot end"), .035 ("Square the pillow"), .050 ("Go and stand"), and S09.080 ("And
# somebody boil water") - four imperatives, all pronoun-elided. Against Brick, .090 separates
# on noun class and on the count instead: "Carpet." and "Plates." (M1.8.S03.020, M1.8.S90.070)
# are what a room contains; "Cups. Both of them." is what two hands are about to carry, and
# the number is the instruction.
# Two laconic women, four scenes apart, and no line of either is deliverable by the other.
#
# symmetry:  *** THE NO-GO, AND THE ONE LINE THAT FIXES IT. ***
#            The scene ran .010 P / .020 V / .030 P / .040 V / .050 P / .060 V / .070 P -
#            seven strict alternating turns, no interruption, no marked silence, which is
#            18.9 B's ceiling of six passed by one. Repaired with a DOUBLE rather than a tag,
#            and placed at .035 rather than at .015, because placement is the whole value:
