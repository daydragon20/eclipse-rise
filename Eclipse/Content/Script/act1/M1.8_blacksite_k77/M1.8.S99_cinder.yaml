lines:
  - id:      M1.8.S99.010
    speaker: SELA
    voice:   sela
    text:    "This vault was cut for a pump crew and there are three cells standing in it. Somebody say what happens in the morning."
    shot:    "Hollow Point, full to the walls. Ember, the freed, the ones off the train, and a knot of Iron Chorus by the ramp who have not sat down. Somebody's kettle going in the middle of it."

  - id:      M1.8.S99.020
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "We go back up."

  - id:      M1.8.S99.030
    speaker: CIVILIAN_A
    voice:   civilian_kessara_a
    text:    "Some of us are going home. There's people here who never signed anything."

  - id:        M1.8.S99.040
    speaker:   EMISSARY
    voice:     iron_chorus_emissary
    condition: 'story.m15_pact != "none"'
    text:      "Three cells and one door out. The Chorus sleeps somewhere else."
    note:      "18.4: counts where anyone else would reach for an adjective, and his objection is arithmetic about an exit."

  - id:      M1.8.S99.050
    speaker: REYES
    voice:   reyes
    text:    "Nobody in this room has slept and half of it should not be standing."

  - id:      M1.8.S99.060
    speaker: SELA
    voice:   sela
    text:    "Say it to the room, not to the table."
    note:    "Her tic: a decision being made by four people at a map is handed back to three hundred as a collective one."

  - id:      M1.8.S99.070
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "How did he have the names?"
    note:    "*** P3-d OPENS. *** The question that act 1 does not answer."

  - id:      M1.8.S99.080
    speaker: DEX
    voice:   dex
    text:    "Forty-one people walked in here in one night and nobody asked any of them a single--"
    note:    "EXPLANATION ONE, and it is the true one (Story.Flag.IntakeUnvetted, M1.6.S06, twist 3). It is also the only one that gets interrupted. The correct answer is the least finished sentence in the room."

  - id:         M1.8.S99.090
    speaker:    FIGHTER_A
    voice:      eclipse_fighter_a
    condition:  'story.m15_shiftboss != "warned"'
    interrupts: true
    text:       "The Veil buys people. That's the whole job."
    note:       "EXPLANATION TWO, default branch. Replaced - not joined - by .100 in the warned branch."

  - id:         M1.8.S99.100
    speaker:    FIGHTER_A
    voice:      eclipse_fighter_a
    condition:  'story.m15_shiftboss == "warned"'
    interrupts: true
    text:       "There's a shift boss out there who saw both cells in one kitchen."
    note:       "*** THE WARNED SWAP - L1-R12. *** Occupies .090's slot, never sits beside it. Still three explanations. It does not reopen M1.6.S06's closed thread: nobody asks after him, nobody answers this, and the conversation moves on two lines later like the others."

  - id:      M1.8.S99.110
    speaker: CIVILIAN_B
    voice:   civilian_kessara_b
    text:    "Or he guessed. People guess and then they're right."
    note:    "EXPLANATION THREE, and it is the one that deflates the room. Kept in both branches because a wound needs somewhere for the anger to fail to go."

  - id:      M1.8.S99.120
    speaker: REYES
    voice:   reyes
    text:    "Which one of those do we act on?"
    shot:    "Nobody answers her. Somebody at the back starts moving crates and the noise takes the room somewhere else."
    note:    "*** NOBODY RESOLVES IT. *** Anyone who lets an explanation win here destroys twist 3. The scene does not return to this."

  - id:      M1.8.S99.130
    speaker: SELA
    voice:   sela
    text:    "So who does the district send to?"
    note:    "Pays M1.5.S99.180, where Mara routed the Iron Chorus to Voss and Dex said 'That's new'. The room is not choosing a leader. It needs an address."

  - id:      M1.8.S99.140
    speaker: CIVILIAN_B
    voice:   civilian_kessara_b
    text:    "The one that came up the shaft last. Grey to the eyes, both hands full."
    note:    "*** THE NAME ARRIVES AS A DESCRIPTION. *** She does not know his name and is not trying to give him one. It is what he looked like coming out of the ground."

  - id:      M1.8.S99.150
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Cinder."
    note:    "From the crowd, not a principal. One word, out of somebody else's sentence."

  - id:      M1.8.S99.160
    speaker: BRICK
    voice:   brick
    text:    "Cinder."
    shot:    "It goes along the ramp and comes back. Petra is sitting on a crate at the edge of the light with a cup in both hands and does not say it, and does not look up, and nobody notices either. She is the last adult carrying the name they are trading in."
    note:    "*** WHY IT STICKS. *** The man with the fewest words in the game spends one. Fifth noun he has handed anybody tonight - Carpet, Coats, Door, Plates - and this one is a person. PETRA: ruling L1-R10, one shot, no line, and nobody points at any of it."

  - id:      M1.8.S99.170
    speaker: SELA
    voice:   sela
    text:    "Hands. Now, so everybody sees who's in it."
    shot:    "Hands go up in ones and then in blocks. It is not unanimous and nobody counts it out loud."
    note:    "The vote, explicit, eight words, no speech. AR-7: act 1 spends no oration and she does not get one until act 3."

  - id:        M1.8.S99.180
    speaker:   EMISSARY
    voice:     iron_chorus_emissary
    condition: 'story.m15_pact == "full"'
    text:      "Ours are up. Count them."
    note:      "*** HIS 'NEVER' PAYING OFF. *** He cannot vote for a name because he does not use names, so he votes with a number and makes somebody else do the counting."

  - id:        M1.8.S99.190
    speaker:   EMISSARY
    voice:     iron_chorus_emissary
    condition: 'story.m15_pact == "limited"'
    text:      "Ours stay down. We fight the same streets."
    note:      "The limited branch tells itself apart from the full one in one word - down instead of up - which is exactly the distinction the M1.5 writer asked this scene to preserve for act 2's merger/schism."

  - id:      M1.8.S99.200
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Cinder. What do we do first?"
    note:    "The first time it is used as an address. It is a question about work, which is the only reason it gets answered."

  - id:      M1.8.S99.210
    speaker: VOSS
    voice:   voss
    text:    "Beds, then the door. In that order."
    shot:    "He answers it. He does not repeat the word, does not accept it, does not decline it, and does not look at anybody while he says it."
    note:    "HIS ONLY LINE IN THE SCENE. He answers to the name by answering the question - that is the whole beat, and he never says the word here or anywhere in the game. HALF VARIANT SET (idealist/pragmatist): the axis is what a first order is for."
    variants:
      idealist:   "Beds. Every one of them, before anybody stands a watch."
      pragmatist: "Watch on the ramp first. Then beds, and everybody gets one."

  - id:      M1.8.S99.220
    speaker: DEX
    voice:   dex
    text:    "Who did the wall?"

  - id:      M1.8.S99.230
    speaker: REYES
    voice:   reyes
    text:    "It was there when we came down."
    shot:    "The sigil, painted large and badly on the pump-gallery wall above three hundred people, in whatever was to hand. Nobody knows who. Hold it. End of act 1."
