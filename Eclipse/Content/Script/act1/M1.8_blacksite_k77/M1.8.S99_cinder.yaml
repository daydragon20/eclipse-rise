# *** P3-d, AND WHY NOTHING WINS. ***
# Three explanations reach the room and none of them is answered:
#   .080  the intake        - Dex, who ran the ledger, cut off mid-sentence
#   .090  the Veil's nets   - a fighter, eight flat words           [default branch]
#   .100  the man we let run - same slot, WARNED BRANCH ONLY         [swap, not addition]
#   .110  luck              - a freed conscript, and it deflates the room
# .120 is Reyes asking which one they act on, and NOBODY ANSWERS HER. The shot moves the
# scene on to a completely different question. The player is left holding anger with no
# address, which is the specification for twist 3 and twist 4 both.
# THE SWAP IS A SWAP. In the warned branch the room still hears exactly three explanations;
# .090 does not play. Four would make P3-d a list and stop it being a wound (BEATS_M1.8
# section 4, L1-R12). The M1.6.S06 thread stays closed - nothing here reopens it, nobody
# asks what happened to him, and no line invites a follow-up.
# .080 is the one that matters (Story.Flag.IntakeUnvetted, act 3), and it is deliberately
# the one that gets INTERRUPTED. The true answer is the least finished sentence in the room.
#
# *** THE NAME, AND HOW IT ARRIVES. ***
# .130  Sela asks the practical question - who does the district send to - which pays
#       M1.5.S99.180, where Mara routed the Iron Chorus to Voss and Dex said "That's new".
#       The room does not choose a leader; it needs an ADDRESS.
# .140  a freed conscript answers with a DESCRIPTION instead of a name, because she does not
#       know his name. "Grey to the eyes, both hands full" - what he looked like coming up
#       the shaft. The word falls out of the description.
# .150  a fighter turns the description into one word.
# .160  BRICK REPEATS IT. The man with the fewest words in the game spends one, and that is
#       what makes it stick. He has said "Carpet", "Coats", "Door" and "Plates" tonight; this
#       is the fifth noun and it is a person.
# .200  somebody uses it as an address, as a question. .210 is Voss answering the question
#       and not the name. HE NEVER SAYS THE WORD, here or anywhere in the game.
#
# emissary:  .040, .180 and .190, all gated on story.m15_pact (set by M1.5.S99, three leaves
#            - see the M1.5 writer's escalation; ACT1_OVERVIEW section 6 still lists this
#            flag as a single tag and that ledger row needs updating, flagged in the report).
#            .180/.190 are the payoff of his 18.4 "never": HE CANNOT VOTE FOR A NAME, because
#            he does not use them. So he votes with a count. Full pact and limited pact
#            differ in one word - up or down - which is exactly the distinction M1.5's writer
#            asked M1.8.S99 to preserve, and it costs thirteen words to honour.
# petra:     NO LINES. Ruling L1-R10, one shot note at .160. She is the only person in the
#            room who does not join the naming, and it is not disapproval - she does not use
#            names, and the only name she ever had for him is the one the game cannot voice.
#            She is also the last adult carrying the surname that the room is trading for a
#            symbol tonight. NOBODY POINTS AT ANY OF THAT.
# sela:      three turns, no oration (AR-7), longest 23 w - inside the hub band the beat
#            sheet holds her to. She asks twice and answers nothing; her tic fires at .060,
#            where a decision at a table is handed back to the room as a whole.
# vote:      .170, explicit, hands, and she runs it in eight words without a speech. Canon
#            2.9 satisfied: the surviving cells vote to follow "Cinder".
# sigil:     .220/.230. Two short lines and nobody knows who painted it. Last image, no
