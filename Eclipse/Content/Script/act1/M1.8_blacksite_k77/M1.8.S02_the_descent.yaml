lines:
  - id:      M1.8.S02.010
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Is that daylight?"
    shot:    "The car is a freight cage. The light coming through the mesh has gone from amber to something almost white, and it is getting whiter."

  - id:      M1.8.S02.020
    speaker: REYES
    voice:   reyes
    text:    "It is not. There is a lamp field behind those panels and it does not go off at night."
    note:    "18.4 Reyes: complete, clinical, zero contractions. She is already stressed and nobody has fired a shot."

  - id:      M1.8.S02.030
    speaker: VOSS
    voice:   voss
    text:    "Somebody pays for that all night."

  - id:      M1.8.S02.040
    speaker: BRICK
    voice:   brick
    text:    "Warm."
    note:    "18.4 Brick: a single noun, and it is a man from a pit mine noticing that the air up here has been made comfortable on purpose. He speaks fourth. He never speaks first."

  - id:      M1.8.S02.050
    speaker: MARA
    voice:   mara
    text:    "Nothing on the net past this floor. Hands off the rail."
    note:    "Mara's imperatives name a PLACE and a GROUP. Petra's, two scenes later, name a thing and a verb. That separation starts here and is checkable line by line."

  - id:      M1.8.S02.060
    speaker: REYES
    voice:   reyes
    text:    "Everyone drinks before we are out of this car. There is no water on that level that I would use."

  - id:      M1.8.S02.070
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "My mother cleaned a floor like this one, she used to say the polish was — never mind."

  - id:      M1.8.S02.080
    speaker: VOSS
    voice:   voss
    text:    "Fourteen seconds a floor. Whoever set that was not in any hurry."

  - id:      M1.8.S02.090
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "They're going home."
    shot:    "The car stops where nobody asked it to. The doors open on a white corridor at the end of a working day: coats over arms, a woman shifting a folder to her other hip, a man with a lunch tin swinging off two fingers. Eight armed people stand in a freight cage four metres away. Not one person in the corridor looks up. Hold it long enough to be uncomfortable. Brick does not look away and does not say anything."
    note:    "*** THE ONE LINE. *** Nameless fighter, flat, and nobody answers it. 21_quality_mandate 21.2 graphic point: the entire Dominion, in ten seconds, argued by silence."

  - id:      M1.8.S02.100
    speaker: MARA
    voice:   mara
    text:    "Down."
    shot:    "She reaches past somebody's shoulder and presses it herself. The doors close on the corridor and nothing in the corridor changes."

  - id:      M1.8.S02.110
    speaker: VOSS
    voice:   voss
    text:    "Nobody touch the left rail. It's live and it's not ours."
    note:    "The squad refuses the subject. That refusal is the discipline of people who cannot afford to think about what they just saw, and no line anywhere says so."
