# ---- header ----
scene:        M1.1.S06
mission:      M1.1
title:        "Off The Deck"
act:          1
location:     "Kessara / Foundry District / Transit Checkpoint"
type:         in-mission-radio
credit_tier:  2

# ---- the three-sentence contract (18.7) ----
want:         "Get four people off an elevated position with a response cycle closing."
obstacle:     "They are carrying more than they came with and one of them is slow."
turn:         "Dex talks them down a route he has never walked, is right, and cannot take the compliment."

# ---- state ----
status:       draft
critic:       GO
words:        184

# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.1.md ----
# cast:      MARA, VOSS, two Ember fighters, DEX (radio)
# flags-in:  none
# flags-out: none
# plants:    P4-a family, light touch. ONE fighter line about how little came after them.
#            In act 1 this reads as relief. In act 4 it reads as allocation. Do not
#            make it a mystery here - nobody wonders aloud, they are just glad.
# beats:     1) what they are carrying out - crates, magazines: the WHY of the mission
#            2) the response arrives, and it is thin
#            3) Dex's route
#            4) somebody thanks Dex; he deflects with hardware (18.4)
#            5) gone
# writer:    Dex never finishes a sentimental sentence. The thank-you must land on him
#            and bounce off in the same breath.

# ---- dialogue-writer notes (L2) ----
# p4-a:      .100 and .110. Two vehicles for six dead men, and the only reaction is
#            relief - "I'll take it". Nobody wonders. In act 4 this is allocation; here
#            it is a good night. Not a mystery, exactly as the stub demands.
# dex:       .230 is the deflection, and it is NOT one of his three jokes. The thank-you
#            lands and bounces inside one breath: he gives the credit to a dead surveyor
#            and hands out a maintenance task in the same line. .240 is his fear coming
#            back out as procedure.
# slow one:  the obstacle is the load, not a wound. That keeps the scene identical in the
#            zero-casualty run, where nobody should be limping.
# takel:     GEEN REGEL IN DEZE SCENE IS VERANDERD OM DE TAKEL-TEGENSPRAAK OP TE LOSSEN,
#            en dat is een besluit, geen nalatigheid. .050 "The hoist won't clear the
#            stair." en .060 "Take the drum off the frame..." leken het besluit uit
#            M1.1.S05.200 ("Leave the hoist. It carries sound.") terug te draaien. S05
#            week. Reden: hier hangt een plant-met-betaling aan - de vijand wijst de
#            trommel zelf aan als het lawaaiige deel in S04.100, .060 neemt precies dat
#            deel mee, en .070 is het gewicht ervan op een trap, wat de hindernis van deze
#            hele scene is. In S05 hing er niets aan. Het alternatief - .050/.060
#            taksbewust maken - zou de belading van een extractie laten afhangen van de
#            keuze bij de gewonde dienstplichtige, waar hij niets mee te maken heeft, en
#            twee extra regels genereren om hetzelfde tweemaal te zeggen.
#            De takel ZELF blijft achter: .050 zegt dat het frame de trap niet haalt, .060
#            neemt alleen de trommel, .200 telt "two crates" en geen takel, en het
#            slotbeeld op .250 laat het frame op het dek staan. Dat is nu overal hetzelfde
#            verhaal. S01.120 (de takel als buit) betaalt daarmee ook uit: een deel van de
#            buit die de briefing beloofde, haalt de trap niet.
# zes:       .110 "Two. For six of theirs." is NIET aangeraakt en dat is een besluit. Het
#            is geen dodentelling zoals S99.230 die was, maar de maat van wat ze geraakt
#            hebben: de patrouille van zes is in elke tak van het bord. Wie dat anders
#            leest, moet hem terugsturen - het staat in het rapport, niet verstopt.
# variance:  1 w (".250 Go.") to 16 w (.230) = 16x.
# jokes:     none in this scene. See S01 (1), S02 (2), S99 (3, clean run only).

lines:
  - id:      M1.1.S06.010
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Two crates. Both sealed."

  - id:      M1.1.S06.020
    speaker: VOSS
    voice:   voss
    text:    "Open the light one."

  - id:      M1.1.S06.030
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Magazines. Sealed. Fourteen of them."
    shot:    "He does not shout it. He holds the lid open and lets the others come and look."
    note:    "The why of the whole mission, in four words and a lid. Counted again in S99."

  - id:      M1.1.S06.040
    speaker: MARA
    voice:   mara
    text:    "Both crates come with us."

  - id:      M1.1.S06.050
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "The hoist won't clear the stair."

  - id:      M1.1.S06.060
    speaker: VOSS
    voice:   voss
    text:    "Take the drum off the frame and sling it on the strap."

  - id:      M1.1.S06.070
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    tags:    [exhausted]
    text:    "Twenty kilos and a stair. I can manage one of those."

  - id:      M1.1.S06.080
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Lights at the north gate."

  - id:      M1.1.S06.090
    speaker: VOSS
    voice:   voss
    text:    "Count them."

  - id:      M1.1.S06.100
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Two vehicles. That's all of it."
    note:    "The closing 'Two.' is cut (2026-07-31). 'That's all of it' already carries it, and .110 opens on the same word from another mouth with no `interrupts` - in audio that is a double take, not a beat."

  - id:      M1.1.S06.110
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Two. For six of theirs. I'll take it."
    note:    "P4-a, light. Relief, not suspicion. Nobody explains it and nobody asks."

  - id:      M1.1.S06.120
    speaker: MARA
    voice:   mara
    text:    "Then we're not going that way."

  - id:      M1.1.S06.130
    speaker: VOSS
    voice:   voss
    text:    "Dex. The maintenance runs under the checkpoint. Do they still reach the coolant stair?"

  - id:      M1.1.S06.140
    speaker: DEX
    voice:   dex
    text:    "Hold. Pre-Dominion survey. Paper. Half of it's water damage."

  - id:      M1.1.S06.150
    speaker: DEX
    voice:   dex
    text:    "Drain gallery under the weighbridge. Runs east. Comes out behind the smelter, in the scrap."

  - id:      M1.1.S06.160
    speaker: DEX
    voice:   dex
    tags:    [nervous]
    text:    "Nobody's walked it. Not since the survey, so if the roof's come in--"

  - id:      M1.1.S06.170
    speaker: MARA
    voice:   mara
    interrupts: true
    text:    "Is it there or is it not?"

  - id:      M1.1.S06.180
    speaker: DEX
    voice:   dex
    text:    "It's on the paper."
    note:    "18.4 Reyes never guesses out loud; Dex does the opposite - he tells you exactly how thin his certainty is, and is right anyway."

  - id:      M1.1.S06.190
    speaker: MARA
    voice:   mara
    text:    "Take the gallery."

  - id:      M1.1.S06.200
    speaker: MARA
    voice:   mara
    text:    "Extraction through the scrap yard. Four of us, two crates."

  - id:      M1.1.S06.210
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Grate's here. He had it."

  - id:      M1.1.S06.220
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Dex. That was clean."

  - id:      M1.1.S06.230
    speaker: DEX
    voice:   dex
    text:    "That's the survey, not me. And check the housing when you're in. The set's been clipping."
    note:    "The thank-you lands and bounces in one breath. He never finishes a sentimental sentence - he does not start one."

  - id:      M1.1.S06.240
    speaker: DEX
    voice:   dex
    text:    "And label the crates before they hit the floor. Please."

  - id:      M1.1.S06.250
    speaker: MARA
    voice:   mara
    text:    "Go."
    shot:    "The grate closes. Sodium light on wet scrap. Last look at the deck: the hoist frame stands where it was left, and the rest of the frame is branch state - five dead in all three branches, and the sixth man is a body on the finished branch and is still breathing on the other two. The camera neither goes looking for him nor avoids him."
    note:    "SHOT HERSCHREVEN 01-08. Stond: 'nothing on the deck but a hoist' - onvoorwaardelijk, terwijl er in de takken left en bound een levende man ligt en in alle drie de takken doden. Een `shot:` wordt nooit ingesproken, dus dit kost geen credit, maar het is het slotbeeld van het velddeel van de ijkmissie en het stuurt de cinematic pass. De regel is nu geschreven zoals hij gelezen moet worden: het frame ligt vast (de takel), de inhoud is takstaat. Geen conditie op deze regel - Mara's 'Go.' is voor iedereen dezelfde."
