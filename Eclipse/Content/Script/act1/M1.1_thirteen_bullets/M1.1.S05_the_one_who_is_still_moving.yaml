# ---- header ----
scene:        M1.1.S05
mission:      M1.1
title:        "The One Who Is Still Moving"
act:          1
location:     "Kessara / Foundry District / Overpass"
type:         in-mission-radio
credit_tier:  2

# ---- the three-sentence contract (18.7) ----
want:         "Voss wants to leave, and the wounded conscript on the deck will not stop making noise."
obstacle:     "Mara will not make this call for him, and the patrol's relief cycles in minutes."
turn:         "Whatever Voss decides, the cell watches him decide it, and that is the thing that changes."

# ---- state ----
status:       draft
critic:       null
words:        239

# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.1.md ----
# cast:      VOSS, MARA, one wounded Dominion conscript, one Ember fighter
# flags-in:  none
# flags-out: Story.Choice.M11_Conscript.Finished | .Left | .Bound   (NEW TAGS)
#            RULED 2026-07-31, L1-R3 - THE WRITER'S ESCALATION WAS UPHELD. The stub
#            originally asked for one boolean, Story.Choice.M11_ConscriptSpared. It was
#            wrong: three outcomes do not fit in a boolean, and collapsing "left to bleed"
#            into "finished" loses a moral position the twist-5 tally needs. That tag is
#            WITHDRAWN. Three mutually exclusive leaves under one parent, no schema change.
#            The .Bound leaf is what the T5 tally counts as mercy.
#            The writer's script-side spelling story.m11_conscript_choice == "bound" is
#            correct and maps to the leaf mechanically (SCRIPT_FORMAT 4).
# plants:    P5-a  first entry in the mercy tally that gates twist 5 (Kaine's conscience, act 4).
#            MANDATORY carrier - this plant may never move to an optional objective.
# beats:     1) the conscript is alive, young, and procedural because that is his training -
#               he states his unit number, not his name
#            2) the fighter wants to walk on
#            3) Mara says nothing. Deliberately. She spends no "we" here.
#            4) Voss chooses: finish him / leave him / bind him and leave him
#            5) one reaction per branch from the fighter, one from Mara
# player:    the choice IS the scene
# writer:    NOBODY STATES THE MORAL. 18.9 A forbids it and the scene does not need it -
#            the player knows what he did.
#            The conscript is procedural, not pitiful. That is worse, and it is 18.5 rule 5.
#            Voss variants required on all four axes here; this is one of the two scenes
#            in M1.1 that earns full variant coverage (see C-6/Q-7).

# ---- dialogue-writer notes (L2) ----
# TWO ESCALATIONS IN THIS FILE. Both are in the report; neither was silently solved.
#
# 1) FLAG SHAPE. The stub asks for ONE boolean, Story.Choice.M11_ConscriptSpared, but the
#    scene has THREE outcomes and the T5 tally needs to tell "bound and left alive" apart
#    from "left to bleed". A boolean cannot carry that. I have written conditions against
#    story.m11_conscript_choice with values "finished" / "left" / "bound", and systems
#    should ALSO set Story.Choice.M11_ConscriptSpared true on "bound". If the architect
#    prefers one boolean, the "left" branch reactions collapse into "finished" and that
#    is a story loss, not a formatting one.
# 2) NO PLAYER-CHOICE CONSTRUCT. phase0/SCRIPT_FORMAT.md has no way to say "these three
#    lines are the player's options". .140 / .150 / .160 are marked by note only. Forty-two
#    missions of choices need a real field. Escalated.
#
# mara:      she has NO line until after the choice is made. The silence at .110 is the
#            scene's content (18.7). It is written as a shot, because a line with empty
#            text is not valid YAML content and would not survive the validator.
# moral:     nobody states it. Mara's three reactions are a count, a movement order, and a
#            correction to a knot. None of them is a verdict.
# variants:  full four-axis coverage on all three options - one of the two scenes in M1.1
#            that earns it (C-6 / Q-7).
# variance:  1 w (".110 Mara.") to 15 w (.090) = 15x.

lines:
  - id:      M1.1.S05.010
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Six went in. Five are down."

  - id:      M1.1.S05.020
    speaker: CONSCRIPT_A
    voice:   dominion_conscript_a
    text:    "Four six two. Transit supply."
    shot:    "He is on his back beside the hoist he was complaining about ten minutes ago."

  - id:      M1.1.S05.030
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "He's reciting."

  - id:      M1.1.S05.040
    speaker: CONSCRIPT_A
    voice:   dominion_conscript_a
    text:    "Four six two."

  - id:      M1.1.S05.050
    speaker: VOSS
    voice:   voss
    text:    "How bad?"

  - id:      M1.1.S05.060
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Through the hip. He isn't walking off this deck."

  - id:      M1.1.S05.070
    speaker: CONSCRIPT_A
    voice:   dominion_conscript_a
    text:    "There's a form for it. If I'm taken, there's a form."
    note:    "18.5 rule 5. He is not begging. He is telling his captors that the paperwork exists."

  - id:      M1.1.S05.080
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Relief cycles on the hour. We're eleven minutes inside that."

  - id:      M1.1.S05.090
    speaker: CONSCRIPT_A
    voice:   dominion_conscript_a
    text:    "My shift ends at the sixth horn. They mark you absent at the sixth horn."

  - id:      M1.1.S05.100
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Noise like that runs the whole span."

  - id:      M1.1.S05.110
    speaker: VOSS
    voice:   voss
    text:    "Mara."
    shot:    "She does not look up from the crate she is strapping. She does not look up at all."
    note:    "The obstacle, played as silence. She spends no we here - she is saving it."

  - id:      M1.1.S05.120
    speaker: CONSCRIPT_A
    voice:   dominion_conscript_a
    text:    "Four six two. Transit supply. Four six--"

  - id:      M1.1.S05.130
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    interrupts: true
    text:    "Nine minutes."

  - id:      M1.1.S05.140
    speaker: VOSS
    voice:   voss
    text:    "One round. Then we go."
    note:    "PLAYER OPTION 1 of 3 - finish him. Sets story.m11_conscript_choice = finished."
    variants:
      pragmatist: "One round buys the nine minutes."
      idealist:   "He doesn't lie here for an hour."
      personal:   "Not like this. Not for an hour."
      strategic:  "He's heard four voices. That's a description."

  - id:      M1.1.S05.150
    speaker: VOSS
    voice:   voss
    text:    "Leave him. Move."
    note:    "PLAYER OPTION 2 of 3 - walk on. Sets story.m11_conscript_choice = left."
    variants:
      pragmatist: "Nothing here gets spent on a man already down."
      idealist:   "The relief takes him. That's what a relief is for."
      personal:   "He'll keep. Somebody's coming up that ramp for him."
      strategic:  "A live one they have to carry is a slow patrol."

  - id:      M1.1.S05.160
    speaker: VOSS
    voice:   voss
    text:    "Dressing. Above the hip."
    note:    "PLAYER OPTION 3 of 3 - bind and leave. Sets story.m11_conscript_choice = bound AND Story.Choice.M11_ConscriptSpared = true. P5-a, first entry in the twist-5 tally."
    variants:
      pragmatist: "Dress it. Their relief spends an hour on him instead of us."
      idealist:   "He came up here pushing a crate."
      personal:   "He said his shift ends at the sixth horn."
      strategic:  "Somebody at that gate should get one back alive."

  - id:        M1.1.S05.170
    speaker:   FIGHTER_B
    voice:     eclipse_fighter_b
    condition: 'story.m11_conscript_choice == "finished"'
    text:      "Four."
    note:      "The new round count, spoken immediately. No verdict, and it is the worst line in the scene."

  - id:        M1.1.S05.180
    speaker:   MARA
    voice:     mara
    condition: 'story.m11_conscript_choice == "finished"'
    text:      "That was a round."
    shot:      "She is already moving. She does not look at the deck."

  - id:        M1.1.S05.190
    speaker:   CONSCRIPT_A
    voice:     dominion_conscript_a
    condition: 'story.m11_conscript_choice == "left"'
    tags:      [pause]
    text:      "Four six two. Four six two."
    shot:      "It keeps going while they walk. It is still going when the camera leaves."

  - id:        M1.1.S05.200
    speaker:   FIGHTER_A
    voice:     eclipse_fighter_a
    condition: 'story.m11_conscript_choice == "left"'
    text:      "Leave the hoist. It carries sound."

  - id:        M1.1.S05.210
    speaker:   MARA
    voice:     mara
    condition: 'story.m11_conscript_choice == "left"'
    text:      "Then we walk."

  - id:        M1.1.S05.220
    speaker:   CONSCRIPT_A
    voice:     dominion_conscript_a
    condition: 'story.m11_conscript_choice == "bound"'
    text:      "You have to log it. If a wound is dressed, it gets logged."
    note:      "He cannot thank them. He cites the regulation instead. That is the character and the faction in one line."

  - id:        M1.1.S05.230
    speaker:   FIGHTER_B
    voice:     eclipse_fighter_b
    condition: 'story.m11_conscript_choice == "bound"'
    text:      "That's our dressing."

  - id:        M1.1.S05.240
    speaker:   MARA
    voice:     mara
    condition: 'story.m11_conscript_choice == "bound"'
    text:      "Above the hip. Tighter."
    shot:      "She crouches, fixes the knot, and stands up. She does not say whether it was right."

  - id:      M1.1.S05.250
    speaker: MARA
    voice:   mara
    text:    "Off the deck."
