# ---- header ----
scene:        M1.1.S04
mission:      M1.1
title:        "One Volley"
act:          1
location:     "Kessara / Foundry District / Overpass"
type:         in-mission-radio
credit_tier:  2

# ---- the three-sentence contract (18.7) ----
want:         "The cell wants the whole patrol down inside the free volley, before anyone can key a radio."
obstacle:     "The patrol walks the chokepoint in the wrong order and the leader comes last."
turn:         "Voss re-solves the ambush out loud, and Mara follows his call instead of her own."

# ---- state ----
status:       draft
critic:       GO
words:        150

# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.1.md ----
# cast:      VOSS, MARA, two Ember fighters, Dominion conscripts (bark vocabulary)
# flags-in:  none
# flags-out: none
# plants:    none
# beats:     1) waiting; breathing; the patrol arrives
#            2) the order is wrong - the leader is last, the volley cannot reach him
#            3) Voss's fix: technical, short, over the radio
#            4) Mara's permission, in two words
#            5) the volley
#            6) what goes wrong anyway
# player:    combat throughout - this is the mission's teaching beat (Command Mode prompt)
# writer:    THIS IS THE FIRST TIME ANYONE FOLLOWS VOSS. Keep it so small the player
#            almost misses it. 2.4 requires that "people follow them" emerges from play,
#            never from a speech.
#            Lines under fire obey the CALLOUT band (2-6 words), not the radio band.
#            This scene carries the SCRIPT_PRODUCTION_PLAN section 3 test: do they talk
#            over the shooting?

# ---- dialogue-writer notes (L2) ----
# band:      pre-contact lines use the radio band (ceiling 25; longest here is 13).
#            From .200 onward everything is CALLOUT (2-6), per the stub. Nothing under
#            fire runs past 5 words. The SCRIPT_PRODUCTION_PLAN section 3 test - "do they
#            talk over the shooting?" - is answered by the shape of the scene: after the
#            volley there are eleven lines and they total 27 words.
# variance:  1 w to 13 w = 13x.
# height:    NO LINE CHANGED HERE - this is a record, 2026-07-31, ruling L1-R18. The
#            approach choice in S01 is withdrawn and its surviving line (S01.210) is now a
#            plant about the height. THIS SCENE IS ITS PAYOFF and it already carries it in
#            full: .030 and .050 are the column read from above, .120-.140 change the plan
#            after the patrol is in the lane, and CONSCRIPT_B says where the fire came from
#            at .220. Nothing needed writing. Nothing here may be re-staged to ground level
#            without taking S01.210 with it.
# the fix:   Voss's solve is the S01 plant cashed. It works because the CONSCRIPTS are
#            procedural (18.5 rule 5) - the enemy's own drill moves the leader into the
#            kill box. The player solved the puzzle by listening to the enemy at .080-.100.
# follow:    Mara states her plan at .070 and abandons it at .150. Her permission is two
#            words and it is addressed to the SQUAD, not to Voss - "His mark." That keeps
#            AR-5 intact (no "you" to Voss) and it is the whole of 2.4's "people follow
#            them" with no speech attached.
# handoff:   CONSCRIPT_A is the man the player will find alive in S05. He is given three
#            lines of ordinary work first, on purpose.

lines:
  - id:      M1.1.S04.010
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    tags:    [whispering]
    text:    "Rain's in. Plates are quiet now."

  - id:      M1.1.S04.020
    speaker: MARA
    voice:   mara
    tags:    [quietly]
    text:    "Breathe out before, not after."

  - id:      M1.1.S04.030
    speaker: VOSS
    voice:   voss
    text:    "Six of them. Two crates on a hand hoist. Rifles slung."

  - id:      M1.1.S04.040
    speaker: MARA
    voice:   mara
    text:    "Leader?"

  - id:      M1.1.S04.050
    speaker: VOSS
    voice:   voss
    text:    "Last man. He's the one carrying the set."

  - id:      M1.1.S04.060
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Then the volley doesn't reach him."

  - id:      M1.1.S04.070
    speaker: MARA
    voice:   mara
    text:    "Volley on the crates. Everybody onto the last man after."
    note:    "Her plan. It is workable and it is worse than his. She will drop it at .150."

  - id:      M1.1.S04.080
    speaker: CONSCRIPT_A
    voice:   dominion_conscript_a
    text:    "Hoist is binding. Second time this span."

  - id:      M1.1.S04.090
    speaker: CONSCRIPT_B
    voice:   dominion_conscript_b
    text:    "Log it at the gate. Keep walking."

  - id:      M1.1.S04.100
    speaker: CONSCRIPT_A
    voice:   dominion_conscript_a
    text:    "It's the drum. Nobody greases the drum."

  - id:      M1.1.S04.110
    speaker: VOSS
    voice:   voss
    text:    "Hold. Fourth horn is in about forty seconds."

  - id:      M1.1.S04.120
    speaker: VOSS
    voice:   voss
    text:    "When the lamps drop they close up, and he walks to the front."

  - id:      M1.1.S04.130
    speaker: VOSS
    voice:   voss
    text:    "Procedure. Senior man takes point when the light goes."

  - id:      M1.1.S04.140
    speaker: VOSS
    voice:   voss
    text:    "Take the volley on the dark."

  - id:      M1.1.S04.150
    speaker: MARA
    voice:   mara
    tags:    [pause]
    text:    "His mark."
    shot:    "She says it to the line, not to him. Two of them look at Voss for the first time."

  - id:      M1.1.S04.160
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Copy."

  - id:      M1.1.S04.170
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "On the new one. Right."
    note:    "18.9 D: somebody is allowed to be petty and unhappy about it. He complies anyway."

  - id:      M1.1.S04.180
    speaker: CONSCRIPT_B
    voice:   dominion_conscript_b
    text:    "That's fourth horn. Close it up."
    note:    "The enemy announces the mechanism that kills him. Nobody on the deck reacts."

  - id:      M1.1.S04.190
    speaker: MARA
    voice:   mara
    tags:    [quietly]
    text:    "Lamps."

  - id:      M1.1.S04.200
    speaker: VOSS
    voice:   voss
    band:    callout
    text:    "Now."

  - id:      M1.1.S04.210
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    tags:    [shouting]
    band:    callout
    text:    "Contact, left rail!"

  - id:      M1.1.S04.220
    speaker: CONSCRIPT_B
    voice:   dominion_conscript_b
    tags:    [shouting]
    band:    callout
    text:    "Above us! Above the--"

  - id:      M1.1.S04.230
    speaker: MARA
    voice:   mara
    interrupts: true
    band:    callout
    text:    "Two down."
    shot:    "The interruption is the volley. Nine seconds of dark, four muzzle flashes, no lamps."

  - id:      M1.1.S04.240
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    band:    callout
    text:    "Leader's on the deck."

  - id:      M1.1.S04.250
    speaker: CONSCRIPT_A
    voice:   dominion_conscript_a
    tags:    [shouting]
    band:    callout
    text:    "Man down at the hoist!"

  - id:      M1.1.S04.260
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    band:    callout
    text:    "That's me dry."

  - id:      M1.1.S04.270
    speaker: MARA
    voice:   mara
    band:    callout
    text:    "Count."

  - id:      M1.1.S04.280
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    band:    callout
    text:    "Two."

  - id:      M1.1.S04.290
    speaker: VOSS
    voice:   voss
    band:    callout
    text:    "Three."

  - id:      M1.1.S04.300
    speaker: MARA
    voice:   mara
    band:    callout
    text:    "Five between us."
    note:    "The mission's arithmetic, audible: thirteen became five and bought a patrol."

  - id:      M1.1.S04.310
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    band:    callout
    text:    "One's still moving."
    shot:    "Nobody moves toward the sound. The lamps come back up the row, one span at a time."
