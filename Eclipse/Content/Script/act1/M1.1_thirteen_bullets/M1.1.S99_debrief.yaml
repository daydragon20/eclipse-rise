#            2) Reyes treats what there is to treat; her first complete clinical sentence
#            3) Dex takes the haul apart
#            4) Mara names what Voss did
#            5) Voss passes it on - 18.4: "never claims credit in front of the people
#               who did the work". This is the first time that trait is visible.
#            6) conditional: if the conscript was spared, one line points back at it
