# ---- the three-sentence contract (18.7) ----
want:         "Mara wants the cell to understand what they now own, before they start celebrating what they survived."
obstacle:     "They came back with more ammunition than they left with, and nobody can stop counting it."
turn:         "She gives the night's credit to Voss in front of everyone, and he hands it straight to the two who walked the low route."

# ---- state ----
status:       draft
critic:       GO
words:        280

# Een tak die BEWUST niets afspeelt. De criticus heeft deze stilte op 01-08
# uitdrukkelijk goedgekeurd; zonder dit veld bleef BRANCH voor altijd rood op een
# scene die de poort al door is, en een bar die altijd rood staat verbergt
# evenveel als een test die nooit rood wordt.
#
# HET BESLUIT IS ONGEWIJZIGD; DE REDEN HEEFT ER 01-08 EEN ZIN BIJ GEKREGEN. De
# goedgekeurde tekst hieronder staat er woordelijk nog; wat erachter staat is van de
# schrijver en is gemarkeerd. Aanleiding: .245 is er bij gekomen en dat is een DERDE
# echo, dus de zin "beide bestaande echo's" zou anders niet meer kloppen. Een stilte
# waarvan de motivering stilletjes onwaar wordt, dekt precies de volgende echte
# omissie af. De criticus moet deze aanvulling opnieuw aftekenen.
silence:
  left: "Beide bestaande echo's zijn INVENTARISFEITEN: .190 een verband dat weg is, .200 een patroon dat weg is. De left-tak geeft niets uit, dus het grootboek heeft niets te melden - de stilte volgt uit het apparaat en niet uit nalatigheid. Bovendien krijgt die speler al de hardste echo van de drie en die staat op de goede plek: M1.1.S05.190 'Four six two. Four six two.', met shot 'It is still going when the camera leaves.' Een debriefregel erbij verdunt de beste beat van die tak, en elke left-regel nodigt uit tot het oordeel dat het beat-sheet juist verbiedt. -- AANVULLING SCHRIJVER 01-08, zelfde uitkomst: er is sinds vandaag een derde echo, .245, en die is geen inventarisfeit maar de betaling van de plant in M1.1.S05.220 - ons verband dat in HUN logboek terechtkomt. Die plant staat alleen in de tak bound, dus ook langs die weg komt er links niets bij: geen verband, geen logregel. Wat de left-speler over de vijandelijke boekhouding te horen krijgt, krijgt hij op .230, net als iedereen."

# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.1.md ----
