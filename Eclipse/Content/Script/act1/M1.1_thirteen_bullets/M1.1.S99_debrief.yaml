# ---- dialogue-writer notes (L2) ----
# ESCALATION, RULED. This scene needed a run-quality flag that did not exist, and it was
# written against story.m11_zero_casualty (bool) pending a decision. RULING L1-R4 answers
# it: that flag should not exist at all. "Did anybody go down tonight" is a RUN fact, not
# campaign state, and persisting it for 42 missions would grow the save with transient
# data. CORRECTED 2026-07-31: .090 / .100 / .130 read `run.zero_casualty`, which reads the
# existing downed-soldier latch from the SPEC-P2-04 amendment and needs no new state, only
# access. .190 read the boolean story.m11_conscript_spared, WITHDRAWN by L1-R3 - it now
# reads the leaf `story.m11_conscript_choice == "bound"` that M1.1.S05 actually sets.
#
# aftermath: 18.6 says ZERO comic beats in aftermath. Dex's third joke therefore exists
#            ONLY on run.zero_casualty == true. If anybody is hurt, .130 does not
#            play and the scene has no laugh in it at all. That is the point.
# credit:    .170 is the first time 18.4's "never claims credit in front of the people who
#            did the work" is visible. Mara refuses the refusal at .180 - she writes it
#            down over his objection, which is what building a leader looks like.
# t4:        .230 is de zichtbaarheidsbeat van de missie: de kratten worden geteld, het
#            dossier heet diefstal. In act 1 is dat veiligheid. In act 4 is het een besluit
#            dat iemand genomen heeft. HERZIEN 01-08 - hij telde eerst zes doden, en dat is
#            in twee van de drie takken onwaar. De regel telt nu geen mensen meer. Dat is
#            geen verzwakking: dat de vijand de lading telt en de mannen niet, IS de
#            onderreactie, en die staat er nu in alle drie de takken even hard.
# p5-a:      .190 (bound) en .200 (finished) wijzen terug naar S05 zonder oordeel, uit twee
#            monden. De stub vroeg alleen het gespaarde geval; de tegenhanger staat er ook,
#            want een keuze die aan een kant echoot en aan de andere zwijgt leest als
#            goedkeuring. Beide zijn feiten over de inventaris. Geen van beide oordeelt.
#            .245 is er 01-08 bij gekomen en het is GEEN tweede echo van hetzelfde: .190
#            gaat over ONS grootboek (een verband dat weg is uit de tas), .245 over HUN
#            grootboek (waar dat verband terechtkomt). Twee vragen, niet een vraag tweemaal.
#            De tak left blijft leeg en waarom staat in `silence:` hierboven.
# name-slot: .170 personal variant uses {name}, pronoun-free (18.5 rule 6, AR-10).
#            .090 is 01-08 voornaamwoordvrij gemaakt om dezelfde reden en heeft met opzet
#            GEEN {name}: die conditie vuurt op elke neergegane squadgenoot, dus elke naam
#            en elk getal in die regel zou bij twee gewonden over de verkeerde gaan.
# variance:  1 w (".240 Theft.") to 21 w (.190) = 21x. Ongewijzigd: .090 is 18 w en .245
#            is 7 w, dus beide uitersten staan waar ze stonden. Register: .190 haalt de
#            20 van de cutscene-band, en die regel is niet aangeraakt.
# words:     280, met de hand herteld op 01-08 (gesproken woorden, varianten meegerekend,
#            notes/shots/labels niet - dezelfde telling die S03 op 27 en S05 op 239 zette).
#            Het veld stond op 273 en dat was al een woord naast de eigen telling; er is
#            geen tool die het vult, dus het is hier opnieuw geteld in plaats van
#            bijgewerkt met een verschil bovenop een getal dat niet klopte.

lines:
  - id:      M1.1.S99.010
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Fourteen. Sealed, all of them."
    shot:    "Map table. The crates are open on it where the four piles were."

  - id:      M1.1.S99.020
    speaker: DEX
    voice:   dex
    text:    "Thirty a piece."

  - id:      M1.1.S99.030
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Say the number."

  - id:      M1.1.S99.040
    speaker: DEX
    voice:   dex
    text:    "Four hundred and twenty."

  - id:      M1.1.S99.050
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Again."

  - id:      M1.1.S99.060
    speaker: DEX
    voice:   dex
    text:    "Four hundred and twenty."

  - id:      M1.1.S99.070
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Thirteen. We went up there with thirteen and we came back with--"

  - id:      M1.1.S99.080
    speaker: MARA
    voice:   mara
    interrupts: true
    text:    "Put them in the rack before anybody says a number out loud again."
    note:    "The want, enacted: she stops the celebration before it starts. The obstacle is that nobody in the room can stop counting."

  - id:        M1.1.S99.090
    speaker:   REYES
    voice:     reyes
    condition: 'run.zero_casualty == false'
    text:      "Nothing tonight went through bone. Everyone who went down walks again. Not one of them walks this week."
    note:      "Her first complete clinical sentences in the game. No contractions - she is stressed and the training reasserts (18.4). HERSCHREVEN 01-08. Stond: 'One through the meat above the knee. He keeps the leg. He does not keep the week.' Twee dingen mis. (1) Twee keer 'he' tegen een roster dat pas bij runtime beslist wie er neerging - L1-R8 eist voornaamwoordvrij, en dit bestand doet het elders goed (.170 personal, '{name} took the low rail first.'). (2) De regel telde precies een gewonde, terwijl run.zero_casualty == false op ELKE neergegane squadgenoot vuurt; bij twee gewonden sprak de arts over de verkeerde. Nu telt hij niemand: 'everyone who went down' klopt bij een en bij vier. Geen {name} hier, en dat is de reden - een naamslot zou juist weer een gewonde vastzetten. 'Went down' is bovendien het woord van de latch die de conditie leest (SPEC-P2-04). De antithese van het origineel staat er nog: het been houden en de week kwijt zijn, in het valutastelsel van deze cel."

  - id:        M1.1.S99.100
    speaker:   REYES
    voice:     reyes
    condition: 'run.zero_casualty == true'
    text:      "I opened nothing tonight. Four units of plasma. Still four."
    note:      "Pays off S01.100 exactly. The optional objective is rewarded with an inventory line, not a compliment."

  - id:      M1.1.S99.110
    speaker: REYES
    voice:   reyes
    text:    "That is the whole report."

  - id:      M1.1.S99.120
    speaker: DEX
    voice:   dex
    text:    "Crate two is ration tabs and a spool of comm wire."

  - id:        M1.1.S99.130
    speaker:   DEX
    voice:     dex
    condition: 'run.zero_casualty == true'
    tags:      [amused]
    text:      "Four hundred rounds in that crate and the wire is the part I'll dream about."
    note:      "Dex joke 3 of 3. Clean run only - 18.6 allows zero comic beats in aftermath."

  - id:      M1.1.S99.140
    speaker: MARA
    voice:   mara
    text:    "The volley went on his mark."

  - id:      M1.1.S99.150
    speaker: MARA
    voice:   mara
    text:    "Their leader walked last. He walked first, and he never learned why."

  - id:      M1.1.S99.160
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Lamps went out and he came straight up the column. Like he was told to."
    shot:    "It is the man who said On the new one, right. He is not saying it that way now."

  - id:      M1.1.S99.170
    speaker: VOSS
    voice:   voss
    text:    "Two of them went down the low rail with five rounds between them."
    shot:    "He is looking at the two, not at Mara."
    note:    "The turn. He hands the credit to the people who did the work before anybody can finish giving it to him."
    variants:
      pragmatist: "It was a lighting circuit. It would have dropped without me."
      idealist:   "Two went down the low rail with five rounds. Start there."
      personal:   "{name} took the low rail first. Nobody asked for that."
      strategic:  "The circuit did it. Anybody standing where I stood sees it."

  - id:      M1.1.S99.180
    speaker: MARA
    voice:   mara
    text:    "Write it in the book anyway."

  - id:        M1.1.S99.190
    speaker:   REYES
    voice:     reyes
    condition: 'story.m11_conscript_choice == "bound"'
    text:      "Somebody used a pressure dressing tonight. It is not in the bag and it is not on anyone in this room."
    shot:      "Nobody answers her. She writes something down and does not ask twice."
    note:      "P5-a echo, spared branch. A fact about the inventory. No verdict, and she does not guess out loud."

  - id:        M1.1.S99.200
    speaker:   DEX
    voice:     dex
    condition: 'story.m11_conscript_choice == "finished"'
    text:      "Count says one round short. Somebody spent one on the way out."
    shot:      "He goes back to the wire. Nobody takes it up."
    note:      "P5-a echo, finished branch. The ledger does not balance and nobody explains it."

  - id:      M1.1.S99.210
    speaker: MARA
    voice:   mara
    text:    "The crates are the smallest thing we took."

  - id:      M1.1.S99.220
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "What's bigger than four hundred rounds?"

  - id:      M1.1.S99.230
    speaker: MARA
    voice:   mara
    text:    "They'll count the crates missing and write it up as theft."
    note:    "Visibility 1/8. The Dominion under-reacts and it is filed as a property matter - the P4 pattern this mission lays the first stone of. In act 1 that is safety. In act 4 it is a decision somebody made. HERSCHREVEN 01-08: stond 'They'll count six men missing and write it up as theft.' Dat telde zes doden onvoorwaardelijk, terwijl er in de takken left en bound vijf dood zijn en er een leeft - en het sprak daarmee de plant tegen die M1.1.S05.220 met opzet legde ('You have to log it. If a wound is dressed, it gets logged.'). Het lijk is uit de regel gehaald en niet vervangen door een ander getal: wat de vijand telt is nu de LADING, en dat is dezelfde onderreactie in een scherpere vorm. Vijf of zes mannen van het dek, en het dossier gaat over twee kratten. Mara voorspelt hier; een overlevende maakt haar voorspelling niet onwaar, hij maakt hem erger. Geen getal toegevoegd - L1-R14, zes is 29x verzadigd in act 1."

  - id:      M1.1.S99.240
    speaker: DEX
    voice:   dex
    text:    "Theft."

  - id:        M1.1.S99.245
    speaker:   FIGHTER_B
    voice:     eclipse_fighter_b
    condition: 'story.m11_conscript_choice == "bound"'
    text:      "We're a line in their log now."
    shot:      "He says it to the crate, not to the room. Mara answers without turning round."
    note:      "NIEUW 01-08, en het is de betaling van de plant in M1.1.S05.220. Die plant is bound-only en zijn betaling is dat nu ook: de dienstplichtige zei op het dek dat een verbonden wond gelogd MOET worden, deze man antwoordde daar 'That's our dressing.' op, en hier komt het bij hem terug. Wat de speler leert is een feit, geen oordeel: zijn genade staat in het dossier van de vijand. Ingevoegd op .245 en niet hernummerd - SCRIPT_FORMAT sectie 2 houdt de tussenruimtes juist hiervoor vrij. Het staat NA .240 zodat Dex' 'Theft.' direct op Mara volgt zoals in de andere takken, en VOOR .250, want daardoor beantwoordt 'Nobody down there has said our name yet' in deze tak een zorg in plaats van een beat af te sluiten. De tak left blijft stil - zie het `silence:`-blok; deze regel vuurt daar niet."

  - id:      M1.1.S99.250
    speaker: MARA
    voice:   mara
    text:    "Nobody down there has said our name yet."
    note:    "'That's worth more than the wire.' is cut (2026-07-31). .230 already set it up; the second sentence had Mara adding the score up for the player."

  - id:      M1.1.S99.260
    speaker: MARA
    voice:   mara
    tags:    [exhausted]
    text:    "Count it into the book. Then sleep."
    shot:    "She leaves first. Voss stays at the table with the open crate and does not touch it."
