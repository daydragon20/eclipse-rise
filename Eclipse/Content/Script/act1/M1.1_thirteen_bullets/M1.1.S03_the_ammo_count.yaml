#                 variants: pragmatist "That's four of them if I don't miss."
#                           idealist   "That's not enough."
#   M1.1.S03.030  MARA  [pause]    "It was enough for the ones who had six."
#                 shot: She moves off. Camera stays on Voss.
#
# Architect recommendation: KEEP THEM. They are better than a second attempt and they
# are the reason the format document exists. Add at most one beat AFTER .030 (ids .040+,
# e.g. Voss reusing the number as a plan). Add NOTHING before .010. Never renumber.
#
# writer:    three lines carry this scene. Everything you add takes it down.

# ---- dialogue-writer notes (L2) ----
# The three seed lines are kept VERBATIM on their reserved ids, exactly as advised.
# Nothing added before .010. Nothing renumbered. Nothing after .030 either - see below.
#
# *** M1.1.S03.040 IS RETIRED, 01-08. ID PENSIONED, NOT RENUMBERED. ***
# The one permitted post-.030 beat was written - VOSS, "Six of them. Thirteen of us." -
# and it does not survive its own critic pass. Three grounds, each fatal alone:
#   1) "of us" attaches to PEOPLE in spoken English. The cell is eleven; thirteen is the
#      round count. The line hands the player the wrong referent for the mission title.
#   2) the same three words already mean six ENEMY SOLDIERS one scene later - S04.030,
#      "Six of them. Two crates on a hand hoist." The protagonist would be overwriting
#      his own vocabulary across two adjacent scenes, and the later use is the load-
#      bearing one: it is the read that sets up the ambush.
#   3) it converted nothing. Its own note claimed the count "becomes what he can spend";
#      what the line does is hand .030 back to Mara with the pronouns swapped. The
#      conversion is already made, in her mouth, and that is the turn of the scene.
# Same treatment as M1.1.S01.220 under L1-R18: the line is deleted, the id is retired,
# and M1.1.S03.040 is never reused - not here, not anywhere.
#
# I did NOT write a replacement on that id. Anything standing there has to say something
# .030 does not, before S04 - and S04 is where Voss actually spends the count, out loud,
# under fire, in front of people who then follow him. Spending it early, alone, over his
# own magazine is the thin version of the mission's best beat arriving a scene too soon.
# The scene now ends on .030's shot: "She moves off. Camera stays on Voss." A held frame
# on a man with a number and no line is the exit the architect asked for when he wrote
# "three lines carry this scene. Everything you add takes it down." 18.9 C2's deletion
# test says the cut is the fix; here the cut WAS the fix.
# 21_quality_mandate's "generous in count" is spent elsewhere in this mission on purpose -
# the surplus went into S01, S04, S05 and S99, and this is the scene it was taken from.
#
# band:     type is `in-mission-radio` (10-25). ALL THREE LINES ARE BELOW 10 WORDS, and
#           they are the three that phase0/SCRIPT_FORMAT.md ships as its own example.
#           Bands are ceilings (RULED, L1-R1), so the short lines stand.
# variance: 1 w (.010) to 9 w (.030) = 9x. Three lines, so register and spread are not
#           checked at all (L1-R1) - the scene clears both regardless.
# no interruption in this scene: it is two people and three reserved lines. 18.7's
#           "one interruption per multi-character scene" is waived here by the reserve.

lines:
  - id:      M1.1.S03.010
    speaker: MARA
    voice:   mara
    tags:    [quietly]
    text:    "Thirteen."
    shot:    "CU Mara. Hand on his shoulder. She is not looking at him."

  - id:      M1.1.S03.020
    speaker: VOSS
    voice:   voss
    text:    "That's not enough."
    variants:
      pragmatist: "That's four of them if I don't miss."
      idealist:   "That's not enough."

  - id:      M1.1.S03.030
    speaker: MARA
    voice:   mara
    tags:    [pause]
    text:    "It was enough for the ones who had six."
    shot:    "She moves off. Camera stays on Voss."

