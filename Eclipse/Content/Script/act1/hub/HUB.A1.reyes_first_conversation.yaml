lines:
  - id:      HUB.A1.reyes_first_conversation.010
    speaker: REYES
    voice:   reyes
    text:    "Two plasma. I counted them on the ramp and I've counted them again down here."
    shot:    "Bunk row, late. Her kit is open on a bunk and the contents are laid out in rows. A hard-backed book sits closed on the blanket beside it."

  - id:      HUB.A1.reyes_first_conversation.020
    speaker: REYES
    voice:   reyes
    text:    "There was a conscript on that deck. Through the hip, still talking when the squad came off."

  - id:      HUB.A1.reyes_first_conversation.030
    speaker: REYES
    voice:   reyes
    text:    "What happened to him?"
    note:    "Her tic. She does not look up and she does not stop sorting. The question has no edge on it and there is no way for him to know that yet."

  - id:      HUB.A1.reyes_first_conversation.040
    speaker: VOSS
    voice:   voss
    text:    "Who's asking? You, or that book?"
    note:    "The obstacle in six words. He has decided the book is a charge sheet, which is a reasonable thing to decide."

  - id:      HUB.A1.reyes_first_conversation.050
    speaker: REYES
    voice:   reyes
    text:    "I am. The book keeps it."

  - id:        HUB.A1.reyes_first_conversation.060
    speaker:   VOSS
    voice:     voss
    condition: 'story.m11_conscript_choice == "finished"'
    text:      "One round. It's done."

  - id:        HUB.A1.reyes_first_conversation.070
    speaker:   VOSS
    voice:     voss
    condition: 'story.m11_conscript_choice == "left"'
    text:      "We walked. He was still talking."

  - id:        HUB.A1.reyes_first_conversation.080
    speaker:   VOSS
    voice:     voss
    condition: 'story.m11_conscript_choice == "bound"'
    text:      "Dressed, above the hip. Then we walked."

  - id:        HUB.A1.reyes_first_conversation.090
    speaker:   REYES
    voice:     reyes
    condition: 'story.m11_conscript_choice == "finished"'
    text:      "Then he doesn't go in the column for wounded. He goes in the other one."
    shot:      "She opens the book on her knee and writes for about four seconds. She does not look up at the end of it."
    note:      "NOT A VERDICT. It is a bookkeeping distinction between two columns, spoken by the person who has to keep both. She never says which column is which and nobody asks."

  - id:        HUB.A1.reyes_first_conversation.100
    speaker:   REYES
    voice:     reyes
    condition: 'story.m11_conscript_choice == "left"'
    text:      "Through the hip, in the open, and their relief cycles on the hour. That's an hour."
    shot:      "She writes. The pause before she writes is longer than the writing."
    note:      "NOT A VERDICT. A duration, arrived at from two facts the player heard in M1.1.S05.060 and .080. She does not say what an hour is like and she does not have to."

  - id:        HUB.A1.reyes_first_conversation.110
    speaker:   REYES
    voice:     reyes
    condition: 'story.m11_conscript_choice == "bound"'
    text:      "A dressing above the hip. Whoever tied it, tell them two fingers higher next time."
    note:      "NOT PRAISE. A correction to a knot, which is the only register in which this woman knows how to be pleased. Mara fixed the same knot in M1.1.S05.240 and said nothing about it either."

  - id:      HUB.A1.reyes_first_conversation.120
    speaker: VOSS
    voice:   voss
    text:    "You're writing it down."

  - id:      HUB.A1.reyes_first_conversation.130
    speaker: REYES
    voice:   reyes
    text:    "I write down what was done and who did it. Then I sleep."

  - id:      HUB.A1.reyes_first_conversation.140
    speaker: REYES
    voice:   reyes
    text:    "It lives in the kit and goes where I go. In a year it's the only place tonight is written down--"

  - id:         HUB.A1.reyes_first_conversation.150
    speaker:    VOSS
    voice:      voss
    interrupts: true
    text:       "Nobody asked you to keep that."
    note:       "FULL FOUR-AXIS COVERAGE, and the scene's only branch point for the player (18.7 interjection, L1-R18 precedent). Every version is the same objection - why is anybody keeping this - so the two words that follow answer all five and change meaning against each one."
    variants:
      pragmatist: "Nobody's paying you to carry that."
      idealist:   "Then all of it goes in. Not the half that reads well."
      personal:   "He gave a unit number four times and never a name."
      strategic:  "That book is a map of everybody in this vault."

  - id:      HUB.A1.reyes_first_conversation.160
    speaker: REYES
    voice:   reyes
    text:    "Someone should."
    shot:    "Her eyes come up to his on the two words and stay there. Then she closes the book and puts it under the folded shirt at the bottom of the kit, which is where it lives."
    note:    "THE TURN, in two words, and it is the only time the word appears in the file. She does not explain it, defend it, or offer him the book, here or in any later act. 8.2 (i): delivered with her eyes on Voss, not with her hands still - the first time she has looked up since he came down, which the notes at .030 and .090 are what make readable. The book goes away afterwards, so the look is the delivery and the task is the exit."

  - id:      HUB.A1.reyes_first_conversation.170
    speaker: REYES
    voice:   reyes
    text:    "Now, the thing you came down here for. Where does it hurt?"
    shot:    "She has already pulled a crate over for him to sit on. She does not wait to see whether he sits."
    note:    "Her tic again, and it ends the scene by revealing that he came to her for something he never said out loud. Enter late, leave early (18.7): no goodbye, no thanks, and he never answers."
