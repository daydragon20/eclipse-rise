# *** THE TIC IS INVERTED HERE, NOT REPEATED. ***
# 18.4 gives Brick "answers difficult questions by naming a dead soldier", and the M1.8
# writer spends that device in M1.8.S90 where the deflection finally runs out. This scene
# does the opposite and does it three missions earlier: HE ASKS FOR THE NAMES. He is not
# putting a name where a feeling should go; he is collecting other people's. Nothing in the
# file explains why, nobody asks, and the two lines that would explain it are omitted.
# .040 is four words and it is not even a question - he hands Voss a noun phrase and lets
# him work it out, which is why .050 exists.
#
# never first: 18.4 audited. Every Brick line here answers something Voss said.
# .010/.030:  Voss talking too much is the content of the first half. He offers bedding, then
#            rations, then a share, then the absence of anybody counting his food - four
#            things nobody asked for, to a man who has already made the bed. The joke, such
#            as it is, is 18.6's Brick joke: he tries least and wins.
# .060:      VOSS DOES NOT HAVE THE NAMES. That is the beat. The cell is a year older than
#            he is and two of its dead are already only Mara's to remember, which is the same
#            fact M1.8.S91.120 lands from the other side.
# .070:      one word, and it is an instruction from the man who never speaks first. The shot
#            is the whole payoff of the scene and it costs no words: he is already scratching
#            the two he has been given into the bunk frame with a punch. M1.8.S90.020 is that
#            punch, that hand and those letters, four missions later.
# eleven:    L1-R14 checked. Not used, and the bunks are not counted out loud.
# omitted:   why he wants them, what he does with them, any reaction from Voss, and any line
#            in which either man says the word dead. See report.

lines:
  - id:      HUB.A1.brick_bunk.010
    speaker: VOSS
