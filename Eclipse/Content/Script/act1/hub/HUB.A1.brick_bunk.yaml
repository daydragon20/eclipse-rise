    text:    "The end bunk's yours. There's blankets in the crate and Dex has a spare kit if you need anything else."
    shot:    "Bunk row. He is sitting on the bare frame with the bedding already squared at the foot of it, which he did an hour ago."

  - id:      HUB.A1.brick_bunk.020
    speaker: BRICK
    voice:   brick
    text:    "No."
    note:    "The obstacle in one word, as the stub asks. He does not look up and he does not soften it."

  - id:      HUB.A1.brick_bunk.030
    speaker: VOSS
    voice:   voss
    text:    "You're on the roster as of tonight. Rations, a share of what comes off the next run, and nobody counts what you eat."
    shot:    "Voss is still standing. There is nowhere in this row for a conversation to happen and neither of them moves to fix that."

  - id:      HUB.A1.brick_bunk.040
    speaker: BRICK
    voice:   brick
    text:    "The ones before me."
    note:    "*** THE TURN, AND THE TIC INVERTED. *** He does not answer a hard question with a name - he asks for names. Four words, not a question, and no explanation follows it here or ever."

  - id:      HUB.A1.brick_bunk.050
    speaker: VOSS
    voice:   voss
    text:    "Before you got here?"

  - id:      HUB.A1.brick_bunk.060
    speaker: VOSS
    voice:   voss
    text:    "Two I've got. The rest were before I came, and I'd have to ask Mara."
    note:    "VOSS DOES NOT HAVE THEM. The cell is older than he is and two of its dead are already only Mara's to remember - the same fact M1.8.S91.120 lands from the other side."

  - id:      HUB.A1.brick_bunk.070
    speaker: BRICK
    voice:   brick
    text:    "Ask."
    shot:    "There is a punch already in his hand. He turns to the underside of the bunk frame and starts scratching, and the letters are wrong and deep. The camera never gets close enough to read them. Voss watches for a second and then goes."
    note:    "One word, and it is an instruction from the man who never speaks first. The shot is the payoff and it costs nothing: this punch, this hand and these letters are M1.8.S90.020, four missions early."
