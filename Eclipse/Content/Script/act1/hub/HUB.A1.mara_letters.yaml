# *** THE LOAD-BEARING HUB SCENE OF ACT 1. ***
# 02_story_bible 2.5: Mara's recorded "letters to the next of us" appear through act 4.
# Without this scene those letters arrive out of nowhere in act 2, and M1.8.S91 is a
