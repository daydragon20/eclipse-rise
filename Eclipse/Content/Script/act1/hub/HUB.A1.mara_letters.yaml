lines:
  - id:      HUB.A1.mara_letters.010
    speaker: MARA
    voice:   mara
    text:    "Whoever gets this: the second pump has never once started on the first try. Hit the housing twice and wait--"
    shot:    "Map table, lamp off. She is sitting in the dark with the console turned away from the room, speaking into it. ELEVEN files in a column on the screen, on for about a second, and then her hand comes across it. CLEAN ROOM VOICE, not the compressed console playback M1.8.S91.090 asks for - the player is hearing one being made, not one being heard."
    note:    "She is recording, not replaying, and she kills it mid-word herself. It is a maintenance note, not a farewell, which is the whole reason the letters work in act 2."

  - id:      HUB.A1.mara_letters.020
    speaker: VOSS
    voice:   voss
    text:    "That was your voice."

  - id:      HUB.A1.mara_letters.030
    speaker: MARA
    voice:   mara
    text:    "Notes. For whoever has this table after us."
    note:    "What it is, in one sentence, per the stub. Deliberately NOT the four words - M1.8.S91.040 is where the player first hears the address they all carry."

  - id:      HUB.A1.mara_letters.040
    speaker: VOSS
    voice:   voss
    text:    "One door, four beds, three days. Somebody in that room should have said out loud whether that adds up."
    note:    "The K-77 question in his own register. One door is Dex (M1.7.S99.050), four beds is Reyes (.070), three days is hers (.140). He gives her the room back as arithmetic because he cannot ask it any other way."

  - id:      HUB.A1.mara_letters.050
    speaker: MARA
    voice:   mara
    text:    "The lamp stays off in here after the horns. It shows under the door."
    note:    "The deflection: he asks whether the raid adds up and she answers with a rule about a lamp. It is also the canon M1.8.S91.140 depends on, and it is five years of not being found, said as housekeeping."

  - id:      HUB.A1.mara_letters.060
    speaker: MARA
    voice:   mara
    text:    "We keep the rota on paper, on the board, where the whole room can see it. That one has been wrong since the mast came down."
    shot:    "She has not turned round. The console screen is still angled away from him and she has one hand flat on the cloth beside it."
    note:    "*** THE TURN. *** Same instruction as her first recorded letter (M1.8.S91.100), given out loud, four hours earlier, to a living person. She takes this turn WITHOUT letting him answer .050 - that is a woman closing a subject, and it is why the request lands with nothing between it and the refusal."

  - id:      HUB.A1.mara_letters.070
    speaker: VOSS
    voice:   voss
    tags:    [quietly]
    text:    "Right. I'll write it out."
    shot:    "PLAYER BEAT (18.7): he takes the old rota card off the board on his way past. The scene does not wait for him to; if he walks out, the card stays where it is."
    note:    "He does not ask the question again. One word of acceptance and a job taken, and the not-pressing is the whole of his half of this scene."

  - id:      HUB.A1.mara_letters.080
    speaker: MARA
    voice:   mara
    tags:    [pause]
    text:    "And leave the door."
    shot:    "He leaves it open. She does not put the lamp on. The console comes back up behind her before he is out of the corridor and the column of files is on it again. Story.Thread.MaraLetters_Open commits here."
    note:    "The domestic request the stub asked for, four words, unexplained, and nobody in the scene remarks on it. She told him ninety seconds ago that light shows under that door."
