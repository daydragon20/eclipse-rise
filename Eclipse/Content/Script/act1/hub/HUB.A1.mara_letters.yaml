# symmetry:  18.9 B - a two-hander of eight turns will alternate A-B-A-B unless somebody
#            doubles, and strict alternation past six turns is a listed structural failure.
#            MARA DOUBLES AT .050/.060, and the double is not a repair, it is the scene:
#            she refuses to answer and hands him the job in the same breath, without
#            leaving him a turn in between. Turn order M V M V M M V M.
#
# *** THE TURN IS THE WATER ROTA, AND IT IS NOT A NEW OBJECT. ***
# "Leave the light on" is the stub's placeholder for a domestic request that presumes a
# morning. The one already in canon is the water rota: M1.8.S91.090/.100 is Mara's first
# recorded letter and it is a housekeeping note to Reyes about keeping the rota on paper
# where everybody can see it. So the request she makes of Voss here is the same request
# she is making of the future on that console, four hours earlier and out loud, and the
# player who was in this room hears it twice. It costs no canon, no new prop and no line
# of explanation, and it is why she asks for something instead of answering him.
# The second half of the turn is .080 - four words, unexplained, and the only crack in
# the scene. She has just refused to say whether the raid is survivable and then asks him
# not to shut the door behind him.
# [L1 2026-08-01: said .090 twice in this block; the file ends at .080. Corrected in both
#  places. Same class as the L1-R29 defect - the lines were right and the comment lied.]
#
# *** THE LAMP IS OFF, AND THAT IS CANON I AM SERVING, NOT SETTING. ***
# M1.8.S91.140 (already written) has Voss say "She did them at this table. With the lamp
# off." That line only exists for the player who was here, so this scene has to BE that:
# lamp off, console screen turned away, one hand across it. .050 gives the reason as a
# security fact, in her mouth, as a deflection - three jobs from one flat sentence.
# ELEVEN:    L1-R14. The number is in the shot on .010 and in NO line of dialogue, per the
#            stub. M1.8.S91.020 is where it is spoken aloud, once, by Dex.
# mara:      pronoun audit - zero "you", zero "your", zero "I". Two "we"s (.030 "after us",
#            .070 "We keep"). AR-5 and AR-5b hold; nothing here spends anything.
#            .070 is a standard, not an order: she says what the cell does and lets him
#            pick the job up himself at .080. That is the mechanical separation from
#            Petra (L1-R9), whose whole tic is answering a question by ASSIGNING a task.
#            Mara hands over a plural; Petra hands over an imperative.
# voss:      three lines, twenty-eight words, and he asks the question once. .040 is the
#            K-77 question put the only way he can put it - as arithmetic - and the three
#            numbers in it are Dex's one door, Reyes's four beds and Mara's three days
