lines:
  - id:      HUB.A1.brick_the_tithe.010
    speaker: VOSS
    voice:   voss
    text:    "You said that number at the cars like it came off a manifest. Exact, and kept."
    shot:    "Bunk row, late, the night the vault filled up. He is sitting on the end frame with a can between his boots and a stack of tin cups beside him, and there are fewer cups in the stack than there were an hour ago. Voss has been standing there a while."
    note:    "THE WANT, and it is a measurement rather than a question (8.3). He heard a number delivered the way a document delivers one, and he prices it in two words: exact means somebody was counting, kept means somebody is still carrying it. The numeral itself is never spoken - M1.6.S03.220 owns it. An earlier draft closed on 'Somebody counted.' and I cut it: M1.6.S99.060 gives Dex 'Somebody counted that twice' in the debrief of the mission that opens this gate."

  - id:      HUB.A1.brick_the_tithe.020
    speaker: BRICK
    voice:   brick
    text:    "It stays in the car."
    shot:    "He fills the cup in his hand and sets it with the ones that are already full."
    note:    "REFUSAL ONE, and it is not a deflection - he offers no other subject, no fact about rolling stock, nothing to follow up. He answers where the thing is kept instead of what it is. Five words, no lie in any of them (18.4)."

  - id:      HUB.A1.brick_the_tithe.030
    speaker: VOSS
    voice:   voss
    text:    "More marks on that frame than this cell has lost."
    shot:    "The underside of the bunk above him is scratched over in letters that are wrong and deep. Voss is counting them, not reading them."
    note:    "THE SECOND ASK, and it is a count against a count rather than a repeat (8.3). It fixes no number, states no head count, and stands on its own: the frame is in the shot. The old .030 - 'That isn't what I asked.' - is gone; mara_map_table.020 has that line and got there first."

  - id:      HUB.A1.brick_the_tithe.040
    speaker: BRICK
    voice:   brick
    tags:    [pause]
    text:    "That frame isn't for reading."
    shot:    "He does not look up and he does not stop. Voss stands there for the length of one breath and goes. On the way out the bunk row opens onto the vault floor, and there is a full tin cup on the ground beside every person lying on it, and none of them were there this morning. LAST IMAGE: the floor and the cups. Neither man is in it."
    note:    "*** REFUSAL TWO, AND THE SLOT WHERE A NAME WOULD GO IS LEFT EMPTY. *** Voss has just counted marks that are names; the man whose whole device is naming the dead says nothing, so the tic survives intact into M1.8.S90.050. He shuts the object rather than the subject, which is a door with no handle on Voss's side. HEAVIEST LINE - it keeps the stillness (8.2 (i)), one of five permitted, because here the refusal and the image are the same thing. The payoff is M1.6.S01.140 done instead of said, and nobody connects it out loud."
