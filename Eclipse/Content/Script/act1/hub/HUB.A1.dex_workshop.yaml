lines:
  - id:      HUB.A1.dex_workshop.010
    speaker: DEX
    voice:   dex
    text:    "So it's half a day dark. Once. And after that the heaviest thing down here is standing on rock."
    shot:    "Workshop, two nights after the mast. Seven ration cards on the bench in two rows, drawn on both sides in grease pencil. Mara is holding one of them. Dex put another in Voss's hands on the way past and has not looked at him since."
    note:    "THE SCENE OPENS ON THE SECOND HALF OF A SENTENCE. He is finishing an argument, not starting a conversation. One card, one cost, and the beginning of the slot system arrives as the thing the cost buys."

  - id:      HUB.A1.dex_workshop.012
    speaker: MARA
    voice:   mara
    text:    "People are above ground tonight. That machine is the light we come back to."
    shot:    "She holds the card at arm's length, the way she holds a manifest, and reads the whole of it before she says anything."
    note:    "She rules on the one card, and the ground is tomorrow. Two short declaratives, one 'we' where anyone else would say 'I' (18.4). Zero 'you', zero 'your', zero 'I' - AR-5b intact. She is not unkind: she read the card first."

  - id:      HUB.A1.dex_workshop.014
    speaker: DEX
    voice:   dex
    text:    "Six more behind that one. Look at all of it first."
    note:    "THE WANT, said once and never again. He is not asking for a vote on the plan - he is asking her not to rule on one seventh of it. This is the only line in the file where he asks anybody for anything."

  - id:      HUB.A1.dex_workshop.016
    speaker: MARA
    voice:   mara
    text:    "Nothing on that bench feeds anybody this week."
    note:    "She refuses the stack without opening it, and she gives no reason past this week because she has not got one. This is the uninteresting wrongness 18.9 D asks for, and it is also completely correct."

  - id:      HUB.A1.dex_workshop.018
    speaker: MARA
    voice:   mara
    text:    "The cards keep."
    shot:    "She sets the card back on the stack, square, and goes. She does not hand it to him and she does not take it with her. Out before he answers."
    note:    "SHE WINS BY LEAVING. Three words, and they are almost kind - paper does not spoil, so the plan will still be there. Said in her own unit: she is a woman who knows what keeps and what does not."

  - id:      HUB.A1.dex_workshop.020
    speaker: VOSS
    voice:   voss
    text:    "There's a wall on this card that isn't in the room."
    shot:    "He turns over the card he has been holding since before the row started."
    note:    "REBUILT to the 8.3 test - the old line was 'What am I looking at?', which is 'Go on' with a question mark. He measures the object in his hands against the room he is standing in and finds a wall that does not exist yet. Nobody says the word plan. He does not mention Mara, then or ever."

  - id:      HUB.A1.dex_workshop.030
    speaker: DEX
    voice:   dex
    text:    "One machine, and it coughs. Everything on that bench makes it worse."
    shot:    "Second card down, left of the first."
    note:    "ENERGY. 05_base_building 5.2's generator that coughs. Short, because the row already put the machine in front of the player - he names the constraint instead of explaining it, which is what a man says after he has lost the argument about it."

  - id:      HUB.A1.dex_workshop.040
    speaker: DEX
    voice:   dex
    text:    "Four places in this floor are rock and not fill. Four."
    shot:    "He kicks the floor twice in two different places and it sounds like two different floors."
    note:    "SLOTS. Act 1 has four (5.2). The old third sentence - 'Everything heavy has to stand on one of them' - is GONE, because .010 has to say what half a day dark buys and what it buys is rock. Scarcity is now geology and the rule is never spoken."

  - id:      HUB.A1.dex_workshop.050
    speaker: VOSS
    voice:   voss
    text:    "What's on the four now?"

  - id:      HUB.A1.dex_workshop.060
    speaker: DEX
    voice:   dex
    text:    "Bunks, table, generator, and a bench I made out of a door."
    note:    "OCCUPANCY, flat. The one enumeration in the scene (18.9 B). Everything in this vault is made out of a door, including the thing Reyes lays people on, and nobody says that either."

  - id:      HUB.A1.dex_workshop.070
    speaker: DEX
    voice:   dex
    text:    "Bench comes off first. Room goes there with a door, and she stops treating people on the floor."
    shot:    "Third card down. His hands stop on the bench and stay there for the whole line. He is looking at Voss."
    note:    "MEDBAY, out of his own slot, for somebody else, without one word about why. He names no feeling and does not name her. HEAVIEST LINE IN THE FILE - delivered with the hands still and the eyes on Voss (8.2 (i)); this file is not permitted the stillness of the eyes. The closing makes this line private. *** L1-R54, WRITER ACTION, ONE WORD: the referent of `she` must be unambiguous the moment it is heard. Form A put Mara on stage six lines up and she is the freshest female referent in the room, which she was not when this line was written. Insert one word before `she` - a bare role noun sits inside Dex's article-dropping fingerprint - and change nothing else. NO NAME, NO REASON, NO REACTION. The line already identifies her by function; what it withholds is why, and that stays withheld."

  - id:      HUB.A1.dex_workshop.080
    speaker: VOSS
    voice:   voss
    text:    "That's your bench--"

  - id:         HUB.A1.dex_workshop.090
    speaker:    DEX
    voice:      dex
    interrupts: true
    text:       "Bench is a door on two drums. I'll steal another door."
    note:       "Comic beat 1 of 2, and it is a deflection: he kills a sentence about himself by explaining what the furniture is made of. Third time in the act he does this. First joke in the file, and it arrives after the row rather than over it."

  - id:      HUB.A1.dex_workshop.100
    speaker: DEX
    voice:   dex
    tags:    [amused]
    text:    "And when there's steel, a stair wide enough for a vehicle. Not this year. Not ever, probably."
    shot:    "He goes into his kit for three more cards and lays them out fast, like he is dealing."
    note:    "Comic beat 2 of 2. It is the Hangar (5.3.1), asked for in a damp vault by a man who prices it himself at never. He is funniest describing what he will not be allowed to build."

  - id:      HUB.A1.dex_workshop.110
    speaker: DEX
    voice:   dex
    text:    "A week where nobody needs me. And forty kilos of plate."
    note:    "BUILD COST, priced by the person who pays it, as a materials problem because that is the only way he can say it. Twenty minutes ago somebody needed him and said so on her way out the door. No line in the file connects those two facts."

  - id:      HUB.A1.dex_workshop.120
    speaker: VOSS
    voice:   voss
    text:    "How many cards is that?"
    shot:    "PLAYER BEAT (18.7): the cards are on the bench and the player can walk the length of them or walk out. Dex does not stop talking either way."

  - id:      HUB.A1.dex_workshop.130
    speaker: DEX
    voice:   dex
    text:    "Seven."
    shot:    "Laid out edge to edge under the lamp they are a floor plan, and it is the base the player will spend four acts building. Somebody crosses the workshop towards the bunks with a rifle on the sling, not stopping, not looking. Dex has all seven off the bench and into his kit before they reach the lamp. The bench is bare again."
    note:    "One word, and then the plan is covered. He has shown this to one person and he puts it away for a stranger's footsteps. That is what makes .070 private, and no line remarks on it."
