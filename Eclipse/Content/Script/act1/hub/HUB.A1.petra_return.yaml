# *** THE PRONOUN REGEX, WHOLE-FILE. ***
# Zero occurrences of "you" or "your" in any text: field in this file - hers AND his. The
# M1.8.S04 writer held the same line across a whole scene and the reasoning carries: the word
# stays scarce around this woman, so nothing anybody says near her competes with Mara's one
# use of it in M1.8.S08. Voss's five lines are built round it without strain ("There's a
# bunk", "Nobody's asking"), which is the test that it is not a cage.
# Petra additionally uses no "I" and no "we", names nobody, and never once uses his name or a
# callsign (L1-R10). SCOPE: text: fields. This comment block uses the words in prose.
#
# *** BRICK vs PETRA, DEMONSTRATED. ***
# He hands you a noun, she hands you a verb (18.4). Every one of her seven lines opens on a
# verb or lands on one - Fill, Take, Go and look, Get the salt, Stir it, Roll the sleeves -
# and the one line that starts with a noun (.090) turns into an instruction inside four
# words. Read .070 against M1.8.S09.110 ("Coats."): same length, same room, and neither is
# deliverable by the other person.
#
# the tic:   fires three times and never as a refusal. .030 answers an offer of a bed with
#            three people at the far end. .070 answers a sentence he cannot finish with the
#            salt shelf. .090 answers his last attempt at making her stop by handing her the
#            largest job in the room.
# .060/.070: 18.7's required interruption, and it is the whole scene. He starts the only
#            emotional sentence either of them attempts and she cuts it off with a condiment.
