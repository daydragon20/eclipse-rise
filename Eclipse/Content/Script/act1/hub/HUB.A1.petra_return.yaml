lines:
  - id:      HUB.A1.petra_return.010
    speaker: PETRA
    voice:   petra
    text:    "Water line runs dry at the second horn. Fill everything before then."
    shot:    "The corner of the vault that has become a kitchen because she stood in it. A pot, a burner, two crates and a queue that has not formed yet."
    note:    "Her first line back in the base is a task, and it is about a pipe. She has been here under a day and already knows the shift horns."

  - id:      HUB.A1.petra_return.020
    speaker: VOSS
    voice:   voss
    text:    "There's a bunk behind the gallery with nobody in it."
    note:    "The want, and he never states it more directly than this. No second person anywhere in it."

  - id:      HUB.A1.petra_return.030
    speaker: PETRA
    voice:   petra
    text:    "Three at the far end have not eaten since the ramp. Take a bowl to each."
    note:    "THE TIC. An offer of a bed comes back as three people and a job. The ramp is M1.8.S09 and she does not say the word K-77."

  - id:      HUB.A1.petra_return.040
    speaker: VOSS
    voice:   voss
    text:    "Reyes has a list of who's eaten."

  - id:      HUB.A1.petra_return.050
    speaker: PETRA
    voice:   petra
    text:    "The list has them fed. Go and look."

  - id:      HUB.A1.petra_return.060
    speaker: VOSS
    voice:   voss
    text:    "Nobody expected any of this. When the lift came up I thought--"
    note:    "The only emotional sentence either of them attempts, and he does not get to the end of it. Nobody in this game finishes that sentence."

  - id:         HUB.A1.petra_return.070
    speaker:    PETRA
    voice:      petra
    interrupts: true
    text:       "Get the salt. Shelf above the pipe."
    note:       "18.7's required interruption, and it is the fingerprint doing the work. She does not refuse the sentence, disapprove of it or acknowledge it - she gives his hands something else. Verb first: Brick would have said 'Salt.'"

  - id:      HUB.A1.petra_return.080
    speaker: VOSS
    voice:   voss
    text:    "Nobody's asking for any of this tonight."

  - id:      HUB.A1.petra_return.090
    speaker: PETRA
    voice:   petra
    text:    "Second pot on the burner. Stir it, and do not let it catch."
    note:    "THE TIC, third firing, and it is the turn arriving: his last attempt at stopping her is answered with the biggest job in the room."

  - id:      HUB.A1.petra_return.100
    speaker: VOSS
    voice:   voss
    text:    "How long?"
    shot:    "He has taken the spoon. Neither of them remarks on it and the camera does not hold on either face."
    note:    "*** THE TURN, IN TWO WORDS. *** He stops trying to make her rest and asks how long to stir a pot. That is the stub's 'that is how they both survive the week', written as a question about cooking."

  - id:      HUB.A1.petra_return.110
    speaker: PETRA
    voice:   petra
    text:    "Until it stops smelling like water."

  - id:      HUB.A1.petra_return.120
    speaker: PETRA
    voice:   petra
    text:    "Roll the sleeves. Both, above the elbow."
    shot:    "She says it going past him with the bowls. She does not touch him and she does not stop. Last line of the scene; hold on the pot."
    note:    "A woman rolling up a grown man's sleeves in her kitchen without touching him and without saying so. No thanks are offered and none would be accepted. Nothing that was done to her is named, here or in any later act."
