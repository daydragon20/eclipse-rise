lines:
  - id:      HUB.A1.petra_return.010
    speaker: PETRA
    voice:   petra
    text:    "Water line runs dry at the second horn. Fill everything before then."
    shot:    "The corner of the vault that has become a kitchen because she stood in it. A pot, a burner, two crates and a queue that has not formed yet. HIS ANSWER: he sets a folded blanket on the empty crate beside her and pushes it an inch towards her. That is all he came to say and he does not say it."
    note:    "Her first line back in the base is a task, and it is about a pipe. She has been here under a day and already knows the shift horns. The blanket is the entire want (18.7) and it costs no words."

  - id:      HUB.A1.petra_return.030
    speaker: PETRA
    voice:   petra
    text:    "Three at the far end have not eaten since the ramp. Take a bowl to each."
    shot:    "HIS ANSWER: he takes the blanket back off the crate, tucks it under his arm, and lifts Reyes's tally board off its nail so she can see the marks on it."
    note:    "THE TIC. A bed comes back as three people and a job. The ramp is M1.8.S09 and she does not say the word K-77. He answers a task with a document, which is the most his side of the family can manage."

  - id:      HUB.A1.petra_return.050
    speaker: PETRA
    voice:   petra
    text:    "The list has them fed. Go and look."
    shot:    "She does not read the board. HIS ANSWER: he goes. He comes back a long minute later with three empty bowls, sets them down, stops in front of her and starts to put a hand on her arm."
    note:    "She overrules a written record with a look, in eight words. Better than the old version, where she was refuting a sentence: a tally board that is wrong is a picture, and nobody has to say what it means about who is doing the counting."

  - id:      HUB.A1.petra_return.070
    speaker: PETRA
    voice:   petra
    text:    "Get the salt. Shelf above the pipe."
    shot:    "HIS ANSWER: the hand never lands. He goes to the shelf above the pipe, comes back with the salt, and then does not hand it over, standing between her and the queue with it in his fist."
    note:    "18.7's required interruption, carried by staging under the L1 exemption - the hand never lands. She does not refuse the gesture, disapprove of it or acknowledge it; she gives his hands something else. Verb first: Brick would have said 'Salt.' THE STAGING NOW SITS ON THIS LINE. It used to live under .090, so this was the one Petra line in the file with no `shot:` at all - correct in content, hanging under the wrong id, and in breach of the contract that EVERY Petra line is answered by a movement. Nothing was rewritten; the sentence moved up one line and split in two."

  - id:      HUB.A1.petra_return.090
    speaker: PETRA
    voice:   petra
    text:    "Second pot on the burner. Stir it, and do not let it catch."
    shot:    "She takes the salt out of his fist on her way past without breaking step. HIS ANSWER, AND IT IS THE PLAYER'S - PLAYER BEAT (18.7): the spoon is lying across the second pot and she is already three crates down the line. This is the scene's only input and it is a hand, not a sentence."
    note:    "*** THE TIC, THIRD FIRING, AND IT IS THE TURN ARRIVING. *** His last attempt at stopping her is answered with the biggest job in the room, and the player performs the answer. The stub's 'that is how they both survive the week', written as a cooking instruction."

  - id:      HUB.A1.petra_return.095
    speaker: PETRA
    voice:   petra
    text:    "Lower the flame."
    shot:    "HIS ANSWER: he turns the burner down and looks up from the pot. Once."
    note:    "The smallest line in the file and the only moment she looks at what he is doing instead of at what needs doing. Three words. It is also the whole of the spread now that 'How long?' is retired."

  - id:      HUB.A1.petra_return.110
    speaker: PETRA
    voice:   petra
    text:    "Until it stops smelling like water."
    shot:    "He has asked nothing. He is still looking at her."
    note:    "SHE ANSWERS A QUESTION HE NEVER ASKS. He looked up from the pot once and she read it off him. 18.4 at full strength, and the only place in act 1 where somebody knows this man without making him speak. Nothing in the file marks it."

  - id:      HUB.A1.petra_return.120
    speaker: PETRA
    voice:   petra
    text:    "Roll the sleeves. Both, above the elbow."
    shot:    "She says it going past him with the bowls and is out of frame before the last word. No hand on his shoulder. HOLD ON VOSS: the burner, the spoon, both sleeves going up above the elbow, alone in the corner she made."
    note:    "A woman rolling up a grown man's sleeves in her kitchen without touching him and without saying so. No thanks are offered and none would be accepted. Nothing that was done to her is named, here or in any later act. The camera stays with him (8.2 (ii)), which it is allowed to do exactly once in the twelve."
