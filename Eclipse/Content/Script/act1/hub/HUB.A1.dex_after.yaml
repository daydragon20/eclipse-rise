# .040 is Voss offering help. .050 is one word. Across act 1 Dex has answered
# a thank-you with a maintenance task (M1.1.S06.230), conceded an idea while refusing to
# say it twice (M1.2.S99.210), and abandoned two sentences about himself inside the
# sentence (M1.3.S06.230, M1.8.S91.050). He has never taken anything from anybody. He
# takes this, in one syllable, and neither of them remarks on it.
# The three tool lines after it are not filler and they are not a joke: they are the help
# happening. He starts using him inside four seconds, which is the only way this character
# can accept company. The scene ends on the third tool name and no line closes it.
#
