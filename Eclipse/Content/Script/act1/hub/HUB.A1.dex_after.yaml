lines:
  - id:      HUB.A1.dex_after.010
    speaker: DEX
    voice:   dex
    text:    "Cord's gone hard behind the switch."
    shot:    "Workshop, an hour that is not a time. The map-table lamp is in pieces on the bench under a hand torch - shade off, cord out, the switch body in a tin lid. It is the only thing he has touched since they came back."
    note:    "He states a fault. It is a real fault and it has been there for a year, and none of that is why he is doing this at this hour."

  - id:      HUB.A1.dex_after.020
    speaker: VOSS
    voice:   voss
    text:    "That was working--"
    note:    "The obstacle, spoken once, in three words, and nobody returns to it."

  - id:         HUB.A1.dex_after.030
    speaker:    DEX
    voice:      dex
    interrupts: true
    text:       "It cracks when it turns, and the day it stops turning nobody in here has a light over that map."
    shot:       "He does not look up. The oilcloth is on the table behind them in the dark with K-77 still marked on it high up in the clean part."
    note:       "The only reason he gives, and it is a maintenance argument. It is also the whole scene. He would deny the second reading and nobody offers it to him."

  - id:      HUB.A1.dex_after.040
    speaker: VOSS
    voice:   voss
    text:    "Want a hand with it?"
    shot:    "PLAYER BEAT (18.7): the offer is the player's move. If he walks out instead, Dex is still at the bench when he next comes down."
    note:    "A yes-or-no question, which is the only shape of offer this man has ever been able to answer."

  - id:      HUB.A1.dex_after.050
    speaker: DEX
    voice:   dex
    text:    "Yes."
    shot:    "He moves a tin lid six inches to make room at the bench. That is the entire acknowledgement."
    note:    "*** ONE WORD, AND IT IS THE SCENE. *** He has not taken anything from anybody in the whole act. Nobody remarks on it, here or ever."

  - id:      HUB.A1.dex_after.060
    speaker: DEX
    voice:   dex
    text:    "Small driver. The cross head."
    note:    "Tool name 1 of 3. The help starts inside four seconds, because being useful to him is the only way in."

  - id:      HUB.A1.dex_after.070
    speaker: DEX
    voice:   dex
    text:    "Flux, and then hold it there."
    note:    "Tool name 2 of 3. Two men and one pair of hands too few, which is what the scene is about and what it never says."

  - id:      HUB.A1.dex_after.080
    speaker: DEX
    voice:   dex
    text:    "Wire. The blue spool, not the grey."
    shot:    "Voss finds the spool. Neither of them says anything else. The lamp is still in pieces when the shift horns go, and it is still in pieces the next time the player comes down."
    note:    "Tool name 3 of 3, and the scene ends on it. No closing line, no beat where either of them looks at the other. He is not finishing it tonight and he is not going to bed."
