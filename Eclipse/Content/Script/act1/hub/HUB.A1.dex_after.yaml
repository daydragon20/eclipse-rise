# pieces on the bench is the light that was over the map every time she marked it.
# IT WORKS. The switch cracks when it turns and it has cracked for a year. He is repairing
# a fault that is not one, at an hour that is not a time, and .030 is the only reason he
# gives - if the switch ever fails there is no light over that map. That sentence is a
# maintenance argument and it is also the entire scene, and nobody in the room hears it as
# anything else, including him.
#
