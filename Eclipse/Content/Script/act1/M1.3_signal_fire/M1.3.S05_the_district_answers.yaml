# ---- header ----
scene:        M1.3.S05
mission:      M1.3
title:        "The District Answers"
act:          1
location:     "Kessara / Foundry District / Transit Checkpoint"
type:         in-mission-radio
credit_tier:  2

# ---- the three-sentence contract (18.7) ----
want:         "Get out through a district that has just discovered it is being attacked."
obstacle:     "For the first time the Dominion is not policing them; it is hunting them."
turn:         "Voss recognises a shoulder plate in the response line and keeps moving anyway."

# ---- state ----
status:       draft
critic:       "NO-GO: .150 zegt Nine one seven terwijl L1-R36 het kenteken op two six one heeft vastgelegd; de L2-notitie op r.50 gaat mee. Alles verder schoon"
words:        130

# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.3.md ----
# cast:      VOSS, MARA, DEX, fighters; Enforcer response (barks)
# flags-in:  Story.Thread.Enforcer_BadgeHeld
# flags-out: none
# beats:     1) alarm tones, gates closing, people running indoors
#            2) the response - Enforcers, pacification walkers in the distance
#               (03_world_design 3.3)
#            3) THE BADGE. One line, two at most: Voss sees the plate he knows from the
#               ration line. He says nothing to the others, or exactly four words.
#            4) the withdrawal
#
# *** THE ENFORCER DOES NOT DIE HERE. ***
# 2.11 keeps this thread open to a final personal choice at the end of the campaign.
# This is the only time in act 1 the player sees him alive. Writing him dead closes a
# thread the bible holds open for a hundred hours. Forbidden.
#
# writer:    lines under fire use the CALLOUT band (2-6 words). The badge line is the
#            exception and it is still short.

# ---- dialogue-writer notes (L2) ----
# enforcer: he does not speak, he does not die, and he is never named. He is a three-digit
#           number in somebody else's mouth for one line. .150/.170 are all he gets.
#           NOT GATED ON Q-2: Voss knows the plate from standing in the ration line
#           (02.9 prologue), not from holding the badge. So the beat plays whether or not
#           the owner approves recap card 3, and Story.Thread.Enforcer_BadgeHeld is read
#           nowhere in this file. That is deliberate - the thread should not depend on an
#           open owner question to be touched at all.
# four:     .170 is exactly four words, as the stub allows, and it is the second half of
#           a refusal. Mara does not turn round. Nobody asks him again.
# number:   plate spoken as three digits, matching the convention already in the script -
#           M1.1.S05's conscript recites "Four six two". NEW DETAIL: the number 917 is
#           mine. If M1.2's writer or the recap card gives this man a different number,
#           L1 reconciles and I change .150. Flagged rather than assumed.
# dominion: .045-.080 are the panic vocabulary the beat sheet asks for - procedure going
#           short of breath. Reads the formula, calls a sector, calls it again, gets an
#           answer that is not a procedure, and asks for the procedure back. 18.5 rule 5,
#           in five lines. No Veil vocabulary anywhere: there are no Veil operatives on
#           this street until M1.7.
#
# *** .045 ADDED 01-08. THE PROCEDURE HAD NO BASELINE, WHICH IS WHY THIS SCENE WAS RED. ***
# .080 "Say again procedure" asks for words the player has never heard. The net was
# breaking against nothing, so 18.5 rule 5 fired silently - the same failure L1-R22 found
# in Reyes's contractions, and the same fix: voice the un-broken version once, in the same
# mouth, minutes before it breaks. CONSCRIPT_A now runs the whole arc alone: formula
# (.045) -> calls nine (.050) -> "Anyone" (.060) -> asks for the words back (.080).
# It also puts the gates on the record as DELIBERATE - "down by order" - one line after
# Ember reads them as a reflex, and "starting at one" says he had counted to nine before
# anybody failed to answer. The district answering is the enemy being GOOD at this for
# ten seconds, which is the beat this scene is named after and the contrast T4 needs.
# NOT an officer: `dominion_officer` is uncast (Q-3/Q-4/Q-5) and would fail VOICE. One
# conscript doing procedure and then losing it is the better scene anyway.
# type:     NOT escalated, and I looked. BEATS_M1.3 section 4 types this scene
#           `in-mission-radio + callout`; `type:` holds one value, so the radio half owns
#           the header and the street half sits well under its ceiling. Re-typing to
#           `callout` (2-6) would put .020 (8 w) and .120 (7 w) RED on CEILING, which is
#           the header type telling the truth about the scene.
# no band:  the street lines carry no `band:` override on purpose. They are all inside the
#           25-word ceiling already, so an override would buy nothing and hide them from a
#           check they pass. The register belongs to the radio half, and .045 is it.
# under-   this is the mission where the Dominion answers in full, on purpose. The thin
# reaction: response of M1.2/M1.5/M1.7 only reads as a detail if this night reads as an
#           avalanche. Two walkers, every gate, every shutter.
# band:     `in-mission-radio` (10-25). The street is at the stub's callout length and the
#           radio is at the band's own, which is what a mixed scene sounds like. Ceiling
#           respected everywhere; .045 is the one line that uses the register.
# variance: 1 w (.160 "What?") to 21 w (.045) = 21x.
# em-dash:  one, at .180/.190. Rate 1:28.
# recount:  the old note claimed 9 w for .020 and the old `words` said 110. Both were one
#           over: .020 is 8, the file was 109. Now 130, hand-counted (no shell here).

lines:
  - id:      M1.3.S05.010
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    tags:    [urgent]
    text:    "Gates. All of them at once."
    shot:    "Alarm tones climb the district in sequence, block by block, a note higher each time. Every checkpoint gate on the row comes down together."

  - id:      M1.3.S05.020
    speaker: DEX
    voice:   dex
    text:    "That's not the mast. That's the whole checkpoint."

  - id:      M1.3.S05.030
    speaker: MARA
    voice:   mara
    text:    "West. The ring is shut."

  - id:      M1.3.S05.040
    speaker: VOSS
    voice:   voss
    text:    "West."

  - id:      M1.3.S05.045
    speaker: CONSCRIPT_A
    voice:   dominion_conscript_a
    text:    "All stations, Foundry District. The gates are down by order. Hold where you stand and report by sector, starting at one."
    shot:    "Picked up on the squad set, flat and unhurried, over four people moving west along a wall."
    note:    "The formula, correct and complete, from the mouth that loses it at .060 and asks for it back at .080. Not exposition: it is the only ten seconds in the mission where the Dominion is good at this."

  - id:      M1.3.S05.050
    speaker: CONSCRIPT_A
    voice:   dominion_conscript_a
    text:    "Sector nine. Sector nine, respond."

  - id:      M1.3.S05.060
    speaker: CONSCRIPT_A
    voice:   dominion_conscript_a
    tags:    [nervous]
    text:    "Anyone on nine. Anyone."

  - id:      M1.3.S05.070
    speaker: CONSCRIPT_B
    voice:   dominion_conscript_b
    text:    "Nine is on the ground."

  - id:      M1.3.S05.080
    speaker: CONSCRIPT_A
    voice:   dominion_conscript_a
    text:    "Say again procedure. Say again."
    note:    "18.5 rule 5: the Dominion conscript vocabulary breaking down under load. He asks for the words back, not for help."

  - id:      M1.3.S05.090
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    tags:    [shouting]
    text:    "Walker on the avenue."

  - id:      M1.3.S05.100
    speaker: DEX
    voice:   dex
    text:    "They don't send walkers for us."

  - id:      M1.3.S05.110
    speaker: MARA
    voice:   mara
    text:    "They did."
    note:    "The whole price of the mission in two words. Nobody elaborates and nobody is allowed to."

  - id:      M1.3.S05.120
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Shutters. All the way down the row."
    shot:    "Every shopfront on the row rolling down at once. Somebody hauls a child in by the wrist and the shutter comes down behind them."

  - id:      M1.3.S05.125
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Third shutter. That's my mother's."
    note:    "18.5 rule 5: Eclipse fighters sound improvised and personal where the Dominion sounds procedural. It also makes .130 an order given over somebody's family, and nobody answers it."

  - id:      M1.3.S05.130
    speaker: VOSS
    voice:   voss
    text:    "Leave them shut."

  - id:      M1.3.S05.140
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Second walker. Behind the first."

  - id:      M1.3.S05.150
    speaker: VOSS
    voice:   voss
    text:    "Nine one seven."
    shot:    "A response line forming across the avenue, sodium light on their backs. Voss is half a step slow for the length of one man's shoulder plate."
    note:    "THE BADGE. He is not named, he does not speak, and he does not die - 02.11 holds this thread to the end of the campaign."

  - id:      M1.3.S05.160
    speaker: DEX
    voice:   dex
    text:    "What?"

  - id:      M1.3.S05.170
    speaker: VOSS
    voice:   voss
    text:    "Nothing. Left side, go."
    shot:    "Mara does not turn round. Nobody asks him again tonight."
    note:    "Exactly four words after the refusal, per the stub. No axis variants here - S01/S04/S99 hold this mission's variant budget (C-6)."

  - id:      M1.3.S05.180
    speaker: DEX
    voice:   dex
    text:    "There's a stair at the--"

  - id:         M1.3.S05.190
    speaker:    VOSS
    voice:      voss
    interrupts: true
    text:       "Take it."

  - id:      M1.3.S05.200
    speaker: MARA
    voice:   mara
    text:    "Between the shutters. Single file."

  - id:      M1.3.S05.210
    speaker: CONSCRIPT_A
    voice:   dominion_conscript_a
    tags:    [shouting]
    text:    "They're in the row. They're in the row."

  - id:      M1.3.S05.220
    speaker: MARA
    voice:   mara
    tags:    [shouting]
    text:    "Down."
    shot:    "A walker lamp sweeps the row above their heads, slow, methodical, the way a thing looks when it has all night."

  - id:      M1.3.S05.230
    speaker: MARA
    voice:   mara
    text:    "Count."

  - id:      M1.3.S05.240
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Four."

  - id:      M1.3.S05.250
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "Five with the case."

  - id:      M1.3.S05.260
    speaker: DEX
    voice:   dex
    text:    "The case counts."

  - id:      M1.3.S05.270
    speaker: MARA
    voice:   mara
    text:    "Go."
