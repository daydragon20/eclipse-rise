scene:        M1.3.S02
mission:      M1.3
title:        "The Anniversary"
act:          1
location:     "Kessara / Foundry District / Relay Mast"
type:         ambient
credit_tier:  2

# ---- the three-sentence contract (18.7) ----
want:         "Four people want to cross a lit plaza that is currently broadcasting to itself."
obstacle:     "The mast is mid-address and the plaza is full of people standing still to listen, because standing still is what you do."
turn:         "The address ends, the curfew tone empties the plaza, and the cell walks in behind the last of the crowd."

# ---- state ----
status:       draft
critic:       null
words:        139

# ---- story-architect notes (L1) — see phase0/beats/BEATS_M1.3.md ----
# cast:      VOSS, MARA, DEX, fighters · VEX (recording, loudspeakers)
# flags-in:  none
# flags-out: Story.Clue.BlightBroadcast  (NEW TAG - systems task)
#
# *** P1-a. PLANT FOR TWIST 1 (the Blight was engineered), and it is free. ***
# The player hears the final antagonist defend his own crime sixty hours before learning
# it was a crime. Rules:
#   - Vex defends THE DOMINION, not the Blight. He cites the Blight as a disaster that
#     happened, exactly as everyone in the Expanse believes.
#   - No character responds to the content. They respond to the volume.
#   - THREE LINES. He is wallpaper with a voice. Give him more and he is a character in
#     hour eight, and act 4 has nothing left.
#   - NOT an oration (AR-7 - only four exist in the game, all reserved for acts 3-4).
#     Lines stay inside the ambient/cutscene band.
#   - His 19.3 signature line ("Before us, one in nine children on Meridia...") is
#     RESERVED for act 4. Write new copy in the same register.
#
# beats:     1) the plaza: white-gold light, people listening the way you listen when not
#               listening is conspicuous
#            2) the recording
#            3) one reaction from the cell - short, flat, somebody who has heard this all
#               his life
#            4) the curfew tone; the plaza empties
#            5) in
# writer:    Vex never raises his voice and never says "I" - he says "one" (18.4).

# ---- dialogue-writer notes (L2) ----
# THREE Vex lines exactly. .050, .070, .090. No fourth, no tail, no answer.
# vex:      never "I" - "one" twice in .050. Longest sentences in the scene by a factor of
#           five. Amplified, never raised. He defends the ORDER and calls the Blight a
#           thing that happened. Casualty statistic as comfort in .070, per his tic.
#           .090 is the confession the player cannot hear yet: he describes a price and a
#           ledger and nobody in the plaza is asked to read it. In act 4 that line is a
#           man admitting it, out loud, on a loudspeaker, in hour eight.
# reaction: .060 and .080 answer only the SOUND. Dex hears a blown driver; the fighter
#           hears his childhood through a wall. Neither hears a word of it, and that is
#           the plant working (P1-a) - the player will remember the voice, not the speech.
#
# *** ESCALATION 2 - BAND. ***
# `type: ambient` is 6-16 words. Vex's three lines are 26-29. There is no way to write
# "longest sentences in the game" inside a sixteen-word cap, and the stub itself says the
# lines may sit in the "ambient/cutscene band". I did NOT edit the header - changing `type`
# is L1's call, not mine. Two clean fixes, story-architect picks:
#   (a) `type: cutscene` on this file (the plaza IS a staged set-piece), or
#   (b) a per-line band override field in SCRIPT_FORMAT for recordings and broadcasts.
# Every non-Vex line in this scene is inside 6-16 except the two deliberate one-word
# beats (.040, .100), which are the same ceiling-not-floor reading as M1.1.
#
# *** ESCALATION 3 - DATES. ***
# The scene is titled The Anniversary and Vex names no year and no number of years. That
# is deliberate: 02.2 puts the Meridia Blight at 441 AE, 02.6 says Vex is 68 and has spent
# "thirty years" justifying it, and those two do not reconcile. Rather than pick one I
# wrote copy that survives either. If L1 fixes the date later, no line here changes.
#
# krad-9:   .070's famine is pre-Compact (02.2 names "famine cycles" as the thing the
#           Helion Compact promised to end), on a mining world that grows nothing. It
#           contradicts nothing and it hands M1.4/the hub a free Brick hook (AR-11 puts
#           him on Krad-9). Offered, not claimed - L1 may bin it.
# variance: 1 w (.040 "Long.") to 29 w (.070) = 29x.
# flag:     Story.Clue.BlightBroadcast is set on .090 (see note). Tag does not exist yet.

lines:
  - id:      M1.3.S02.010
    speaker: VOSS
    voice:   voss
    text:    "Those crowns are pulling off the district feed."
    shot:    "The plaza from a stair mouth. White-gold light on the mast, sodium orange on everything under it. A few hundred people standing very still in the warm rain."

  - id:      M1.3.S02.020
    speaker: DEX
    voice:   dex
    text:    "Four hundred people standing still. That's not a crowd, that's furniture."

  - id:      M1.3.S02.030
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "How long does he usually--"

  - id:      M1.3.S02.040
    speaker: MARA
    voice:   mara
    interrupts: true
    text:    "Long."

  - id:      M1.3.S02.050
    speaker: VEX
    voice:   malachar_vex
    tags:    [quietly]
    text:    "One is not asked to grieve tonight, only to remember, and to remember correctly, because the hunger came before the order and not because of it."
    shot:    "Nobody in the plaza looks up at the speakers. Looking up is the same mistake as walking away."
    note:    "Vex line 1 of 3. Band exception - see L2 escalation 2. 'One', never 'I'."

  - id:      M1.3.S02.060
    speaker: DEX
    voice:   dex
    text:    "Third crown's blown. That buzz sitting on top of him."
    note:    "The required reaction: he hears a failed driver, not a sentence. 18.4 - technical noun as the whole of his opinion."

  - id:      M1.3.S02.070
    speaker: VEX
    voice:   malachar_vex
    text:    "In the last year before the Compact, four hundred thousand died on Krad-9 of a shortage that three neighbouring worlds had the grain to end and no reason to."
    note:    "Vex line 2 of 3. His tic: a pre-Dominion casualty statistic offered as comfort."

  - id:      M1.3.S02.080
    speaker: FIGHTER_B
    voice:   eclipse_fighter_b
    text:    "My mother could hear this through a foundry wall."

  - id:      M1.3.S02.090
    speaker: VEX
    voice:   malachar_vex
    tags:    [quietly]
    text:    "Order is not found; it is bought, at a price already paid, in a ledger no one in this district will ever be asked to read."
    shot:    "Hold on the speaker crowns. The rain is coming off them in threads."
    note:    "Vex line 3 of 3, and the last word he speaks until act 4. SETS Story.Clue.BlightBroadcast. This is a confession the player cannot spend yet; it must play as clemency."

  - id:      M1.3.S02.100
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Tone."
    shot:    "The curfew tone. The whole plaza starts walking on the same second, in the same direction, without hurrying."

  - id:      M1.3.S02.110
    speaker: MARA
    voice:   mara
    text:    "Behind the last of them."

  - id:      M1.3.S02.120
    speaker: VOSS
    voice:   voss
    text:    "Ring gates hinge outward. Somebody hold one open."
