# ---- the three-sentence contract (18.7) ----
want:         "Mara wants the district's ears shut for one night, and wants everyone in the room to know this is not a robbery."
obstacle:     "Every cell on Kessara that ever made a noise this loud is a place and a count Dex can recite, and not one of them is a name he can give."
turn:         "Dex volunteers to set the charge himself, which is the first thing he has ever asked to do."

