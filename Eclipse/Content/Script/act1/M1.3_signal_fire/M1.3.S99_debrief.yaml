# ---- dialogue-writer notes (L2) ----
#
# *** THE STRATEGY LAYER ANSWERS, AND NOBODY EXPLAINS IT. ***
# Three places, none of them a statement:
#   .080-.110  a fighter reports people at the top of the stair. Mara asks how many. The
#              number he gives is bigger than the number he saw on his way down. That is
#              the district turning, measured in the only unit this game trusts - people -
#              and it takes four lines and no adjectives.
#   .230       Voss names the next place. He is answering a strategic question with a
#              district, which is the map layer coming out of a mouth. The `strategic`
#              variant is the strongest version of the owner's note: a man who has already
#              worked out that a deaf district is an open door. He never says the region
#              flipped; he says what the flip is FOR.
#   .140       eleven bunks. The cost of winning arrives as furniture.
# Nothing in this file commits the flip. SPEC-P2-05 does that off Event.Mission.Completed
# and it must stay the only writer of region state.
#
# omitted:  the depot optional. The beat sheet lists "+60 M, SupplyDepot stores intact",
#           but MT_M13 ships with NO optional objective in data, on purpose (see the
#           comment in setup_story_missions.py). Nobody in this room mentions a depot,
#           because a debrief that congratulates the squad on an objective the runtime
#           never scored is a lying line. ESCALATED - see report.
# peak:     the map mark is a `shot` (.190) and the dialogue around it is a question about
#           stationery and a one-word answer. That is on purpose. The banality is what
#           makes it land, and it is the only way to hit the emotional peak of movement II
#           without a thesis sentence. No direct_beat is spent in this mission (AR-12
#           reserves act 1's single one for M1.8).
# threx:    the walk-around is .160-.190. Dex says the air is open, says "anybody" twice,
#           and does not say the name. Mara answers with one word about a time of day.
#           Nobody mentions Threx and everybody in the room is thinking about him.
# haste:    .260 "Four days." She overrules a week without giving a reason and nobody asks
#           for one. Second plant of the thing that kills her, after M1.3.S06.210.
# defer:    .220 is the second time she puts Voss's judgement above her own (after
#           M1.1.S04), and she does it by handing him an object, not a compliment.
# reyes:    zero contractions in six lines. She is the one keeping the count and she is
#           the one who is cut off for keeping it (.140/.150).
# dex:      his joke comes back at .280 and it is a callback to S01.360 - the gloves. Half
#           strength, which is the right strength, because he lost the other half in S06.
# band:     `cutscene` (20-60) read as a ceiling. Longest line 29 w (.055). Same ruling as
#           S01: no line is over the ceiling.
# variance: 1 w (.100 "Nine.") to 29 w (.055) = 29x.
# em-dash:  two interrupted lines in 29 (.070/.080, .140/.150). Rate 1:14.
# words:    233 = 186 spoken base + 47 in the four .230 variants. Hand-counted, no shell.
#           The 204 this field carried before matched my count of the old file exactly,
#           which is why I trust the 233.
#
# *** .055 ADDED 01-08. BEAT 2 WAS BEING CLIPPED, AND THAT IS WHY THIS SCENE WAS RED. ***
# The beat sheet asks for a man who CANNOT STOP TALKING about the mast and is pushing
# something else away with it. What was here was three staccato lines and then an
# interruption - that is a man who says three things, not a man who cannot stop. The flood
# is the beat. It is also the only place in this room where anybody HAS room: everyone
# else is counting bunks, counting weeks, or holding a pencil.
# Written so it ENDS IN METAL. He puts his own hands over his head in passing, as evidence
# of how big the thing was, and runs straight back into the footing. 18.4 Dex reports his
# own fear as instrumentation and never lands on it, so the line may not close on his body.
# It restates .050 in more detail on purpose (18.9 D - people repeat while they can still
# hear it), and it lands his own work: the collar he set in S04 took the whole load.
# REGISTER was the finding, not the reason. If L1 ever cuts this line the scene goes red
# again, and it should, because the beat would be clipped again.

lines:
  - id:      M1.3.S99.010
    speaker: REYES
    voice:   reyes
    text:    "Two burns and a shoulder."
    shot:    "They come down the last flight one at a time. Reyes is counting them in without appearing to."

  - id:      M1.3.S99.020
    speaker: REYES
    voice:   reyes
    text:    "The shoulder will not lift above here for six weeks."

  - id:      M1.3.S99.030
    speaker: MARA
    voice:   mara
    text:    "Six weeks."

  - id:      M1.3.S99.040
    speaker: REYES
    voice:   reyes
    text:    "I do not guess at that. Six."
    note:    "18.4 Reyes: never guesses out loud, and says so when somebody hopes she might. No contractions - she has been awake for nineteen hours."

  - id:      M1.3.S99.050
    speaker: DEX
    voice:   dex
    text:    "It didn't fall. It folded. Like it sat down."

  - id:      M1.3.S99.055
    speaker: DEX
    voice:   dex
    text:    "I was flat on the stones with my hands over my head and I felt the whole load go into the footing and the legs come in on themselves."
    note:    "Beat 2, the flood. He gives his own hands over his head as a measuring instrument and then runs back into the metal, which is the only direction 18.4 lets him go. Nobody stops him yet."

  - id:      M1.3.S99.060
    speaker: DEX
    voice:   dex
    text:    "That's a good casting failing correctly. That's a beautiful thing."

  - id:      M1.3.S99.070
    speaker: DEX
    voice:   dex
    text:    "And the crowns came in on top of it and the whole plaza just--"

  - id:         M1.3.S99.080
    speaker:    FIGHTER_A
    voice:      eclipse_fighter_a
    interrupts: true
    text:       "There's people at the top of the stair."

  - id:      M1.3.S99.090
    speaker: MARA
    voice:   mara
    text:    "How many."

  - id:      M1.3.S99.100
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "Nine."

  - id:      M1.3.S99.110
    speaker: FIGHTER_A
    voice:   eclipse_fighter_a
    text:    "There were four when I came down."
    shot:    "Nobody says anything for a moment. Somewhere above them a door is being held open."
    note:    "The Foothold, felt and not stated. The number grew while a man walked down a stair. Nobody in the room comments on it, which is the only reason it works."

  - id:      M1.3.S99.120
    speaker: MARA
    voice:   mara
    tags:    [pause]
    text:    "Take names. Nothing else tonight."
    note:    "She wants them and she holds. M1.6.S06 is where she stops holding, and that beat belongs to that writer - this is a rhyme, not a payment."

  - id:      M1.3.S99.130
    speaker: REYES
    voice:   reyes
    text:    "Names and hands. I would like to know which of them can hold a light."

  - id:      M1.3.S99.140
    speaker: REYES
    voice:   reyes
    text:    "There are eleven bunks in that room and I have counted--"

  - id:         M1.3.S99.150
    speaker:    MARA
    voice:      mara
    interrupts: true
    text:       "Then somebody gives up a bunk."
    note:       "She cuts off the person doing the arithmetic. That is the haste, one scene before it is named as anything."

  - id:      M1.3.S99.160
    speaker: DEX
    voice:   dex
    text:    "The band's open now. The whole district."

  - id:      M1.3.S99.170
    speaker: DEX
    voice:   dex
    text:    "Anybody can hear anything."

  - id:      M1.3.S99.180
    speaker: DEX
    voice:   dex
    tags:    [beat]
    text:    "Anybody."
    shot:    "He is talking to the table. Nobody picks it up."
    note:    "The walk-around. The name is never said in this room, tonight or in this act."

  - id:      M1.3.S99.190
    speaker: MARA
    voice:   mara
    text:    "Morning."
    shot:    "She pulls the district sheet flat, takes a grease pencil out of her coat, and marks the checkpoint. It takes about two seconds. Nobody in this cell has seen her use that pencil."
    note:    "EMOTIONAL PEAK OF MOVEMENT II. One word about a time of day, and a mark. No thesis line, no music cue in the text, nobody names what it is."

  - id:      M1.3.S99.200
    speaker: REYES
    voice:   reyes
    text:    "Is that pencil going to come off?"

  - id:      M1.3.S99.210
    speaker: MARA
    voice:   mara
    text:    "No."

  - id:      M1.3.S99.220
    speaker: MARA
    voice:   mara
    text:    "Say where the next one goes."
    shot:    "She holds the pencil out. Not to the room."
    note:    "Second deferral to Voss after M1.1.S04, and she does it with an object instead of a compliment. AR-5 clean - no 'you' anywhere in the line."

  - id:      M1.3.S99.230
    speaker: VOSS
    voice:   voss
    text:    "Foundry Row."
    note:    "The strategy layer in a mouth. FoundryRow is exactly what SPEC-P2-05's Foothold opens up (setup_story_missions.py: MT_M14 becomes selectable because TransitCheckpoint is now player-held). He is reading a map that changed tonight and he does not say that it changed."
    variants:
      pragmatist: "Foundry Row. They keep the rifles and we keep counting rounds."
      idealist:   "Foundry Row. The nine at the top of that stair came with nothing."
      personal:   "Foundry Row. My shift-mark is still cut in that gate."
      strategic:  "Foundry Row. This district is deaf for a week. Deaf is a door."

  - id:      M1.3.S99.240
    speaker: MARA
    voice:   mara
    text:    "When."

  - id:      M1.3.S99.250
    speaker: VOSS
    voice:   voss
    text:    "Give it a week."

  - id:      M1.3.S99.260
    speaker: MARA
    voice:   mara
    text:    "Four days."
    note:    "No reason offered, none asked for. This is the haste that kills her, planted twice in one mission and explained neither time."

  - id:      M1.3.S99.270
    speaker: DEX
    voice:   dex
    text:    "Four days."

  - id:      M1.3.S99.280
    speaker: DEX
    voice:   dex
    text:    "I want the gloves back before then."
    shot:    "Mara is still holding the pencil. She has not put it down since she marked the sheet."
    note:    "The joke returns at half strength, and it is the S01.360 gloves. He got some of it back. Not all of it."
