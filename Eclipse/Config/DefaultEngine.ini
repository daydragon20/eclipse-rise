[/Script/EngineSettings.GameMapsSettings]
; The graybox district is built at runtime by AEclipseGameMode (SPEC-P1-05):
; reproducible from code, no authored .umap until the art pass.
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/Eclipse.EclipseGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.RendererSettings]
; Lumen GI + reflections are the project baseline (GDD 12.1).
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/NavigationSystem.NavigationSystemV1]
; Invoker-driven navmesh (SPEC-P1-05 graybox): generation follows characters, so
; er hoeft geen navmesh gebouwd te worden waar niemand loopt.
;
; LET OP — hier stond "no authored bounds volume needed", en dat was FOUT. Deze
; vlag bepaalt WELKE tegels binnen de navigatiegrenzen gebouwd worden; hij
; vervangt de grenzen niet. Met nul grenzen is er nul navmesh, invokers of niet,
; en dan weigert de squad elke verplaatsingsorder met NoRoute. Gemeten door de
; speelronde 2026-07-25: navigatiesysteem aanwezig, 1 nav-data-actor, 0 grenzen.
; De grens komt nu uit EclipseGrayboxBuilder, net als de rest van het district.
bGenerateNavigationOnlyAroundNavigationInvokers=True

[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic

; ---- OPPERVLAKTETYPES (owner-levering 26-07: Footsteps_Volume_02) -----------
;
; Het pack levert 206 voetstapcues per oppervlak, en er was geen enkel
; oppervlaktetype gedefinieerd — geen physical material van ons, geen regel code
; die er een uitlas. Dat maakte "voetstappen per oppervlak" geen audiowerk maar
; kitwerk, en dit is de kit.
;
; Zes types, en precies zes omdat het pack er voor zes cues heeft. Een type
; declareren waar geen geluid bij hoort is een belofte zonder dekking.
;
; Kessara is industrieel: Metal (loopvlakken, roosters, dekplaat) en Concrete
; (het plein, de straat) dragen het district. Mud, Grass, Sand en Wood staan
; klaar voor gebieden die er nog niet zijn — hun cues bestaan al, alleen het
; physical material op de vloer ontbreekt.
[/Script/Engine.PhysicsSettings]
+PhysicalSurfaces=(Type=SurfaceType1,Name="Metal")
+PhysicalSurfaces=(Type=SurfaceType2,Name="Concrete")
+PhysicalSurfaces=(Type=SurfaceType3,Name="Mud")
+PhysicalSurfaces=(Type=SurfaceType4,Name="Grass")
+PhysicalSurfaces=(Type=SurfaceType5,Name="Sand")
+PhysicalSurfaces=(Type=SurfaceType6,Name="Wood")

[/Script/Engine.Engine]
; DE VIEWPORT CLIENT DIE COMMONUI VRAAGT.
;
; Bij elke start stond dit als ERROR in het log:
;   "Using CommonUI without a CommonGameViewportClient derived game viewport
;    client. CommonUI Input routing will not function correctly."
;
; De engine zegt daar letterlijk dat invoerroutering NIET goed werkt, en dat is
; geen theorie: de owner meldde op 25-07 dat twaalf gameplay-acties de gamepad
; bereikten maar de testgids op de View-knop niet in het log verscheen. In de
; code stond het vermoeden al opgeschreven — "View/Menu zijn precies de knoppen
; die een UI-laag pleegt op te eten" — maar de oorzaak is nooit weggenomen.
;
; CommonUI komt binnen als plugin-afhankelijkheid; zonder deze regel draait het
; project in een configuratie die de plugin zelf ongeldig noemt.
GameViewportClientClassName=/Script/CommonUI.CommonGameViewportClient
