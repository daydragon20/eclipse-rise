[/Script/Engine.InputSettings]
; Enhanced Input is the only input path (GDD 12.1): context stacks for foot/command/vehicle/map.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; GEMETEN DEFECT, feel-harnas laag 2 (2026-07-25): het kijken liep op 600 gr/s
; terwijl DA_CharacterTuning 240 gr/s zegt en het testgids-paneel "1,50 s per 360"
; toont. De echte draai kostte 0,60 s.
;
; Oorzaak: met bEnableLegacyInputScales AAN (de engine-default, voor achterwaartse
; compatibiliteit) vermenigvuldigt APlayerController::AddYawInput/AddPitchInput nog
; met InputYawScale = 2.5 en InputPitchScale = -2.5 uit Engine/Config/BaseGame.ini.
; Dat zijn schalen uit het oude input-systeem, waar een as-mapping zelf geen
; gevoeligheid droeg. AEclipsePlayerController::HandleLook rekent al in graden per
; seconde met een eigen curve en deadzone, dus die schaal was een tweede,
; onzichtbare gevoeligheidsknop bovenop de getunede — en de NEGATIEVE pitch-schaal
; maakte bovendien dat de handler een verborgen omkering compenseerde.
;
; Uit betekent: de getunede waarden zijn de waarheid en het paneel dat ze toont
; liegt niet meer. De muis blijft even snel doordat MouseLookScale mee omhoog ging
; naar 2.5 (kale schaal zonder eenheid — daar telt gedrag, niet het getal).
bEnableLegacyInputScales=False

[/Script/Engine.PlayerInput]
; Debug-console-toetsen (feel-audit S3, 2026-07-25). DIT is de duurzame plek:
; Saved/Config/<Platform>/Input.ini is de GEGENEREERDE configlaag — die is van de
; engine, staat niet in de repo en wordt bij afsluiten teruggeschreven, dus een
; regel die je daar met de hand inzet overleeft niet betrouwbaar. Config/
; DefaultInput.ini staat wel in de repo en reist mee naar elke machine.
;
; Welke map een run leest: de platformnaam komt uit FPlatformProperties, en die
; is "WindowsEditor" voor ELKE run van UnrealEditor.exe — ook met -game, want de
; binary is de editor. Een gepackagede build leest "Windows". Beide lezen deze
; DefaultInput.ini als onderliggende laag, dus hier werkt het in alle drie.
;
; F9 heeft daarnaast een echte Enhanced-Input-binding in code
; (AEclipsePlayerController::SetupInputComponent) en heeft deze regel dus niet
; nodig; F10 leunt er wel op. Bij missiestart logt de game hoeveel bindings er
; werkelijk geladen zijn, zodat "niet geladen" en "niet ingedrukt" uit elkaar te
; houden zijn.
+DebugExecBindings=(Key=F9,Command="Eclipse.Feel.Dump")
+DebugExecBindings=(Key=F10,Command="Eclipse.Command.Dump")
